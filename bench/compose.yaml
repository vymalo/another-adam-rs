# The benchmark stack (bench/README.md, "The stack"): the pieces of the dev stack that a headless adam-coder
# needs, one Podman service, one coder and one git sandbox for each slot, and a separate Podman service that grades.
# `bench` brings it up, writes the per-run settings of a coder to `$BENCH_STACK_DIR/slot-N.env` (mode 0600, removed once
# the coder is created) and recreates the coder for each run. Every credential in this file is a dummy; the model's key
# is never here: it lives in the harness's meter, which the stack reaches only through the `meter-N` relays.
#
# Every container here runs the one coder image of bench/pins.json (the relays, the git sandbox, the pusher) or a
# service of the dev stack; no other image is added.
#
# Variables the harness sets (a person never needs to): BENCH_STACK_DIR,
# BENCH_AGENT_DIR, BENCH_SLOT_1_DIR and BENCH_SLOT_2_DIR (what the harness hands a slot's agent service: a statement,
# the OpenCode binary), BENCH_METER_PORT, PODMAN_SECCOMP, and the optional BENCH_GIT_PORT, BENCH_CODER_1_PORT,
# BENCH_CODER_2_PORT.
#
# Networks (all `internal` but egress; a test over the rendered file holds each member list):
#   agentnet-N   podman-N and meter-N. A container the Podman service runs shares the service's network namespace
#                (dev/podman/README.md), so what an agent's commands reach is exactly this: the meter relay.
#   slot-N       coder-N, meter-N, pub-coder-N, git-server, postgres, mock-github. The coders never share a network
#                with a Podman service, and slot 1 never shares one with slot 2 (git-server, postgres and mock-github
#                are on both: they answer, they do not connect the slots).
#   gitpub-net   git-server, pub-git and the pushers.
#   grader-net   grader, alone.
#   egress       a plain bridge, only for the relays, each of which forwards to one fixed target: meter-N (the harness's
#                meter on the host), pub-coder-N (the coder's A2A port, published on the loopback) and pub-git (the git
#                server, published on the loopback). Nothing else is on it, so no coder, sandbox, git server or
#                Podman service has a route to the internet. A Podman service joins it only while the harness pulls
#                an image (`docker network connect`), and the grader only while a verifier needs the network.
#
# Two slots: one 4 CPU, 12 GB Podman service for each is what one desktop can run at once. A third needs services
# `podman-3`, `coder-3`, `gitbox-3`, `meter-3`, `pub-coder-3`, `pusher-3`, a database in postgres-init.sql, two networks
# and three volumes.

name: adam-bench

x-wiremock: &wiremock
  image: wiremock/wiremock:3.13.2
  restart: "no"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

x-image: &image ghcr.io/vymalo/another-adam-rs/coder:sha-3f668c3@sha256:dad89fc8f89f176cd4884d2370bc7de73bb8a884c067867ec1d2344586d8c72b

x-podman: &podman
  build:
    context: ../dev/podman
    dockerfile: Containerfile
  image: adam-rs/podman:dev
  restart: "no"
  user: "10001:10001"
  command: ["podman", "system", "service", "--time=0", "unix:///run/podman/podman.sock"]
  environment:
    PODMAN_IGNORE_CGROUPSV1_WARNING: "1"
  security_opt:
    # The three options of dev/compose.devcontainer.yaml, for the reasons in dev/podman/README.md. An absolute path,
    # set by the harness: whether Compose resolves a relative one against the project directory is unverified.
    - seccomp=${PODMAN_SECCOMP:?the harness sets PODMAN_SECCOMP to the absolute path of dev/podman/seccomp.json}
    - systempaths=unconfined
    - apparmor=unconfined
  # No privileged, no cap_add, no devices. The service bounds every container it runs together: their own cgroups are
  # off, so one run at a time for each service.
  cpus: 4
  mem_limit: 12g
  pids_limit: 4096
  healthcheck:
    test: ["CMD", "podman", "--remote", "--url", "unix:///run/podman/podman.sock", "info"]
    interval: 5s
    timeout: 10s
    retries: 24
    start_period: 5s

x-coder: &coder
  image: *image
  restart: "no"
  environment: &coder-env
    MODEL_API_KEY: bench-dummy-key # the meter holds the real key
    MODEL: bench-model
    WORKSPACE_ROOT: /work
    WORKSPACE_SWEEP_SECS: "0" # the worktree stays until the harness has copied it
    # The bench serves plain http from its own git server. ALLOWED_REPO_HOSTS is that server only; a local path or a
    # file:// URL is still accepted by ALLOW_LOCAL_REPOS (crates/adam-workspace, Policy::check), and is harmless
    # here: the coder's container holds nothing but the work volume.
    ALLOWED_REPO_HOSTS: git-server
    ALLOW_LOCAL_REPOS: "true"
    GITHUB_API_URL: http://mock-github:8080 # open_pull_request succeeds, so a run completes instead of parking
    GITHUB_TOKEN: bench-dummy-token
    ADAM_AGENT_DIR: /etc/adam/agent
    DEVCONTAINER_RUNTIME: podman
    CONTAINER_HOST: unix:///run/podman/podman.sock
    DEVCONTAINER_PREPULL: "false"
    DEVCONTAINER_NETWORK: inherit
    # The coder's git runs in the sandbox, where no secret is readable (docs/reference/environment.md, GIT_SANDBOX_SOCKET).
    GIT_SANDBOX_SOCKET: /work/.gitbox/git.sock
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 10s

x-relay: &relay
  image: *image
  restart: "no"
  user: "10001:10001"
  read_only: true
  entrypoint: ["node", "/relay.mjs"]
  volumes:
    - ./lib/relay.mjs:/relay.mjs:ro

x-gitbox: &gitbox
  image: *image
  restart: "no"
  user: "10001:10001"
  read_only: true
  entrypoint: ["sh", "-c", "mkdir -p /work/.gitbox && exec tini -- adam-git-sandbox"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  network_mode: none
  environment:
    GIT_SANDBOX_LISTEN: /work/.gitbox/git.sock
    GIT_SANDBOX_ROOT: /work

x-pusher: &pusher
  image: *image
  restart: "no"
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=256m"]
  entrypoint: ["sh", "-c"]
  profiles: [tools]
  networks: [gitpub-net]

services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_PASSWORD: postgres # dummy, local only, on internal networks
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-bench.sql:ro
    networks: [slot-1, slot-2]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mock-github:
    <<: *wiremock
    command: ["--global-response-templating"]
    volumes:
      - ../dev/wiremock/mock-github/mappings:/home/wiremock/mappings:ro
      - ../dev/wiremock/mock-github/__files:/home/wiremock/__files:ro
    networks: [slot-1, slot-2]

  git-server:
    build:
      context: ../dev/git-server
    restart: "no"
    environment:
      AUTO_CREATE_OWNERS: bench # bench/<repository>.git is made, empty, the first time it is pushed to
    volumes:
      - git-data:/srv/git
    networks: [slot-1, slot-2, gitpub-net]

  # The relays: each forwards the bytes of a connection to one fixed address and reads none of them.
  meter-1:
    <<: *relay
    environment:
      RELAY_PORT: "8090"
      RELAY_TARGET: host.docker.internal:${BENCH_METER_PORT:?the harness sets BENCH_METER_PORT}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [agentnet-1, slot-1, egress]

  meter-2:
    <<: *relay
    environment:
      RELAY_PORT: "8090"
      RELAY_TARGET: host.docker.internal:${BENCH_METER_PORT}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [agentnet-2, slot-2, egress]

  pub-coder-1:
    <<: *relay
    environment:
      RELAY_PORT: "8080"
      RELAY_TARGET: coder-1:8080
    ports: ["127.0.0.1:${BENCH_CODER_1_PORT:-18081}:8080"]
    networks: [slot-1, egress]

  pub-coder-2:
    <<: *relay
    environment:
      RELAY_PORT: "8080"
      RELAY_TARGET: coder-2:8080
    ports: ["127.0.0.1:${BENCH_CODER_2_PORT:-18082}:8080"]
    networks: [slot-2, egress]

  pub-git:
    <<: *relay
    environment:
      RELAY_PORT: "8080"
      RELAY_TARGET: git-server:8080
    ports: ["127.0.0.1:${BENCH_GIT_PORT:-18083}:8080"]
    networks: [gitpub-net, egress]

  # What an agent's commands run on: one Podman service for each slot. It mounts the slot's work volume and one
  # directory the harness writes (a statement, the OpenCode binary), read-only: never $BENCH_HOME, so no hidden test,
  # gold patch, ledger or other run is visible to it.
  podman-1:
    <<: *podman
    volumes:
      - podman-socket-1:/run/podman
      - podman-storage-1:/home/agent/.local/share/containers
      # The coder's work volume at the same path as in the coder: a bind source is resolved by the service.
      - work-1:/work
      - ${BENCH_SLOT_1_DIR:?the harness sets BENCH_SLOT_1_DIR}:${BENCH_SLOT_1_DIR}:ro
    networks: [agentnet-1]

  podman-2:
    <<: *podman
    volumes:
      - podman-socket-2:/run/podman
      - podman-storage-2:/home/agent/.local/share/containers
      - work-2:/work
      - ${BENCH_SLOT_2_DIR}:${BENCH_SLOT_2_DIR}:ro
    networks: [agentnet-2]

  # What grades: a grading's tests and patch are staged in a volume of its own and mounted read-only into the grading
  # container only. No agent can reach this service: it is on a network of its own with nothing else on it, and it
  # mounts no directory of the host.
  grader:
    <<: *podman
    volumes:
      - grader-socket:/run/podman
      - grader-storage:/home/agent/.local/share/containers
      # Nothing of the host's: the harness copies a grading's tests and patch in, as tar streams, into /grade/<id>, and reads the
      # reward out the same way (lib/stack.mjs, graderIO).
    # A volume of memory, writable by the service's user and gone with the service:
    tmpfs: ["/grade:mode=1777,size=1g"]
    networks: [grader-net]

  gitbox-1:
    <<: *gitbox
    volumes: ["work-1:/work"]

  gitbox-2:
    <<: *gitbox
    volumes: ["work-2:/work"]

  coder-1:
    <<: *coder
    depends_on:
      podman-1: { condition: service_healthy }
      gitbox-1: { condition: service_started }
      postgres: { condition: service_healthy }
      git-server: { condition: service_started }
      mock-github: { condition: service_healthy }
      meter-1: { condition: service_started }
    environment:
      <<: *coder-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/adam_bench_1
      PUBLIC_URL: http://127.0.0.1:${BENCH_CODER_1_PORT:-18081}/
      DEVCONTAINER_DEPLOYMENT_ID: bench-slot-1
    # The run's own settings: the model address (with the run's meter token), the A2A bearer, the task image.
    env_file:
      - path: ${BENCH_STACK_DIR:?the harness sets BENCH_STACK_DIR}/slot-1.env
        required: false
    volumes:
      - work-1:/work
      - podman-socket-1:/run/podman
      - ${BENCH_AGENT_DIR:?the harness sets BENCH_AGENT_DIR}:/etc/adam/agent:ro
    networks: [slot-1]

  coder-2:
    <<: *coder
    depends_on:
      podman-2: { condition: service_healthy }
      gitbox-2: { condition: service_started }
      postgres: { condition: service_healthy }
      git-server: { condition: service_started }
      mock-github: { condition: service_healthy }
      meter-2: { condition: service_started }
    environment:
      <<: *coder-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/adam_bench_2
      PUBLIC_URL: http://127.0.0.1:${BENCH_CODER_2_PORT:-18082}/
      DEVCONTAINER_DEPLOYMENT_ID: bench-slot-2
    env_file:
      - path: ${BENCH_STACK_DIR}/slot-2.env
        required: false
    volumes:
      - work-2:/work
      - podman-socket-2:/run/podman
      - ${BENCH_AGENT_DIR}:/etc/adam/agent:ro
    networks: [slot-2]

  # One-shot: puts a run's base on the git server from a container (the host runs no git in a repository a container
  # wrote). `docker compose run --rm pusher-N '<script>'`; the base is read from the slot's work volume.
  pusher-1:
    <<: *pusher
    volumes: ["work-1:/work:ro"]

  pusher-2:
    <<: *pusher
    volumes: ["work-2:/work:ro"]

networks:
  agentnet-1:
    internal: true
  agentnet-2:
    internal: true
  slot-1:
    internal: true
  slot-2:
    internal: true
  gitpub-net:
    internal: true
  grader-net:
    internal: true
  egress: {}

volumes:
  postgres-data:
  git-data:
  podman-socket-1:
  podman-socket-2:
  podman-storage-1:
  podman-storage-2:
  grader-socket:
  grader-storage:
  work-1:
  work-2:
