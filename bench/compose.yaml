# The benchmark stack (bench/README.md, "The stack"): the pieces of the dev stack that a headless adam-coder
# needs, one git sandbox and one meter relay for each slot, and the relays the host reaches. The arms and the
# grading are host containers of the task image, started by the harness on the host's Docker (lib/containers.mjs,
# lib/stack.mjs): they are not services of this file. Each image is in the host's store once.
#
# `bench` brings it up, writes the per-run settings of a coder to `$BENCH_STACK_DIR/slot-N.env` (mode 0600, removed
# once the coder is created) and starts the coder for each run. Every credential in this file is a dummy; the
# model's key is never here: it lives in the harness's meter, which the stack reaches only through the `meter-N`
# relays.
#
# Every container here runs the one coder image of bench/pins.json (the relays, the git sandbox, the pusher) or a
# service of the dev stack; no other image is added.
#
# Variables the harness sets (a person never needs to): BENCH_WORK_1_DIR and BENCH_WORK_2_DIR (the slot's work
# directory on the host), BENCH_METER_PORT, and the optional BENCH_GIT_PORT.
#
# Networks (all `internal` but egress; a test over the rendered file holds each member list):
#   slot-N       git-server, meter-N, mock-github, postgres. The coder of the slot joins it at run time (its host
#                container is started with `--network adam-bench_slot-N`); slot 1 never shares a network with slot
#                2 (git-server, postgres and mock-github are on both: they answer, they do not connect the slots).
#   gitpub-net   git-server, pub-git and the pushers.
#   verifier     no service: the network a grading's host container joins (`adam-bench_verifier`), so gradings
#                share one internal network and have no route out. The harness creates it (`stack.up`), because
#                Compose does not make a network that has no service.
#   egress       a plain bridge, only for the relays, each of which forwards to one fixed target: meter-N (the
#                harness's meter on the host) and pub-git (the git server, published on the loopback). Nothing
#                else is on it. A grading whose verifier asks for the internet is started with
#                `--network adam-bench_egress` by the harness, alone, in its window.
#
# Two slots: one git sandbox and one meter relay for each is what one desktop can run at once. A third needs
# `gitbox-3`, `meter-3`, `pusher-3`, a database in postgres-init.sql, two networks and a work directory.

name: adam-bench

x-wiremock: &wiremock
  image: wiremock/wiremock:3.13.2
  restart: "no"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

x-image: &image ghcr.io/vymalo/another-adam-rs/coder:sha-9a9e6c5@sha256:638358b171881ea6bf2f9529a4002e6b27e0b59261aaaeac931f15132d0a269d

x-relay: &relay
  image: *image
  restart: "no"
  user: "10001:10001"
  read_only: true
  entrypoint: ["node", "/relay.mjs"]
  volumes:
    - ./lib/relay.mjs:/relay.mjs:ro

x-gitbox: &gitbox
  image: *image
  restart: "no"
  user: "10001:10001"
  read_only: true
  entrypoint: ["sh", "-c", "mkdir -p /work/.gitbox && exec tini -- adam-git-sandbox"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  network_mode: none
  environment:
    GIT_SANDBOX_LISTEN: /work/.gitbox/git.sock
    GIT_SANDBOX_ROOT: /work

x-pusher: &pusher
  image: *image
  restart: "no"
  user: "10001:10001"
  read_only: true
  # /tmp holds only the one-line git configuration. The scratch repository (a whole copy of the base, as large as the
  # repository) is on the slot's work volume, /scratch below: never in memory, never in a size-limited tmpfs.
  tmpfs: ["/tmp:size=16m"]
  entrypoint: ["sh", "-c"]
  profiles: [tools]
  networks: [gitpub-net]

services:
  postgres:
    # PostgreSQL 18.7, the store's floor (ADR 0082, decision 11), by tag and digest (the OCI index
    # of docker.io/library/postgres:18.7, *verified 2026-11-27* from the registry). From 18 the image
    # keeps its data under /var/lib/postgresql/18/docker and refuses a mount at
    # /var/lib/postgresql/data, so the volume is mounted one level up, and it is a new volume: a
    # PostgreSQL 16 volume is not upgraded in place (`docker volume rm` the old one when done).
    image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    restart: "no"
    environment:
      POSTGRES_PASSWORD: postgres # dummy, local only, on internal networks
      POSTGRES_DB: postgres
    volumes:
      - postgres-18-data:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-bench.sql:ro
    networks: [slot-1, slot-2]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mock-github:
    <<: *wiremock
    command: ["--global-response-templating"]
    volumes:
      - ../dev/wiremock/mock-github/mappings:/home/wiremock/mappings:ro
      - ../dev/wiremock/mock-github/__files:/home/wiremock/__files:ro
    networks: [slot-1, slot-2]

  git-server:
    build:
      context: ../dev/git-server
    restart: "no"
    environment:
      AUTO_CREATE_OWNERS: bench # bench/<repository>.git is made, empty, the first time it is pushed to
    volumes:
      - git-data:/srv/git
    networks: [slot-1, slot-2, gitpub-net]

  # The relays: each forwards the bytes of a connection to one fixed address and reads none of them.
  meter-1:
    <<: *relay
    environment:
      RELAY_PORT: "8090"
      RELAY_TARGET: ${BENCH_METER_HOST:?the harness sets BENCH_METER_HOST}:${BENCH_METER_PORT:?the harness sets BENCH_METER_PORT}
    networks: [slot-1, egress]

  meter-2:
    <<: *relay
    environment:
      RELAY_PORT: "8090"
      RELAY_TARGET: ${BENCH_METER_HOST}:${BENCH_METER_PORT}
    networks: [slot-2, egress]

  # The coder is a host container on the slot's internal network; a relay on a network with a route out publishes its A2A
  # port on the loopback. The relay resolves the coder's name on the slot's network when a connection comes in.
  pub-coder-1:
    <<: *relay
    environment:
      RELAY_PORT: "8080"
      RELAY_TARGET: coder-1:8080
    ports: ["127.0.0.1:${BENCH_CODER_1_PORT:-18081}:8080"]
    networks: [slot-1, egress]

  pub-coder-2:
    <<: *relay
    environment:
      RELAY_PORT: "8080"
      RELAY_TARGET: coder-2:8080
    ports: ["127.0.0.1:${BENCH_CODER_2_PORT:-18082}:8080"]
    networks: [slot-2, egress]

  pub-git:
    <<: *relay
    environment:
      RELAY_PORT: "8080"
      RELAY_TARGET: git-server:8080
    ports: ["127.0.0.1:${BENCH_GIT_PORT:-18083}:8080"]
    networks: [gitpub-net, egress]

  # The git sandbox of a slot: the coder's git runs there (GIT_SANDBOX_SOCKET), in a container with no secret and
  # no network. It mounts the slot's work directory, which is the host's: the coder is a host container too.
  gitbox-1:
    <<: *gitbox
    volumes: ["${BENCH_WORK_1_DIR:?the harness sets BENCH_WORK_1_DIR}:/work"]

  gitbox-2:
    <<: *gitbox
    volumes: ["${BENCH_WORK_2_DIR:?the harness sets BENCH_WORK_2_DIR}:/work"]

  # One-shot: puts a run's base on the git server from a container (the host runs no git in a repository a container
  # wrote). `docker compose run --rm pusher-N '<script>'`; the base is read from the slot's work directory (read-only)
  # and the scratch repository is made in its `pusher-scratch` subdirectory (read-write, made by the harness).
  pusher-1:
    <<: *pusher
    volumes:
      - "${BENCH_WORK_1_DIR:?the harness sets BENCH_WORK_1_DIR}:/work:ro"
      - "${BENCH_WORK_1_DIR}/pusher-scratch:/scratch"

  pusher-2:
    <<: *pusher
    volumes:
      - "${BENCH_WORK_2_DIR:?the harness sets BENCH_WORK_2_DIR}:/work:ro"
      - "${BENCH_WORK_2_DIR}/pusher-scratch:/scratch"

networks:
  slot-1:
    internal: true
  slot-2:
    internal: true
  gitpub-net:
    internal: true
  verifier:
    internal: true
  egress: {}

volumes:
  postgres-18-data:
  git-data:
