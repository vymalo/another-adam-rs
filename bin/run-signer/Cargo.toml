[package]
name = "adam-run-signer"
description = "A loopback sidecar that signs a run's model requests with the run's own certificate before forwarding them to the gateway"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "adam_run_signer"
path = "src/lib.rs"

[[bin]]
name = "run-signer"
path = "src/main.rs"

[dependencies]
adam-core.workspace = true
adam-error.workspace = true
adam-model.workspace = true
adam-run-cert-broker.workspace = true
# `RunCertSettings`: the `RUN_CERT_*` names are read once, by the agents' own parser, so the sidecar
# and an agent can never disagree on them. Its default features stay on (the store adapters): the
# workspace and the image unify features with the agents beside it, so a lone `-p` build is the only
# one that could differ, and `default-features = false` would be a configuration nothing exercises.
adam-service.workspace = true
axum.workspace = true
base64.workspace = true
mimalloc.workspace = true
# `rustls` (aws-lc-rs) rather than the workspace's `rustls-no-provider`: the client this crate builds
# needs an installed TLS provider to exist at all (`reqwest::Client::build` panics without one), and
# `adam-run-cert-broker` — through `adam-service` — already links aws-lc-rs, as the coder image does.
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
