[package]
name = "adam-egress"
description = "An HTTPS-only egress proxy for run pods: CONNECT to an allow-list of names, resolved here, to public IPv4 addresses only"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "adam_egress"
path = "src/lib.rs"

[[bin]]
name = "adam-egress"
path = "src/main.rs"

[dependencies]
adam-error.workspace = true
async-trait.workspace = true
httparse.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
