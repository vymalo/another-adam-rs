[package]
name = "adam-coder"
description = "Coder agent over A2A: takes a coding task to a verified pull request (worktree, file edits, checks, push, PR)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "adam_coder"
path = "src/lib.rs"

[[bin]]
name = "adam-coder"
path = "src/main.rs"

# A scripted language server for the tests of the language server tools. Not shipped: the coder image
# builds the named binaries (`--bin adam-coder`, ...) and never this one.
[[bin]]
name = "adam-lsp-script"
path = "src/bin/adam-lsp-script.rs"
test = false
doc = false

[dependencies]
# `set_dumpable_behavior`: the process stops its same-user children from reading its environment
# (`/proc/<pid>/environ`) with a safe call, so `forbid(unsafe_code)` holds. Already in the tree.
adam = { workspace = true, features = ["a2a", "mcp"] }
adam-a2a.workspace = true
adam-a2a-runtime.workspace = true
adam-admission-local.workspace = true
adam-budget.workspace = true
adam-code-tools.workspace = true
adam-core.workspace = true
adam-env-kubernetes.workspace = true
adam-error.workspace = true
adam-host.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
adam-runtime.workspace = true
# The files' schedules: the scheduler and its `schedules` component (ADR 0060).
adam-schedule = { path = "../../crates/adam-schedule", version = "0.1.0" }
adam-service = { workspace = true, features = ["mcp"] }
adam-ui.workspace = true
adam-workspace.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
futures.workspace = true
globset.workspace = true
mimalloc.workspace = true
regex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# The OS limits on a command (ADR 0065 slice 3): rlimits, and a systemd scope where there is one.
[target.'cfg(unix)'.dependencies]
adam-confine.workspace = true

[build-dependencies]
adam-agent-fs = { workspace = true, features = ["build"] }

[dev-dependencies]
a2a-client-lf.workspace = true
a2a-lf.workspace = true
adam-mcp-testkit.workspace = true
adam-model-openai = { workspace = true, features = ["aws-lc"] }
adam-store-postgres.workspace = true
adam-store-testkit.workspace = true
adam-code-tools = { workspace = true, features = ["test-util"] }
adam-code-tools-testkit.workspace = true
adam-workspace = { workspace = true, features = ["test-util"] }
kube.workspace = true
proptest.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs"] }
adam-postgres.workspace = true
tokio-postgres = { version = "0.7", features = ["with-jiff-0_2", "with-serde_json-1", "with-uuid-1"] }
tempfile.workspace = true
uuid.workspace = true
wiremock.workspace = true

[lints]
workspace = true
