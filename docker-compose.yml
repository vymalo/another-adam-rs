# Local databases for the conformance suites.
#
#   docker compose up -d
#   ADAM_TEST_POSTGRES_URL=postgres://postgres:postgres@localhost:5432/adam_test \
#   ADAM_TEST_MONGODB_URI=mongodb://localhost:27017 \
#   cargo test --workspace
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adam_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mongodb:
    # Standalone mongod is enough: the store uses no multi-document transactions.
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 2s
      retries: 30
