# Git smart HTTP for /<owner>/<repo>[.git]/... over fcgiwrap + git-http-backend.
# Runs as an unprivileged user: every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # Pushes of real repositories can be large; this is a local test server.
  client_max_body_size 512m;

  server {
    listen 8080;

    # Both http://git-server:8080/local/sandbox.git and .../local/sandbox work
    # (git appends /info/refs, /git-upload-pack, /git-receive-pack, ...); the
    # repository on disk is always <owner>/<repo>.git.
    location ~ ^/(?<owner>[A-Za-z0-9._-]+)/(?<repo>[A-Za-z0-9._-]+?)(?:\.git)?(?<rest>/(?:info/refs|git-upload-pack|git-receive-pack|HEAD|objects/.*))$ {
      fastcgi_pass unix:/tmp/fcgiwrap.sock;
      fastcgi_read_timeout 300s;
      fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
      fastcgi_param GIT_PROJECT_ROOT /srv/git;
      fastcgi_param GIT_HTTP_EXPORT_ALL "";
      fastcgi_param PATH_INFO /$owner/$repo.git$rest;
      fastcgi_param REQUEST_METHOD $request_method;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param CONTENT_TYPE $content_type;
      fastcgi_param CONTENT_LENGTH $content_length;
      fastcgi_param REMOTE_ADDR $remote_addr;
      # Whatever the client sends is accepted; push is enabled per repository
      # (http.receivepack, set by entrypoint.sh).
      fastcgi_param REMOTE_USER $remote_user;
    }

    location / {
      default_type text/plain;
      return 404 "git-server: only /<owner>/<repo>.git smart HTTP is served\n";
    }
  }
}
