# Local development stack: databases, WireMock mocks of the external systems,
# a local git remote, and (profile `app`) the coder and a general agent wired to all of them.
# Everything binds to 127.0.0.1 only; every credential in here is a dummy.
#
#   docker compose up -d --wait          # postgres, mongodb and the mocks
#   docker compose --profile app up -d --build --wait   # ... and the coder and the agent
#   docker compose down -v               # stop and forget all state
#
# See "Local development" in README.md for the endpoints, the environment
# variables that point the code at the mocks, and the scenario switches.

name: adam-rs

x-wiremock: &wiremock
  # 3.13.2 is the newest 3.x release; the tag exists on Docker Hub (verified
  # 2026-09-29 against registry-1.docker.io, library listing of wiremock/wiremock).
  image: wiremock/wiremock:3.13.2
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  # ------------------------------------------------------------ databases --

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres # dummy, local only
      POSTGRES_DB: adam_test
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mongodb:
    # Standalone mongod is enough: the store uses no multi-document transactions.
    image: mongo:7
    ports: ["127.0.0.1:${MONGODB_PORT:-27017}:27017"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 2s
      retries: 30

  # ---------------------------------------------------------------- mocks --

  # OpenAI-compatible chat completions (also `/chat/completions` without /v1):
  # text and tool-call answers, streaming and not, and error scenarios.
  # Base URL for clients: http://127.0.0.1:8081/v1
  mock-openai:
    <<: *wiremock
    command: ["--global-response-templating"]
    ports: ["127.0.0.1:${MOCK_OPENAI_PORT:-8081}:8080"]
    volumes:
      - ./dev/wiremock/mock-openai/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/mock-openai/__files:/home/wiremock/__files:ro

  # The GitHub REST subset adam-workspace uses (list and open pull requests).
  # API root for clients: http://127.0.0.1:8082
  mock-github:
    <<: *wiremock
    command: ["--global-response-templating"]
    ports: ["127.0.0.1:${MOCK_GITHUB_PORT:-8082}:8080"]
    volumes:
      - ./dev/wiremock/mock-github/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/mock-github/__files:/home/wiremock/__files:ro

  # The GitHub MCP server's streamable HTTP endpoint, as the coder reads GitHub through it (ADR 0009,
  # ADR 0017): `initialize`, `tools/list` (the twelve read tools of the coder's allow-list) and `tools/call`
  # of `get_me` and `list_branches`, behind a bearer (the coder sends the credentials of each call, and
  # a placeholder to list the tools). The production coder reads the real server, a sidecar of its pod
  # (`github-mcp` below); the dev stack points the coder at this mock instead (dev/coder-agent/mcp.json,
  # mounted over the coder's mcp.json, and GITHUB_MCP_URL), so no GitHub is needed.
  # Endpoint: http://127.0.0.1:8085/mcp
  mock-github-mcp:
    <<: *wiremock
    command: ["--global-response-templating"]
    ports: ["127.0.0.1:${MOCK_GITHUB_MCP_PORT:-8085}:8080"]
    volumes:
      - ./dev/wiremock/mock-github-mcp/mappings:/home/wiremock/mappings:ro

  # A git remote for the coder: bare repositories over smart HTTP, seeded with
  # local/sandbox.git (a README and a `just check` script). No authentication.
  # Clone URL: http://127.0.0.1:8083/local/sandbox.git
  # A repository of an owner in AUTO_CREATE_OWNERS is created, empty, the first time anything asks
  # for it: what a repository that was just created on GitHub is like (the scratch scenario of
  # dev/coder-e2e.sh publishes a project to http://git-server:8080/scratch/<name>.git).
  git-server:
    build:
      context: ./dev/git-server
    restart: unless-stopped
    environment:
      AUTO_CREATE_OWNERS: scratch
    ports: ["127.0.0.1:${GIT_SERVER_PORT:-8083}:8080"]
    volumes:
      - git-data:/srv/git

  # ------------------------------------------------------------------ app --

  # The coder agent (A2A server + workers), built from the repository root and
  # wired to the mocks: model = mock-openai, pull requests = mock-github,
  # remote = git-server, GitHub read over MCP = mock-github-mcp (use http://git-server:8080/local/sandbox.git as the
  # repository in a task). Needs the workspace base image of
  # docker/coder/Dockerfile to be pullable.
  #
  # The models are scripted (dev/wiremock/mock-openai/mappings/coder-script.json
  # and opencode-script.json; the coder streams its model calls, so each script also
  # has an SSE twin, coder-script-stream.json): the coder's model `mock-coder` prepares the
  # workspace, delegates to OpenCode (model `mock-opencode`), runs the checks,
  # commits, pushes and opens a pull request, so a task ends in one. CI runs
  # exactly that with dev/coder-e2e.sh, on an image it has already built:
  # CODER_IMAGE names it (`--no-build` then uses it as it is).
  #
  # The agent's files (prompt, card, skills) are read at startup from the folder
  # mounted at /etc/adam/agent (ADAM_AGENT_DIR), so a change to them needs a
  # restart, not a build: edit bin/adam-coder/agent/instructions.md, or point
  # CODER_AGENT_DIR at a copy, and `docker compose --profile app up -d coder`.
  # Unset ADAM_AGENT_DIR (remove the two lines) and the copy embedded in the
  # image is used. The folder must be readable by uid 10001 (chmod -R a+rX).
  coder:
    profiles: ["app"]
    image: ${CODER_IMAGE:-adam-rs/coder:dev}
    build:
      context: .
      dockerfile: docker/coder/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
      mock-github:
        condition: service_healthy
      git-server:
        condition: service_healthy
      mock-github-mcp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/adam_test
      MODEL_BASE_URL: http://mock-openai:8080/v1
      MODEL_API_KEY: mock-api-key # dummy: the mock accepts anything
      # Scripted models (see above). CODER_MODEL=mock-model gives the canned
      # answers of the other mocks back: text, no tool call, no pull request.
      MODEL: ${CODER_MODEL:-mock-coder}
      OPENCODE_MODEL: ${CODER_OPENCODE_MODEL:-mock-opencode}
      GITHUB_API_URL: http://mock-github:8080
      # Dummy. Set MOCK_GITHUB_TOKEN=bad-token to make mock-github answer 401. An installation is
      # a token OR a GitHub App, never both: dev/compose.github-app.yaml turns this one off (empty)
      # and gives the coder an App (GITHUB_APP_*) that mock-github trades JWTs for tokens.
      GITHUB_TOKEN: ${MOCK_GITHUB_TOKEN-dev-github-token}
      # Dummy bearer token for the A2A endpoint; never reuse it anywhere real.
      A2A_BEARER_TOKENS: dev-token
      PUBLIC_URL: http://127.0.0.1:${CODER_PORT:-8080}/
      WORKSPACE_ROOT: /work
      # Repositories may live only on git-server, and plain http is accepted:
      # both are development-only settings, never set them in production.
      ALLOWED_REPO_HOSTS: git-server
      ALLOW_LOCAL_REPOS: "true"
      # The coder may create repositories for this owner, after the person agrees (mock-github makes
      # `scratch` an organisation, and git-server makes the repository, empty, on first use).
      CREATE_REPO_OWNERS: scratch
      # The mounted folder below: what the agent says and offers, read at startup.
      ADAM_AGENT_DIR: /etc/adam/agent
      # The folder's mcp.json is replaced (below) by one that reaches mock-github-mcp over plain
      # http, which a deployment must allow: development only, never set it in production.
      MCP_ALLOW_INSECURE: "true"
      # Where the GitHub MCP server is: the mock, not the sidecar (`github-mcp` below, on 127.0.0.1:8082,
      # which the shipped mcp.json names). The coder binds the credentials of each call to this origin,
      # so the folder's `github` server must be at it (a folder that is not is refused at startup).
      GITHUB_MCP_URL: http://mock-github-mcp:8080
      # Local-process MCP servers are the coder's alone (the image sets nothing). The shipped mcp.json no
      # longer starts one (the GitHub server is the sidecar), so this only keeps a CODER_AGENT_DIR whose
      # folder has a `command` server working. The `agent` service below leaves it unset, which refuses
      # such servers.
      MCP_ALLOW_STDIO: "true"
    ports: ["127.0.0.1:${CODER_PORT:-8080}:8080"]
    volumes:
      - coder-work:/work
      - ${CODER_AGENT_DIR:-./bin/adam-coder/agent}:/etc/adam/agent:ro
      # The shipped mcp.json names the real github-mcp-server, the sidecar below; the dev stack reads
      # GitHub through the mock instead. This file (no credential in it: the coder sends each call's)
      # goes over the folder's mcp.json, so the folder in CODER_AGENT_DIR must have one (a copy of the
      # shipped folder does).
      - ./dev/coder-agent/mcp.json:/etc/adam/agent/mcp.json:ro
    healthcheck:
      # Plain TCP connect: the image is not guaranteed to ship curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  # The real GitHub MCP server, as the chart runs it: a sidecar of the coder, in its network namespace
  # (127.0.0.1:8082, where the shipped mcp.json names it, so MCP_ALLOW_INSECURE is not needed for it), with
  # the same image, read-only and four toolsets, and **no credential**: it takes the token of each request
  # from the coder. The dev stack's coder reads the mock instead (GITHUB_MCP_URL above), so this one is idle
  # until a CODER_AGENT_DIR with the shipped mcp.json (drop the mounted dev/coder-agent/mcp.json and
  # GITHUB_MCP_URL) points the coder at it, with a real token for `GITHUB_HOST` github.com. The coder does not
  # wait for it (it would be a cycle): a coder that starts first and finds nothing at 8082 exits 69 and is
  # restarted. Recreate it with the coder: `docker compose --profile app up -d coder github-mcp`.
  github-mcp:
    profiles: ["app"]
    image: ${CODER_IMAGE:-adam-rs/coder:dev}
    entrypoint: ["tini", "--", "github-mcp-server"]
    command:
      - http
      - --read-only
      - --toolsets
      - context,repos,issues,pull_requests
      - --listen-host
      - 127.0.0.1
      - --port
      - "8082"
    network_mode: "service:coder"
    restart: unless-stopped
    depends_on:
      coder:
        condition: service_started
    healthcheck:
      # Plain TCP connect: the image is not guaranteed to ship curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # A general agent: `adam-agent` serving the folder mounted at /etc/adam/agent (ADAM_AGENT_DIR), a
  # chat persona by default (dev/agents/assistant/agent). It runs from the coder's image, which carries
  # both binaries: only the entrypoint differs (`adam-agent` for `adam-coder`), so there is no second
  # image to build or publish. The agent is files, read at startup: edit the folder, or point
  # AGENT_FOLDER at a copy, and `docker compose --profile app up -d agent` (a restart, no rebuild). It
  # has no tools of its own but the screen's (`ask_user`, `show`, `ui_catalog`), no workspace and no GitHub: its model is `mock-assistant`,
  # which greets from the two persona lines of the prompt (`Your name is <name>.` and `In one
  # sentence: <summary>.`). It shares the coder's database: runs are scoped by the agent's name.
  # A fourth agent is a folder and these lines. CI runs dev/agent-e2e.sh against it.
  agent:
    profiles: ["app"]
    image: ${CODER_IMAGE:-adam-rs/coder:dev}
    build:
      context: .
      dockerfile: docker/coder/Dockerfile
    entrypoint: ["tini", "--", "adam-agent"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/adam_test
      MODEL_BASE_URL: http://mock-openai:8080/v1
      MODEL_API_KEY: mock-api-key # dummy: the mock accepts anything
      # Scripted by the persona lines of the folder (see above).
      MODEL: ${AGENT_MODEL:-mock-assistant}
      # Dummy bearer token for the A2A endpoint; never reuse it anywhere real.
      A2A_BEARER_TOKENS: dev-token
      PUBLIC_URL: http://127.0.0.1:${AGENT_PORT:-8084}/
      # The mounted folder below: what the agent says and offers, read at startup.
      ADAM_AGENT_DIR: /etc/adam/agent
      # What an `mcp.json` in the folder may name: nothing but https and loopback unless set here.
      # MCP_ALLOW_INSECURE: "true" # development only: plain http to another container
    ports: ["127.0.0.1:${AGENT_PORT:-8084}:8080"]
    volumes:
      - ${AGENT_FOLDER:-./dev/agents/assistant/agent}:/etc/adam/agent:ro
    healthcheck:
      # Plain TCP connect: the image is not guaranteed to ship curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
  mongodb-data:
  git-data:
  coder-work:
