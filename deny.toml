# cargo-deny policy: `cargo deny check` (run in CI).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known-vulnerable or unmaintained dependencies fail the build. To accept one
# deliberately, add its RUSTSEC id below with a reason and a review date.
ignore = [
    # Unmaintained, no known vulnerability: under `serde_yaml_ng` only, in the operator (`bin/adam-operator`
    # writes the CRDs; its crates' tests read YAML fixtures). Moving to `serde-saphyr`, already a workspace
    # dependency, changes the generated CRD file. Review by 2027-01-16.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; only under serde_yaml_ng in the operator; replace with serde-saphyr, review by 2027-01-16" },
    # zip 8.6 is only a build dependency of `utoipa-swagger-ui` 10.0.1 (adam-a2a's /docs), whose latest release
    # still requires `^8.6`. Its build script reads the archive vendored in `utoipa-swagger-ui-vendored` (feature
    # `vendored`, checksum-pinned by Cargo.lock) entry by entry with `by_index`; it never calls
    # `ZipArchive::extract` or `ZipStreamReader::extract`, which the three advisories are about, and the archive is
    # not attacker-controlled (verified 2026-10-17, utoipa-swagger-ui-10.0.1/build.rs). Drop these once
    # utoipa-swagger-ui accepts zip >= 9. Review by 2027-01-17.
    { id = "RUSTSEC-2026-0367", reason = "zip SUID bits on extract(); build-time only, vendored archive, extract() not called; review by 2027-01-17" },
    { id = "RUSTSEC-2026-0368", reason = "zip symlink targets on extract(); build-time only, vendored archive, extract() not called; review by 2027-01-17" },
    { id = "RUSTSEC-2026-0369", reason = "zip permissions through symlinks on extract(); build-time only, vendored archive, extract() not called; review by 2027-01-17" },
]

[licenses]
# Permissive licenses only. Add to this list deliberately, in a reviewed change.
allow = [
    "MIT",
    # MIT without the attribution clause: `borrow-or-share`, under `jsonschema` (adam-ui).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within this workspace carry a version and are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
