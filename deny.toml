# cargo-deny policy: `cargo deny check` (run in CI).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known-vulnerable or unmaintained dependencies fail the build. To accept one
# deliberately, add its RUSTSEC id below with a reason and a review date.
ignore = [
    # chrono is unmaintained (informational, not a vulnerability; advisory date 2026-09-14, "all
    # versions are affected", `patched = []`, and the record recommends jiff and time; verified
    # 2026-11-19 in the advisory-db checkout at commit 3157b0e258782691). Accepted by the owner on
    # 2026-11-17. adam-rs's own code moved to jiff (ADR 0057, 2026-11-19); what remains is the A2A
    # crates it builds on (`a2a-lf`, `a2a-server-lf` and `a2a-pb`, so `adam-a2a` and
    # `adam-a2a-runtime` keep the types `TaskStatus`, `TaskQuery` and `PageToken`). The PostgreSQL
    # store no longer maps through chrono: it moved to `tokio-postgres` and `with-jiff-0_2`
    # (ADR 0053 decision 1, amended 2026-11-20). Review by 2027-02-17, or at once if an advisory
    # names a vulnerability in chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; advisory date 2026-09-14, accepted 2026-11-17, adam-rs's own code moved to jiff (ADR 0057); what remains is a2a-lf/a2a-server-lf/a2a-pb, review by 2027-02-17" },
    # kube-client's `openssl-tls` connector trusts OpenSSL's default CA store beside the configured
    # cluster CA (RUSTSEC-2026-0600, published 2026-11-25). **The feature is not enabled in this
    # workspace and the crate it names is not in the tree**: the workspace declares
    # `kube = { default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }`,
    # `cargo tree -e features -p kube-client | grep openssl-tls` is empty, and `cargo tree -i openssl`
    # finds no package (verified 2026-11-25). The advisory fires only because `[graph] all-features`
    # below resolves every feature of every dependency, including connectors no binary here builds.
    # If a kube client ever enables `openssl-tls`, this ignore must go in the same change: the
    # connector would then trust roots from the machine's store, which is a real boundary failure.
    # Review by 2027-02-25, or at once if a kube release pins a patched connector.
    { id = "RUSTSEC-2026-0600", reason = "kube-client's openssl-tls is not enabled (rustls-tls only, default-features = false) and openssl is not in the tree; all-features resolution is what trips the advisory; verified 2026-11-25, review by 2027-02-25" },
]

[licenses]
# Permissive licenses only. Add to this list deliberately, in a reviewed change.
allow = [
    "MIT",
    # MIT without the attribution clause: `borrow-or-share`, under `jsonschema` (adam-ui).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Boost 1.0, permissive (OSI, FSF): `xxhash-rust`, under `redis` (adam-memory-redis).
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within this workspace carry a version and are not wildcards.
allow-wildcard-paths = true

# ADR 0057: adam's own code uses jiff. chrono stays only where an upstream type or a driver needs it, so
# a crate that adds a direct dependency on it fails this check instead of arriving silently. The
# wrappers are every crate in the graph that may depend on chrono directly; a new one is a decision.
[[bans.deny]]
name = "chrono"
use-instead = "jiff"
wrappers = [
    # The A2A boundary: `TaskStatus`, `TaskQuery` and `PageToken` are the SDK's types.
    "adam-a2a",
    "adam-a2a-runtime",
    # The A2A protocol crates `adam-a2a` builds on.
    "a2a-lf",
    "a2a-pb",
    "a2a-server-lf",
    "pbjson-types",
    # Already in the tree and outside adam's own code: the MCP client and JSON Schema.
    "rmcp",
    "schemars",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
