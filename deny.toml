# cargo-deny policy: `cargo deny check` (run in CI).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known-vulnerable or unmaintained dependencies fail the build. To accept one
# deliberately, add its RUSTSEC id below with a reason and a review date.
ignore = [
    # chrono is unmaintained (informational, not a vulnerability; issued 2026-11-17, "all versions are
    # affected", no patched version). Accepted by the owner on 2026-11-17, with a migration of adam-rs's own
    # code to jiff to follow; the A2A types adam-rs builds on (`a2a-lf`) still depend on chrono. Review by
    # 2027-02-17, or at once if an advisory names a vulnerability in chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; accepted 2026-11-17, migration to jiff to follow, review by 2027-02-17" },
]

[licenses]
# Permissive licenses only. Add to this list deliberately, in a reviewed change.
allow = [
    "MIT",
    # MIT without the attribution clause: `borrow-or-share`, under `jsonschema` (adam-ui).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within this workspace carry a version and are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
