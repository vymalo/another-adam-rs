[workspace]
resolver = "3"
members = [
    "crates/adam-core",
    "crates/adam-store-testkit",
    "crates/adam-store-postgres",
    "crates/adam-store-mongodb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ssegning/adam-rs"
rust-version = "1.94"

[workspace.dependencies]
adam-core = { path = "crates/adam-core", version = "0.1.0" }
adam-store-testkit = { path = "crates/adam-store-testkit", version = "0.1.0" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
