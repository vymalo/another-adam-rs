[workspace]
resolver = "3"
# Globs, so crates added in parallel PRs never conflict on this list:
# libraries in `crates/`, binaries (the agents you can run) in `bin/`.
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vymalo/another-adam-rs"
rust-version = "1.94"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
adam = { path = "crates/adam", version = "0.1.0" }
adam-a2a = { path = "crates/adam-a2a", version = "0.1.0" }
adam-a2a-runtime = { path = "crates/adam-a2a-runtime", version = "0.1.0" }
adam-acp = { path = "crates/adam-acp", version = "0.1.0" }
adam-assembly = { path = "crates/adam-assembly", version = "0.1.0" }
adam-agent-fs = { path = "crates/adam-agent-fs", version = "0.1.0" }
adam-core = { path = "crates/adam-core", version = "0.1.0" }
adam-devcontainer = { path = "crates/adam-devcontainer", version = "0.1.0" }
adam-env-kubernetes = { path = "crates/adam-env-kubernetes", version = "0.1.0" }
adam-error = { path = "crates/adam-error", version = "0.1.0" }
adam-host = { path = "crates/adam-host", version = "0.1.0" }
adam-llm-agent = { path = "crates/adam-llm-agent", version = "0.1.0" }
adam-macros = { path = "crates/adam-macros", version = "0.1.0" }
adam-mcp = { path = "crates/adam-mcp", version = "0.1.0" }
adam-mcp-testkit = { path = "crates/adam-mcp-testkit", version = "0.1.0" }
adam-model = { path = "crates/adam-model", version = "0.1.0" }
adam-model-openai = { path = "crates/adam-model-openai", version = "0.1.0" }
adam-notify-postgres = { path = "crates/adam-notify-postgres", version = "0.1.0" }
adam-notify-testkit = { path = "crates/adam-notify-testkit", version = "0.1.0" }
adam-operator-api = { path = "crates/adam-operator-api", version = "0.1.0" }
adam-operator-controller = { path = "crates/adam-operator-controller", version = "0.1.0" }
adam-operator-domain = { path = "crates/adam-operator-domain", version = "0.1.0" }
adam-operator-ports = { path = "crates/adam-operator-ports", version = "0.1.0" }
adam-operator-registry = { path = "crates/adam-operator-registry", version = "0.1.0" }
adam-operator-runtime-kubernetes = { path = "crates/adam-operator-runtime-kubernetes", version = "0.1.0" }
adam-operator-store-cnpg = { path = "crates/adam-operator-store-cnpg", version = "0.1.0" }
adam-operator-store-secret = { path = "crates/adam-operator-store-secret", version = "0.1.0" }
adam-runtime = { path = "crates/adam-runtime", version = "0.1.0" }
adam-service = { path = "crates/adam-service", version = "0.1.0" }
adam-store-postgres = { path = "crates/adam-store-postgres", version = "0.1.0" }
adam-store-testkit = { path = "crates/adam-store-testkit", version = "0.1.0" }
adam-ui = { path = "crates/adam-ui", version = "0.1.0" }
adam-workspace = { path = "crates/adam-workspace", version = "0.1.0" }

a2a-client-lf = "0.2"
a2a-lf = "0.3"
a2a-server-lf = "0.4"
agent-client-protocol = "2.2"
anyhow = "1"
async-trait = "0.1"
# Signs the JWT of a GitHub App (adam-workspace): already in the tree under rustls, with the features
# rustls asks for; the defaults would add `untrusted` 0.7 for ring's I/O types, which nothing here uses.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", default-features = false, features = ["std", "derive"] }
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
# Reads a repository's devcontainer.json (JSON with comments and trailing commas), as serde_json values
# (adam-devcontainer).
jsonc-parser = { version = "0.34", features = ["serde"] }
# Catalog components are JSON Schema; no network resolution, so none of the default features.
jsonschema = { version = "0.58", default-features = false }
# The Kubernetes API (adam-env-kubernetes): the typed objects, at the oldest API version the pods use, and
# the client with `ws` for pods/exec, TLS through rustls on aws-lc-rs as the rest of the tree has it.
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
notify = "8"
proc-macro2 = "1"
proptest = "1"
quote = "1"
# Client only, and only the transports adam-mcp uses; the crate picks its own features.
rmcp = { version = "3.5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json", "query"] }
# The process-wide TLS provider (adam-env-kubernetes): kube builds its TLS configuration with it, and a binary whose tree enables both providers
# (the coder's does) has to name one. Already in the tree under rustls.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# Reads the PEM of a GitHub App's private key (adam-workspace): already in the tree under rustls.
rustls-pki-types = "1"
# ECMAScript number formatting for the JSON Canonicalization Scheme (RFC 8785) that signs an agent card (adam-a2a).
ryu-js = "1"
schemars = { version = "1.2", default-features = false, features = ["std"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1"
# The CRDs are printed with it (adam-operator crdgen), as the CRDs checked in under deploy/crds are written.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
subtle = "2"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "proc-macro", "clone-impls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-test = "0.4"
trybuild = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wiremock = "0.6"
