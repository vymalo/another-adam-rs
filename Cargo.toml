[workspace]
resolver = "3"
# Glob, so crates added in parallel PRs never conflict on this list.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vymalo/another-adam-rs"
rust-version = "1.94"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
adam-core = { path = "crates/adam-core", version = "0.1.0" }
adam-error = { path = "crates/adam-error", version = "0.1.0" }
adam-model = { path = "crates/adam-model", version = "0.1.0" }
adam-notify-testkit = { path = "crates/adam-notify-testkit", version = "0.1.0" }
adam-runtime = { path = "crates/adam-runtime", version = "0.1.0" }
adam-store-testkit = { path = "crates/adam-store-testkit", version = "0.1.0" }
adam-workspace = { path = "crates/adam-workspace", version = "0.1.0" }

a2a-client-lf = "0.2"
a2a-lf = "0.3"
a2a-server-lf = "0.4"
agent-client-protocol = "2.2"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", default-features = false, features = ["std", "derive"] }
futures = "0.3"
httpdate = "1"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json", "query"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wiremock = "0.6"
