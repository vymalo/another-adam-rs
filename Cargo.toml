[workspace]
resolver = "3"
# Globs, so crates added in parallel PRs never conflict on this list:
# libraries in `crates/`, binaries (the agents you can run) in `bin/`.
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.7.0" # x-release-please-version
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vymalo/another-adam-rs"
rust-version = "1.98"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
adam = { path = "crates/adam", version = "0.7.0" } # x-release-please-version
adam-a2a = { path = "crates/adam-a2a", version = "0.7.0" } # x-release-please-version
adam-a2a-runtime = { path = "crates/adam-a2a-runtime", version = "0.7.0" } # x-release-please-version
adam-acp = { path = "crates/adam-acp", version = "0.7.0" } # x-release-please-version
adam-admission-local = { path = "crates/adam-admission-local", version = "0.7.0" } # x-release-please-version
adam-admission-testkit = { path = "crates/adam-admission-testkit", version = "0.7.0" } # x-release-please-version
adam-assembly = { path = "crates/adam-assembly", version = "0.7.0" } # x-release-please-version
adam-budget = { path = "crates/adam-budget", version = "0.7.0" } # x-release-please-version
adam-agent-fs = { path = "crates/adam-agent-fs", version = "0.7.0" } # x-release-please-version
adam-code-tools = { path = "crates/adam-code-tools", version = "0.7.0" } # x-release-please-version
adam-code-tools-testkit = { path = "crates/adam-code-tools-testkit", version = "0.7.0" } # x-release-please-version
adam-confine = { path = "crates/adam-confine", version = "0.7.0" } # x-release-please-version
adam-confine-testkit = { path = "crates/adam-confine-testkit", version = "0.7.0" } # x-release-please-version
adam-core = { path = "crates/adam-core", version = "0.7.0" } # x-release-please-version
adam-device-state = { path = "crates/adam-device-state", version = "0.7.0" } # x-release-please-version
adam-device-state-testkit = { path = "crates/adam-device-state-testkit", version = "0.7.0" } # x-release-please-version
adam-env-kubernetes = { path = "crates/adam-env-kubernetes", version = "0.7.0" } # x-release-please-version
adam-error = { path = "crates/adam-error", version = "0.7.0" } # x-release-please-version
adam-git-sandbox = { path = "crates/adam-git-sandbox", version = "0.7.0" } # x-release-please-version
adam-hook-exec = { path = "crates/adam-hook-exec", version = "0.7.0" } # x-release-please-version
adam-host = { path = "crates/adam-host", version = "0.7.0" } # x-release-please-version
adam-llm-agent = { path = "crates/adam-llm-agent", version = "0.7.0" } # x-release-please-version
adam-macros = { path = "crates/adam-macros", version = "0.7.0" } # x-release-please-version
adam-mcp = { path = "crates/adam-mcp", version = "0.7.0" } # x-release-please-version
adam-mcp-testkit = { path = "crates/adam-mcp-testkit", version = "0.7.0" } # x-release-please-version
adam-memory = { path = "crates/adam-memory", version = "0.7.0" } # x-release-please-version
adam-memory-redis = { path = "crates/adam-memory-redis", version = "0.7.0" } # x-release-please-version
adam-memory-testkit = { path = "crates/adam-memory-testkit", version = "0.7.0" } # x-release-please-version
adam-model = { path = "crates/adam-model", version = "0.7.0" } # x-release-please-version
adam-model-oauth = { path = "crates/adam-model-oauth", version = "0.7.0", default-features = false } # x-release-please-version
adam-model-openai = { path = "crates/adam-model-openai", version = "0.7.0", default-features = false } # x-release-please-version
adam-notify-postgres = { path = "crates/adam-notify-postgres", version = "0.7.0" } # x-release-please-version
adam-notify-testkit = { path = "crates/adam-notify-testkit", version = "0.7.0" } # x-release-please-version
adam-otel = { path = "crates/adam-otel", version = "0.7.0" } # x-release-please-version
adam-plugin = { path = "crates/adam-plugin", version = "0.7.0" } # x-release-please-version
adam-plugin-testkit = { path = "crates/adam-plugin-testkit", version = "0.7.0" } # x-release-please-version
adam-postgres = { path = "crates/adam-postgres", version = "0.7.0" } # x-release-please-version
adam-run-cert-broker = { path = "crates/adam-run-cert-broker", version = "0.7.0" } # x-release-please-version
adam-runtime = { path = "crates/adam-runtime", version = "0.7.0" } # x-release-please-version
adam-service = { path = "crates/adam-service", version = "0.7.0" } # x-release-please-version
adam-store-mongodb = { path = "crates/adam-store-mongodb", version = "0.7.0" } # x-release-please-version
adam-store-postgres = { path = "crates/adam-store-postgres", version = "0.7.0" } # x-release-please-version
adam-store-sqlite = { path = "crates/adam-store-sqlite", version = "0.7.0" } # x-release-please-version
adam-store-testkit = { path = "crates/adam-store-testkit", version = "0.7.0" } # x-release-please-version
adam-ui = { path = "crates/adam-ui", version = "0.7.0" } # x-release-please-version
adam-workspace = { path = "crates/adam-workspace", version = "0.7.0" } # x-release-please-version

a2a-client-lf = "0.2"
a2a-lf = "0.3"
a2a-server-lf = "0.4"
agent-client-protocol = "2.2"
# The coder's redactor scans an output once for every registered secret: already in the tree under
# regex, with the default (contiguous NFA) engine.
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1"
# Signs the JWT of a GitHub App (adam-workspace): already in the tree under rustls, with the features
# rustls asks for; the defaults would add `untrusted` 0.7 for ring's I/O types, which nothing here uses.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
axum = "0.8"
base64 = "0.22"
# A model request body sent twice (a retry after a 401, ADR 0058) without a copy; already in the tree under reqwest.
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", default-features = false, features = ["std", "derive"] }
# The turn signature of ADR 0068 (adam-core): pure Rust, so the engine's tree, which may hold no C crypto
# (`aws-lc-rs` and `ring` are forbidden there, tools/embedded-deps/check.sh), signs and verifies too.
# `fast`: the precomputed tables; `zeroize`: the private key is wiped on drop; `alloc` and `pkcs8`:
# the SPKI of a run key's CSR (ADR 0086), which x509-cert reads through the same `spki` 0.8 types.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "pkcs8", "alloc"] }
futures = "0.3"
# The seed of an ephemeral turn key (adam-core, ADR 0068): already in the tree under uuid.
getrandom = "0.4"
# `find_files` (adam-coder): a glob compiled to the same linear-time regex engine.
globset = "0.4"
http = "1"
# Parses the request head of the egress proxy (adam-egress); already in the tree under hyper.
httparse = "1"
httpdate = "1"
# The instant adam-rs stores and sends (ADR 0057). `serde` is what the stored run state needs;
# nothing here uses a time zone, so no tzdb is built or read.
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
# Reads a repository's devcontainer.json (JSON with comments and trailing commas), as serde_json values
# (adam-workspace's reader).
jsonc-parser = { version = "0.34", features = ["serde"] }
# Catalog components are JSON Schema; no network resolution, so none of the default features.
jsonschema = { version = "0.58", default-features = false }
# The Kubernetes API (adam-env-kubernetes): the typed objects, at the oldest API version the pods use, and
# the client with `ws` for pods/exec, TLS through rustls on aws-lc-rs as the rest of the tree has it.
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
libc = "0.2"
# Finds line ends in the SSE parser (adam-model-openai); already in the tree under regex.
memchr = "2"
# The global allocator of the image's six binaries (ADR 0053 decision 11): musl's own is slow under
# many threads. The crate compiles mimalloc's C sources with `cc`, so a musl build needs `musl-gcc`.
mimalloc = "0.1"
notify = "8"
# The OTel layer of ADR 0075 (adam-otel): the SDK, the tracing bridge and the OTLP/HTTP exporter.
# The exporter's HTTP client is the workspace `reqwest` below (`reqwest-client`, never
# `reqwest-blocking-client`); gRPC/tonic is not compiled in, and the crate picks the TLS provider
# exactly as adam-model-openai does.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "internal-logs", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics", "logs", "internal-logs"] }
proc-macro2 = "1"
proptest = "1"
quote = "1"
# The Redis L2 memory adapter (adam-memory-redis): client only. `tls-rustls-webpki-roots` lets a
# deployment reach `rediss://` through bundled roots; the defaults (acl, streams, geospatial,
# script, num-bigint) are command sets nothing here uses.
redis = { version = "1.8", default-features = false, features = ["tls-rustls-webpki-roots"] }
# Client only, and only the transports adam-mcp uses; the crate picks its own features.
rmcp = { version = "3.9", default-features = false }
# `search_files` (adam-coder): a linear-time engine, with no backtracking and a size limit.
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json", "query"] }
# The SQLite store (adam-store-sqlite): bundled SQLite, on the minor cratestack-rusqlite uses
# (0.41.1), so an application that links both has one libsqlite3-sys (ADR 0053 decision 2).
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
# The process-wide TLS provider (adam-env-kubernetes): kube builds its TLS configuration with it, and a binary whose tree enables both providers
# (the coder's does) has to name one. Already in the tree under rustls.
rustls = { version = "0.23", default-features = false, features = ["std"] }
# Reads the PEM of a GitHub App's private key (adam-workspace): already in the tree under rustls.
rustls-pki-types = "1"
# ECMAScript number formatting for the JSON Canonicalization Scheme (RFC 8785, adam-core): what signs an
# agent card (adam-a2a) and a turn (ADR 0068).
ryu-js = "1"
schemars = { version = "1.2", default-features = false, features = ["std"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "proc-macro", "clone-impls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tower-test = "0.4"
trybuild = "1"
tracing = "0.1"
# The bridge from a `tracing` span to an OTel span (adam-otel, ADR 0075).
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
url = "2"
# Swagger UI at `/docs` of every A2A server (adam-a2a). `vendored`: the assets come from the
# `utoipa-swagger-ui-vendored` crate, so the build downloads nothing; `minified`: no source maps.
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["vendored", "minified"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wiremock = "0.6"
# The run's certificate (ADR 0086, adam-core): a PKCS#10 CSR built and a leaf certificate read as DER,
# signed with the `ed25519-dalek` the workspace already carries. Pure Rust (RFC 5280's types over
# `der`/`spki`), so the engine's tree keeps holding neither `aws-lc-rs` nor `ring`
# (tools/embedded-deps/check.sh); it signs through `signature`'s traits, which `ed25519-dalek`
# implements, so no second crypto provider arrives.
x509-cert = { version = "0.3", default-features = false, features = ["std", "builder"] }

# The shipped binaries: `docker/coder/Dockerfile` builds them with `cargo build --release`, so this
# profile is what the image carries. `codegen-units = 1` and `strip = "symbols"` take the coder binary
# from 90.4 MB to 50.8 MB (rustc 1.98.0, 2026-11-18). `lto` is left off on purpose: thin LTO measured
# 3.6% larger and 20% more build CPU. `panic` stays `unwind`: the worker catches a panicking
# `agent.step` and fails the run (`crates/adam-runtime/src/worker.rs`), which `panic = "abort"` would
# turn into a dead process.
[profile.release]
codegen-units = 1
strip = "symbols"
