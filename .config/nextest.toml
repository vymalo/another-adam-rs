# cargo-nextest configuration. `cargo nextest run` uses the default profile;
# CI uses `--profile ci`.

[profile.default]
# Fail a hung test instead of waiting for the job timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
# The coder end-to-end tests build a fake agent with a nested cargo (slow on a
# cold, instrumented build): flag a test after 60 s, kill it after 5 minutes.
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "slow"
final-status-level = "fail"

# The `#[tool]` compile tests (crates/adam/tests/ui) build a crate graph of their own with trybuild, which on
# a cold cache, beside every other test of the run, takes longer than five minutes. Their own CI job (`ui`)
# runs them too; here they get 15 minutes before they are killed.
[[profile.ci.overrides]]
filter = "binary_id(adam::ui)"
slow-timeout = { period = "60s", terminate-after = 15 }

# A blob is global and content-addressed: `purge_blobs`, and `purge_finished` in the same call,
# delete every unreferenced blob in the database older than a cutoff. The cases that read, upload
# or sweep a blob must not run beside each other. nextest runs each test in its own process, so the
# suite's in-process mutex cannot serialise them, and an adapter's conformance cases share one
# fixed table/collection prefix. One group, one thread; the libtest path takes the suite's mutex
# instead (`crates/adam-store-testkit/src/lib.rs`).
#
# Membership is a **name convention**: a test that calls `purge_finished` or `purge_blobs` must
# carry `purge` in its name (or be added to the filter below), and a repository that runs its own
# store tests must put the same cases in a single-thread group of its own.
[test-groups.store-global-sweeps]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/blob_|purge|push_configs_go_with_their_run|measure_the_transcript_write|measure_the_headless_transcript|events_and_durable_artifacts|a_run_continues_a_finished_run_from_a_start_only_front/)'
test-group = "store-global-sweeps"

[[profile.ci.overrides]]
filter = 'test(/blob_|purge|push_configs_go_with_their_run|measure_the_transcript_write|measure_the_headless_transcript|events_and_durable_artifacts|a_run_continues_a_finished_run_from_a_start_only_front/)'
test-group = "store-global-sweeps"

# The remote-subagent cases of `adam-llm-agent`'s `sessions` suite all start a subagent their
# agent definition **declares** as `far`; the name is the definition's, so a test cannot make it
# unique, and the suite shares one store. A worker claims by agent name, so two of these cases
# beside each other claim each other's `far` runs and one reads the other's answer. The libtest
# path takes the suite's mutex (`crates/adam-llm-agent/tests/sessions.rs`, `FAR_SUITE`); nextest
# gives each test its own process, so they are one group of one thread here.
[test-groups.sessions-remote-far]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/a_remote_subagent_starts_a_round_of_its_registered_agent|a_remote_subagent_refuses_every_option_but_time_limit_and_max_rounds|a_remote_subagent_refuses_a_report_schema/)'
test-group = "sessions-remote-far"

[[profile.ci.overrides]]
filter = 'test(/a_remote_subagent_starts_a_round_of_its_registered_agent|a_remote_subagent_refuses_every_option_but_time_limit_and_max_rounds|a_remote_subagent_refuses_a_report_schema/)'
test-group = "sessions-remote-far"
