[package]
name = "adam-run-cert-broker"
description = "The broker adapter of adam-rs's RunCertIssuer: a run's certificate over the contract v1 (ADR 0086)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The TLS provider (aws-lc-rs) reqwest and rustls link. On by default; a host that installs its own
# (ring, the platform's) builds with `default-features = false`.
default = ["aws-lc"]
aws-lc = ["reqwest/rustls", "rustls/aws_lc_rs"]

[dependencies]
adam-core.workspace = true
adam-error.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
