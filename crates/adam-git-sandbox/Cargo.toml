[package]
name = "adam-git-sandbox"
description = "Runs the coder's local git where no secret is readable: a server on a Unix socket that only executes git, and the relay that stands in for git"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "adam_git_sandbox"
path = "src/lib.rs"

[[bin]]
name = "adam-git-sandbox"
path = "src/bin/adam-git-sandbox.rs"
required-features = ["otel"]

[[bin]]
name = "adam-git"
path = "src/bin/adam-git.rs"

[features]
# The server's OTel layer (`adam_otel::init`): on for the binary, off for a crate that takes the
# library (adam-workspace), so adam-engine's embedded set links no HTTP client (ADR 0047).
default = ["otel"]
otel = ["adam-otel/sdk"]

[dependencies]
adam-error.workspace = true
# The OTel layer (ADR 0075, ANR-1412), for the server binary only (feature `otel`). No TLS
# provider: this server is small and the collector of a cluster is plain `http`; add `adam-otel`'s
# `aws-lc` feature to export over `https`.
adam-otel.workspace = true
base64.workspace = true
mimalloc.workspace = true
# `kill_process_group`, `umask` and `openat` as safe functions, so the crate stays `forbid(unsafe_code)`.
# Already in the tree through `adam-service` and `adam-workspace`.
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "net", "process", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
