[package]
name = "adam-mcp"
description = "MCP client for adam-rs: the servers of an mcp.json become tools an LlmAgent can call"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
adam-agent-fs.workspace = true
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
# `Artifact::file`'s caps and the media-type rule a shared file follows.
adam-runtime.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
adam-error.workspace = true
adam-mcp-testkit = { path = "../adam-mcp-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
