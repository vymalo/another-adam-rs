[package]
name = "adam-code-tools"
description = "The file and command tools of adam-rs agents, as a library over a workspace port"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `GitAt::plain`, `GitAt::refused`, `find::search_files_in` and `files::{read_in, write_in, edit_in}`, for the tests of a crate
# that uses the tools.
test-util = []

[dependencies]
adam-budget.workspace = true
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
adam-runtime.workspace = true
# Without `github`: the GitHub code host and App credentials are the coder's, and bring `reqwest`.
adam-workspace = { path = "../adam-workspace", version = "0.8.0", default-features = false } # x-release-please-version
aho-corasick.workspace = true
async-trait.workspace = true
base64.workspace = true
globset.workspace = true
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true

[dev-dependencies]
adam-admission-local.workspace = true
adam-confine.workspace = true
# `test-util`: the git sandbox server of `apply_patch`'s tests.
adam-workspace = { path = "../adam-workspace", version = "0.8.0", default-features = false, features = ["test-util"] } # x-release-please-version
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
