[package]
name = "adam-service"
description = "The A2A service shared by every agent binary: the run store chosen from DATABASE_URL, the runtime and its workers, the A2A router, notifications, the process's common configuration and exit codes"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Every adapter is on in the binaries; a library build can take only the one it needs. The
# `postgres` arm brings the notification listener, the `sqlite` and `mongodb` arms poll or use the
# in-process notifier (ADR 0053, decision 3).
default = ["store-postgres", "store-sqlite", "store-mongodb"]
store-postgres = ["dep:adam-notify-postgres", "dep:adam-postgres", "dep:adam-store-postgres"]
store-sqlite = ["dep:adam-store-sqlite"]
store-mongodb = ["dep:adam-store-mongodb"]
# `McpSettings`: the deployment's policy for the MCP servers of an agent folder (`MCP_ALLOW_*`).
mcp = ["dep:adam-mcp", "dep:adam-agent-fs"]
# `export`: the `export` command of a binary (ADR 0087): its arguments, `EXPORT_PSEUDONYM_KEY` and
# the run over `adam-export`.
export = ["dep:adam-export"]

[dependencies]
a2a-lf.workspace = true
adam-a2a.workspace = true
adam-budget.workspace = true
adam-a2a-runtime.workspace = true
adam-agent-fs = { workspace = true, optional = true }
adam-core.workspace = true
adam-error.workspace = true
adam-otel.workspace = true
opentelemetry.workspace = true
adam-export = { workspace = true, optional = true }
adam-hook-exec.workspace = true
jiff.workspace = true
adam-host.workspace = true
adam-mcp = { workspace = true, optional = true }
adam-model.workspace = true
adam-model-oauth = { workspace = true, features = ["aws-lc"] }
adam-model-openai = { workspace = true, features = ["aws-lc"] }
adam-notify-postgres = { workspace = true, optional = true }
adam-postgres = { workspace = true, optional = true }
adam-run-cert-broker = { workspace = true, features = ["aws-lc"] }
adam-runtime.workspace = true
adam-store-mongodb = { workspace = true, optional = true }
adam-store-postgres = { workspace = true, optional = true }
adam-store-sqlite = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
rustix = { version = "1", default-features = false, features = ["process", "std"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
a2a-client-lf.workspace = true
# `generate_signing_key_pem`, for the tests of the card-signing settings.
adam-a2a = { workspace = true, features = ["test-util"] }
# The Postgres tests use the store directly, whatever features the library is built with.
adam-store-postgres.workspace = true
# The TLS server of the `MODEL_CA_FILE` test; already in the tree under reqwest.
rustls = { workspace = true, features = ["aws_lc_rs"] }
tempfile.workspace = true
async-trait.workspace = true
# The starter the `export` test registers.
adam-llm-agent.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
