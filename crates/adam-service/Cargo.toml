[package]
name = "adam-service"
description = "The A2A service shared by every agent binary: the Postgres store, the runtime and its workers, the A2A router, notifications, the process's common configuration and exit codes"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# `McpSettings`: the deployment's policy for the MCP servers of an agent folder (`MCP_ALLOW_*`).
mcp = ["dep:adam-mcp"]

[dependencies]
a2a-lf.workspace = true
adam-a2a.workspace = true
adam-a2a-runtime.workspace = true
adam-core.workspace = true
adam-error.workspace = true
adam-host.workspace = true
adam-mcp = { workspace = true, optional = true }
adam-model.workspace = true
adam-model-openai.workspace = true
adam-notify-postgres.workspace = true
adam-runtime.workspace = true
adam-store-postgres.workspace = true
axum.workspace = true
rustix = { version = "1", default-features = false, features = ["process", "std"] }
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
