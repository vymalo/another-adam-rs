[package]
name = "adam-model-openai"
description = "OpenAI-compatible (chat completions) ModelClient for adam-rs"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The TLS provider (aws-lc-rs) reqwest and rustls link. On by default; a host that installs its own
# (ring, the platform's) builds with `default-features = false`.
default = ["aws-lc"]
aws-lc = ["reqwest/rustls", "rustls/aws_lc_rs"]

[dependencies]
adam-error.workspace = true
adam-model.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
httpdate.workspace = true
memchr.workspace = true
reqwest.workspace = true
# Only to tell a failed TLS handshake from an unreachable endpoint; the version reqwest uses.
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
adam-core.workspace = true
base64.workspace = true
jiff.workspace = true
proptest.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
