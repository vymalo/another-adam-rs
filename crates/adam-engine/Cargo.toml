[package]
name = "adam-engine"
description = "adam-rs embedded in an application: no server, no protocol, nothing on the network of its own (ADR 0047)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

# The embedded set (ADR 0047 decision 2): every crate below with its server parts turned off.
# tools/embedded-deps/check.sh fails when this tree holds an HTTP server or client, a database
# driver, the Kubernetes client, a TLS stack or the MCP client.
[dependencies]
# The A2A types are data here, never in a public signature (ADR 0047, confirmed decision 1).
a2a-lf.workspace = true
adam-a2a = { path = "../adam-a2a", version = "0.1.0", default-features = false }
adam-a2a-runtime = { path = "../adam-a2a-runtime", version = "0.1.0", default-features = false }
adam-agent-fs.workspace = true
adam-assembly = { path = "../adam-assembly", version = "0.1.0", default-features = false }
adam-core.workspace = true
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
adam-runtime.workspace = true
adam-ui = { path = "../adam-ui", version = "0.1.0", default-features = false }
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
