[package]
name = "adam-engine"
description = "adam-rs embedded in an application: no server, no protocol, nothing on the network of its own (ADR 0047)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

# The embedded set (ADR 0047 decision 2): every crate below with its server parts turned off.
# tools/embedded-deps/check.sh fails when this tree holds an HTTP server or client, a database
# driver, the Kubernetes client, a TLS stack or the MCP client.
[dependencies]
# The A2A types are data here, never in a public signature (ADR 0047, confirmed decision 1).
a2a-lf.workspace = true
adam-a2a = { path = "../adam-a2a", version = "0.6.0", default-features = false } # x-release-please-version
adam-a2a-runtime = { path = "../adam-a2a-runtime", version = "0.6.0", default-features = false } # x-release-please-version
adam-agent-fs.workspace = true
# `sessions`: `child-sessions/v1` for local subagents, without the A2A client (`remote`).
adam-assembly = { path = "../adam-assembly", version = "0.6.0", default-features = false, features = ["sessions"] } # x-release-please-version
adam-budget.workspace = true
adam-core.workspace = true
adam-device-state.workspace = true
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
adam-runtime.workspace = true
# A folder's `schedules/` (ADR 0060): the scheduler agent and the reconcile at start.
adam-schedule = { path = "../adam-schedule", version = "0.6.0" } # x-release-please-version
adam-ui = { path = "../adam-ui", version = "0.6.0", default-features = false } # x-release-please-version
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

# The example's model client and stdin are the host's (`examples/chat`): dev-dependencies only, so the
# embedded check (normal dependencies) never sees them.
[dev-dependencies]
adam-admission-local.workspace = true
adam-model-openai = { workspace = true, features = ["aws-lc"] }
adam-store-testkit.workspace = true
secrecy.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

# The durable store of the resume proof (`tests/resume_process.rs`, Unix only, as the store's `flock`
# is): a dev-dependency, so the embedded check (normal dependencies) never sees SQLite.
[target.'cfg(unix)'.dev-dependencies]
adam-store-sqlite.workspace = true

[lints]
workspace = true
