[package]
name = "adam-mcp-testkit"
description = "A scriptable MCP server (stdio and streamable HTTP) for testing MCP clients"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "adam-mcp-test-server"
path = "src/bin/adam-mcp-test-server.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-std", "rt-multi-thread", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The client under test. A dev-dependency cycle (adam-mcp dev-depends on this crate), which cargo
# allows; the stdio tests live here because only the owning package gets `CARGO_BIN_EXE_*`.
adam-mcp.workspace = true
adam-agent-fs.workspace = true
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process"] }

[lints]
workspace = true
