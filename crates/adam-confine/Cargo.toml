[package]
name = "adam-confine"
description = "The Unix backends of adam-workspace's Confine port: rlimits, nice and a process group, and one transient systemd scope per command with MemoryMax, CPUQuota and TasksMax"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
adam-workspace = { path = "../adam-workspace", version = "0.7.0", default-features = false } # x-release-please-version
async-trait.workspace = true
# `setrlimit`, `getrlimit` and `setpriority` as safe functions: the only `unsafe` here is the
# `pre_exec` call that runs them in the child.
rustix = { version = "1", default-features = false, features = ["process", "std"] }
tokio = { workspace = true, features = ["process", "time"] }
tracing.workspace = true
libc.workspace = true

[dev-dependencies]
adam-confine-testkit = { path = "../adam-confine-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }

[lints]
workspace = true
