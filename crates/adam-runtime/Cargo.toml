[package]
name = "adam-runtime"
description = "Durable agent-loop runtime for adam-rs: run state machine, journaled steps, workers"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
adam-error.workspace = true
adam-core.workspace = true
adam-otel.workspace = true
# The token counts of a model call (`Usage`), carried by `RunEvent::Usage` and `UsageTotals`: data
# types only, no client.
adam-model.workspace = true
# Observers of the events that follow a commit (ADR 0050, H4).
adam-plugin.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
jiff.workspace = true
# A session's `report_schema` must compile (ADR 0054, slice 9): the one admission function checks it.
# No default features: nothing is fetched.
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
opentelemetry.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
proptest.workspace = true
# The span tests of `worker` (ANR-1345): a subscriber that captures what a span renders.
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
adam-store-mongodb = { path = "../adam-store-mongodb", version = "0.7.0" } # x-release-please-version
adam-store-postgres = { path = "../adam-store-postgres", version = "0.7.0" } # x-release-please-version
adam-store-testkit.workspace = true

[lints]
workspace = true
