[package]
name = "adam"
description = "The adam-rs facade: one dependency for writing agents, with the #[tool] macro and a prelude"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["macros"]
# `#[tool]` (and the paths it generates code against, which are always there).
macros = ["dep:adam-macros"]
# `Assembly::card`: the root agent's `card:` as an `adam_a2a::AgentCardConfig`.
a2a = ["adam-assembly/a2a"]
# Dev reload (`adam::assembly::LiveAssembly`): read the agent directory at run time and swap the
# agents when a file changes. Off by default: a release build cannot read prompts from disk.
dev = ["adam-assembly/dev"]
# `mcp.json` tools (`adam::mcp`, `AgentDef::connect_mcp`): connect to the MCP servers an agent's files
# name and give the agent their tools. Off by default: it brings the MCP client and can start processes.
mcp = ["adam-assembly/mcp", "dep:adam-mcp"]

[dependencies]
adam-agent-fs.workspace = true
adam-assembly.workspace = true
adam-core.workspace = true
adam-error.workspace = true
adam-llm-agent = { workspace = true, features = ["schema"] }
adam-macros = { workspace = true, optional = true }
adam-mcp = { workspace = true, optional = true }
adam-model.workspace = true
adam-runtime.workspace = true

[dev-dependencies]
adam-mcp-testkit = { path = "../adam-mcp-testkit" }
schemars = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
trybuild.workspace = true

[lints]
workspace = true
