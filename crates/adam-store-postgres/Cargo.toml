[package]
name = "adam-store-postgres"
description = "PostgreSQL store for adam-rs durable agents"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The L2 memory adapter (`PgMemory`, ADR 0081): the `Memory` port over this database.
memory = ["dep:adam-memory"]

[dependencies]
adam-core.workspace = true
adam-error.workspace = true
adam-memory = { workspace = true, optional = true }
adam-postgres.workspace = true
async-trait.workspace = true
deadpool-postgres = "0.14"
jiff.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-jiff-0_2", "with-serde_json-1", "with-uuid-1"] }
uuid.workspace = true

[dev-dependencies]
adam-error.workspace = true
adam-memory-testkit.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
url.workspace = true
adam-store-testkit.workspace = true
jiff.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
