[package]
name = "adam-core"
description = "Core traits and types for adam-rs, a Rust framework for durable AI agents"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
adam-error.workspace = true
async-trait.workspace = true
# The turn signature (ADR 0068, `turn`): base64url, Ed25519, SHA-256 and RFC 8785's numbers.
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
jiff.workspace = true
ryu-js.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true
# The run key's CSR and leaf (ADR 0086, `turn::run_cert::keyring`): PKCS#10 in, RFC 5280's validity
# out. It signs with `ed25519-dalek` through `signature`'s traits; no driver type leaves this crate.
x509-cert.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "fs"] }

[lints]
workspace = true
