[package]
name = "adam-workspace"
description = "Per-run git worktrees, push and pull requests for adam-rs coding agents"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["github"]
# The GitHub REST `CodeHost` (pulls in `reqwest`).
github = ["dep:reqwest"]
# Test doubles (`MemoryCodeHost`) for downstream crates' tests.
test-util = []

[dependencies]
adam-error.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
# Enables the `test-util` feature for this crate's own tests.
adam-workspace = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "process", "sync", "time", "macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
