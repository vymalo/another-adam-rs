[package]
name = "adam-workspace"
description = "Per-run git worktrees, push and pull requests for adam-rs coding agents"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["github"]
# The GitHub REST `CodeHost` and the GitHub App credentials (pull in `reqwest`, and `aws-lc-rs` and
# `rustls-pki-types` to sign the App's JWT).
github = ["dep:reqwest", "dep:aws-lc-rs", "dep:chrono", "dep:rustls-pki-types"]
# Test doubles (`MemoryCodeHost`) for downstream crates' tests, and the seam that swaps a slot's
# directory between a check and the use that follows it (`safe_fs::race`).
test-util = []

[dependencies]
adam-error.workspace = true
adam-git-sandbox.workspace = true
async-trait.workspace = true
aws-lc-rs = { workspace = true, optional = true }
base64.workspace = true
chrono = { workspace = true, optional = true }
libc.workspace = true
reqwest = { workspace = true, optional = true }
# `openat2` and the `*at` calls, as safe functions: a slot is opened once and used by descriptor
# (`safe_fs::SlotDir`). Already in the tree through `tempfile`.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
rustls-pki-types = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
# Enables the `test-util` feature for this crate's own tests.
adam-workspace = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["fs", "process", "sync", "time", "macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
