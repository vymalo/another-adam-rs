[package]
name = "adam-postgres"
description = "PostgreSQL connection configuration shared by adam-rs's Postgres adapters"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
adam-core.workspace = true
adam-error.workspace = true
deadpool-postgres = "0.14"
percent-encoding = "2"
# `aws-lc-rs` is the process's provider (ADR 0019): the tree compiles both it and ring (mongodb),
# so the builder names the provider instead of asking for the process default.
rustls = { workspace = true, features = ["aws_lc_rs"] }
rustls-pki-types = { workspace = true, features = ["std"] }
tokio.workspace = true
tokio-postgres = { version = "0.7", features = [
    "with-jiff-0_2",
    "with-serde_json-1",
    "with-uuid-1",
] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["aws-lc-rs"] }
tracing.workspace = true
url.workspace = true
webpki-roots = "1"

[dev-dependencies]
jiff.workspace = true

[lints]
workspace = true
