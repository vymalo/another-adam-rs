[package]
name = "adam-host"
description = "The contract between adam-rs and a host app: the closed process Role enum and a small role-aware supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
default = ["supervisor"]
# `Role` as a clap `ValueEnum` (`--role control-plane`).
clap = ["dep:clap"]
# `Role` as a serde string ("control-plane").
serde = ["dep:serde"]
# `Host`: the role-aware supervisor (tokio + tokio-util).
supervisor = ["dep:tokio", "dep:tokio-util", "dep:tracing"]

[dependencies]
adam-error.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
