[package]
name = "adam-assembly"
description = "Bind an agent manifest to LlmAgents: templating, tool binding with did-you-mean errors, models, the A2A card"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# `Assembly::card`: the root agent's `card:` frontmatter as an `adam_a2a::AgentCardConfig`.
a2a = ["dep:adam-a2a"]
# Dev reload: read the agent directory at run time and swap the agents when a file changes
# (`LiveAssembly`, `AgentDef::from_dir`). Off by default, so a release build cannot read prompts
# from disk unless it opts in. The only feature that brings `notify`.
dev = ["dep:notify", "dep:adam-core"]

[dependencies]
# The A2A client behind remote subagents (`a2a:`): part of every build, so a manifest with a remote
# subagent binds the same way with or without the feature `a2a` (which is the server-side card).
a2a-client-lf.workspace = true
a2a-lf.workspace = true
adam-a2a = { path = "../adam-a2a", version = "0.1.0", optional = true }
adam-agent-fs.workspace = true
adam-core = { workspace = true, optional = true }
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
notify = { workspace = true, optional = true }
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The embedded agent (`build.rs` + `include_agent!`) that the end-to-end tests bind. The fixture
# depends on `adam`, which depends on this crate: a dev-dependency cycle, which cargo allows.
adam-agent-fixture = { path = "../adam-agent-fixture" }
# The in-process A2A server the remote-subagent tests talk to.
adam-a2a = { path = "../adam-a2a", version = "0.1.0", features = ["test-util"] }
adam-core.workspace = true
adam-store-postgres = { path = "../adam-store-postgres", version = "0.1.0" }
axum.workspace = true
futures.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
