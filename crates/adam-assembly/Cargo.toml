[package]
name = "adam-assembly"
description = "Bind an agent manifest to LlmAgents: templating, tool binding with did-you-mean errors, models, the A2A card"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["remote"]
# The root agent's A2A side: `Assembly::card` (its `card:` frontmatter as an `adam_a2a::AgentCardConfig`),
# and `child-sessions/v1`: `AgentDef::child_sessions` and `session_starters`, `Assembly::child_sessions`.
# It needs `remote`: the state of a round on a remote subagent holds an A2A request.
a2a = ["remote", "sessions", "adam-a2a/default", "adam-a2a-runtime/default"]
# `child-sessions/v1` alone, without the A2A client: `AgentDef::child_sessions` and
# `Assembly::child_sessions`, what a front serves the sessions of local subagents for. `adam-engine`
# turns it on; `a2a` turns it on too.
sessions = ["dep:adam-a2a", "dep:adam-a2a-runtime"]
# Dev reload: watch the agent directory and swap the agents when a file changes (`LiveAssembly`).
# Off by default, so a release build cannot watch and reload prompts unless it opts in (reading a
# folder once, at startup, needs no feature: `AgentFolder`). The only feature that brings `notify`.
dev = ["dep:notify"]
# `mcp.json` tools (`AgentDef::connect_mcp`): connect to the MCP servers an agent's files name and
# give the agent their tools. Off by default: it brings the MCP client and can start processes.
mcp = ["dep:adam-mcp"]
# Remote subagents (`a2a:` in a subagent file): the A2A client, an HTTP client and TLS. On by
# default; an application that embeds adam (ADR 0047) turns it off, and `bind` then refuses an
# `a2a:` subagent (`Error::RemoteNotEnabled`).
remote = ["dep:a2a-client-lf", "dep:a2a-lf", "dep:reqwest", "dep:url"]

[dependencies]
# The A2A client behind remote subagents (`a2a:`): the feature `remote`, which the feature `a2a` (the
# server-side card) turns on, so a remote subagent binds the same way with or without `a2a`.
a2a-client-lf = { workspace = true, optional = true }
a2a-lf = { workspace = true, optional = true }
# Without their defaults (the A2A server, push), so `sessions` alone brings no server or TLS; `a2a`
# turns the defaults back on, and a server build is unchanged.
adam-a2a = { path = "../adam-a2a", version = "0.1.0", default-features = false, optional = true }
adam-a2a-runtime = { path = "../adam-a2a-runtime", version = "0.1.0", default-features = false, optional = true }
adam-agent-fs.workspace = true
adam-core.workspace = true
adam-error.workspace = true
adam-llm-agent.workspace = true
adam-mcp = { workspace = true, optional = true }
adam-model.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
jiff.workspace = true
notify = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
# The embedded agent (`build.rs` + `include_agent!`) that the end-to-end tests bind. The fixture
# depends on `adam`, which depends on this crate: a dev-dependency cycle, which cargo allows.
adam-agent-fixture = { path = "../adam-agent-fixture" }
# The in-process A2A server the remote-subagent tests talk to.
adam-a2a = { path = "../adam-a2a", version = "0.1.0", features = ["test-util"] }
# The A2A front the child-sessions tests start a session through (the feature `a2a` of this crate).
adam-a2a-runtime.workspace = true
adam-error.workspace = true
# The MCP server the tests talk to (over HTTP: another package's binary is not available here).
adam-mcp-testkit = { path = "../adam-mcp-testkit" }
adam-store-mongodb = { path = "../adam-store-mongodb", version = "0.1.0" }
adam-store-postgres = { path = "../adam-store-postgres", version = "0.1.0" }
axum.workspace = true
futures.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

# The tests of remote subagents, and the embedded fixture, whose files name one (`a2a:`).
[[test]]
name = "remote"
required-features = ["remote"]

[[test]]
name = "remote_sessions"
required-features = ["remote"]

[[test]]
name = "fixture"
required-features = ["remote"]

[lints]
workspace = true
