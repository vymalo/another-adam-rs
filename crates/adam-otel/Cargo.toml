[package]
name = "adam-otel"
description = "The OpenTelemetry layer of adam-rs: OTLP/HTTP spans, off unless an endpoint is set (ADR 0075)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The TLS provider (aws-lc-rs) reqwest and rustls link. On by default; a host that installs its own
# (ring, the platform's) builds with `default-features = false`.
default = ["aws-lc"]
aws-lc = ["sdk", "reqwest/rustls", "rustls/aws_lc_rs"]
# The SDK, the OTLP/HTTP exporter and the tracing layer. Off, the crate is `labels` alone: a library
# that records measurements (adam-runtime) links no HTTP client and no TLS stack, which keeps
# adam-engine's embedded set (ADR 0047) clean. A binary that exports turns it on.
sdk = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:url",
]

[dependencies]
adam-error.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["registry", "fmt", "json", "env-filter"] }
url = { workspace = true, optional = true }

[dev-dependencies]
# The drift test in `labels`: the label set must be the store's run states.
adam-core = { path = "../adam-core" }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[[test]]
name = "export"
required-features = ["sdk"]

[lints]
workspace = true
