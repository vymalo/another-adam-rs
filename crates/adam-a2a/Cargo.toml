[package]
name = "adam-a2a"
description = "Expose adam-rs agents as A2A (Agent2Agent) servers over axum"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Ships `InMemoryBackend`, a reference `TaskBackend` for tests (also useful to other repos' tests).
test-util = ["dep:tokio-stream"]

[dependencies]
adam-error.workspace = true
a2a-lf.workspace = true
# Signs the agent card (ES256, EdDSA) and reads the PEM of its key; already in the tree under rustls.
aws-lc-rs.workspace = true
base64.workspace = true
rustls-pki-types.workspace = true
ryu-js.workspace = true
# Push-notification delivery: one client that never follows a redirect and only connects to the
# addresses the guarded resolver allows.
reqwest.workspace = true
uuid.workspace = true
a2a-server-lf.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt", "net"] }
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
# Swagger UI's assets, bundled in the binary (no CDN, nothing downloaded at build time).
utoipa-swagger-ui.workspace = true

[dev-dependencies]
# Turns on `test-util` for this crate's own tests.
adam-a2a = { path = ".", features = ["test-util"] }
a2a-client-lf.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
wiremock.workspace = true
# Checks the OpenAPI document against the OpenAPI 3.1 JSON Schema, compiles its schemas, and
# validates the examples and real responses against them.
jsonschema.workspace = true

[lints]
workspace = true
