[package]
name = "adam-a2a"
description = "Expose adam-rs agents as A2A (Agent2Agent) servers over axum"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The A2A server (axum, the SDK's server, Swagger UI), card signing and push delivery (reqwest, rustls). On
# by default; an embedded build (adam ADR 0047) turns it off and keeps the backend port, the card and the
# extensions, which are data.
default = ["server"]
server = [
  "dep:a2a-server-lf",
  "dep:axum",
  "dep:aws-lc-rs",
  "dep:reqwest",
  "dep:rustls-pki-types",
  "dep:utoipa-swagger-ui",
  "dep:memchr",
  "dep:ryu-js",
  "dep:subtle",
  "dep:uuid",
  "tokio/net",
]
# Ships `InMemoryBackend`, a reference `TaskBackend` for tests (also useful to other repos' tests).
test-util = ["dep:tokio-stream"]

[dependencies]
adam-core.workspace = true
adam-error.workspace = true
# The reasoning vocabulary (`ReasoningEffort`, ADR 0063): one closed list of seven words, not a
# second copy in the extension's wire.
adam-model.workspace = true
a2a-lf.workspace = true
# Signs the agent card (ES256, EdDSA) and reads the PEM of its key; already in the tree under rustls.
aws-lc-rs = { workspace = true, optional = true }
base64.workspace = true
rustls-pki-types = { workspace = true, optional = true }
ryu-js = { workspace = true, optional = true }
# Push-notification delivery: one client that never follows a redirect and only connects to the
# addresses the guarded resolver allows.
reqwest = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
a2a-server-lf = { workspace = true, optional = true }
async-trait.workspace = true
axum = { workspace = true, optional = true }
chrono.workspace = true
futures.workspace = true
# Finds the legacy push config name in a request body without scanning it twice (server, rest).
memchr = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
# Swagger UI's assets, bundled in the binary (no CDN, nothing downloaded at build time).
utoipa-swagger-ui = { workspace = true, optional = true }

[dev-dependencies]
jiff.workspace = true
# Turns on `test-util` for this crate's own tests.
adam-a2a = { path = ".", features = ["test-util"] }
a2a-client-lf.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
wiremock.workspace = true
# Checks the OpenAPI document against the OpenAPI 3.1 JSON Schema, compiles its schemas, and
# validates the examples and real responses against them.
jsonschema.workspace = true

[lints]
workspace = true
