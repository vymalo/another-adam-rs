[package]
name = "adam-a2a"
description = "Expose adam-rs agents as A2A (Agent2Agent) servers over axum"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Ships `InMemoryBackend`, a reference `TaskBackend` for tests (also useful to other repos' tests).
test-util = ["dep:tokio-stream"]

[dependencies]
a2a-lf.workspace = true
a2a-server-lf.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Turns on `test-util` for this crate's own tests.
adam-a2a = { path = ".", features = ["test-util"] }
a2a-client-lf.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
