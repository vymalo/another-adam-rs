[package]
name = "adam-operator-api"
description = "The v0 CRD types of the adam-rs operator: AgentService and AgentConfig"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
k8s-openapi = { workspace = true, features = ["schemars"] }
kube = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `cel`: evaluates the CRD's x-kubernetes-validations locally, as a proxy for an API server.
kube = { workspace = true, features = ["cel"] }
serde_yaml.workspace = true

[lints]
workspace = true
