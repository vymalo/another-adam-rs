[package]
name = "adam-a2a-runtime"
description = "A2A TaskBackend over the adam-rs durable runtime: tasks are runs, subscriptions are replayable from the store"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Push notifications: the store of configs and delivery cursors (`StorePushStore`) over the run store, and
# adam-a2a's server and delivery client it serves. On by default; an embedded build (adam ADR 0047) turns it off.
default = ["push"]
push = ["adam-a2a/server"]

[dependencies]
adam-error.workspace = true
a2a-lf.workspace = true
adam-a2a = { path = "../adam-a2a", version = "0.6.0", default-features = false } # x-release-please-version
adam-agent-fs.workspace = true
adam-core.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
jiff.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
adam-llm-agent.workspace = true
adam-model.workspace = true
# The client the `reasoning/v1` test drives the whole chain through (`tests/reasoning.rs`).
adam-model-openai = { workspace = true, features = ["aws-lc"] }
adam-store-postgres = { path = "../adam-store-postgres", version = "0.6.0" } # x-release-please-version
adam-store-testkit.workspace = true
a2a-client-lf.workspace = true
async-trait.workspace = true
axum.workspace = true
secrecy.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

# These tests need the server parts: an embedded build (no default features) leaves them out.
[[test]]
name = "backend"
required-features = ["push"]

[[test]]
name = "text_stream"
required-features = ["push"]

[[test]]
name = "steer"
required-features = ["push"]

[[test]]
name = "usage"
required-features = ["push"]

[[test]]
name = "model_park"
required-features = ["push"]

[lints]
workspace = true
