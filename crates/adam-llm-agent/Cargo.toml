[package]
name = "adam-llm-agent"
description = "Durable LLM tool-calling agent for adam-rs: the model/tool loop on top of adam-runtime"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Argument schemas from `schemars::JsonSchema`: `spec_for`, `ToolSpecExt::for_args`, `FnTool::builder`,
# and the paths the `#[tool]` macro emits (`__private`). It enables schemars' `derive` so that
# `#[derive(JsonSchema)]` works for whoever depends on this feature.
schema = ["dep:schemars", "schemars/derive"]

[dependencies]
adam-budget.workspace = true
adam-error.workspace = true
adam-core.workspace = true
adam-model.workspace = true
# The compiled hook set around a tool call (ADR 0050, slice H1): the loop runs it inside the
# call's journaled step.
adam-plugin.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
futures.workspace = true
jiff.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
adam-memory.workspace = true
tokio = { workspace = true, features = ["test-util"] }
schemars = { workspace = true, features = ["derive"] }
proptest.workspace = true
adam-store-mongodb = { path = "../adam-store-mongodb", version = "0.6.0" } # x-release-please-version
adam-store-postgres = { path = "../adam-store-postgres", version = "0.6.0" } # x-release-please-version
adam-store-testkit.workspace = true
adam-model-openai = { workspace = true, features = ["aws-lc"] }
secrecy.workspace = true
wiremock.workspace = true

[lints]
workspace = true
