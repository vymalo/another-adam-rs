[package]
name = "adam-llm-agent"
description = "Durable LLM tool-calling agent for adam-rs: the model/tool loop on top of adam-runtime"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Argument schemas from `schemars::JsonSchema`: `spec_for`, `ToolSpecExt::for_args`, `FnTool::builder`,
# and the paths the `#[tool]` macro emits (`__private`). It enables schemars' `derive` so that
# `#[derive(JsonSchema)]` works for whoever depends on this feature.
schema = ["dep:schemars", "schemars/derive"]

[dependencies]
adam-error.workspace = true
adam-core.workspace = true
adam-model.workspace = true
adam-runtime.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
schemars = { workspace = true, features = ["derive"] }
proptest.workspace = true
adam-store-mongodb = { path = "../adam-store-mongodb", version = "0.1.0" }
adam-store-postgres = { path = "../adam-store-postgres", version = "0.1.0" }
adam-store-testkit.workspace = true

[lints]
workspace = true
