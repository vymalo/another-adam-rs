      type: string
    - jsonPath: .status.runtime.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A durable, addressable adam-rs agent service. It names an AgentConfig and the operator makes the workload, Service, NetworkPolicy and storage for it.
        properties:
          spec:
            description: |-
              The desired state of an agent as a service: which config it runs, which interfaces it
              serves, how it scales and where its ledger lives.
            properties:
              access:
                default:
                  allowFrom: []
                description: Who may reach the service.
                properties:
                  allowFrom:
                    default: []
                    description: |-
                      Peers allowed to reach port 8080: the `from` of a NetworkPolicy ingress rule. There is no
                      egress rule: the agent needs git hosts, the model gateway and registries.
                    items:
                      description: NetworkPolicyPeer describes a peer to allow traffic to/from. Only certain combinations of fields are allowed
                      properties:
                        ipBlock:
                          description: ipBlock defines policy on a particular IPBlock. If this field is set then neither of the other fields can be.
                          properties:
                            cidr:
                              description: cidr is a string representing the IPBlock Valid examples are "192.168.1.0/24" or "2001:db8::/64"
                              type: string
                            except:
                              description: except is a slice of CIDRs that should not be included within an IPBlock Valid examples are "192.168.1.0/24" or "2001:db8::/64" Except values will be rejected if they are outside the cidr range
                              items:
                                type: string
                              type: array
                          required:
                          - cidr
                          type: object
                        namespaceSelector:
                          description: |-
                            namespaceSelector selects namespaces using cluster-scoped labels. This field follows standard label selector semantics; if present but empty, it selects all namespaces.

                            If podSelector is also set, then the NetworkPolicyPeer as a whole selects the pods matching podSelector in the namespaces selected by namespaceSelector. Otherwise it selects all pods in the namespaces selected by namespaceSelector.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                              items:
                                description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector applies to.
                                    type: string
                                  operator:
                                    description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
