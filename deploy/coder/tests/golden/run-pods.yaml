# Source: coder/templates/run-pods-rbac.yaml
# What the coder does with run pods: make, find, watch and delete them, and exec in them. Nothing else: no Secret,
# no ConfigMap, no other kind. `get` on pods/exec as well as `create`: kube's exec is a WebSocket, which the API
# server authorizes as a GET (and, from Kubernetes 1.35, as a create too; *unverified*).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-run-pods
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/instance: coder
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: coder-0.4.0
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
# Source: coder/templates/run-pods-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-run-pods
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/instance: coder
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: coder-0.4.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-run-pods
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder-ns
---
