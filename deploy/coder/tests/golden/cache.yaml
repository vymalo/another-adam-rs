    app.kubernetes.io/instance: coder
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: coder-0.4.0
spec:
  instances: 1
  storage:
    size: "5Gi"
    storageClass: "longhorn"
  bootstrap:
    initdb:
      database: adam
      owner: adam
