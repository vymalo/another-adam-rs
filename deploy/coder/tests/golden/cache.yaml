# Source: coder/templates/run-pods-configmap.yaml
# runPods.enabled: the pod every run pod is made from (ADR 0019). The coder reads it at startup
# (RUN_POD_TEMPLATE_FILE); a change is a deploy (the pod's checksum annotation).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-run-pod
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/instance: coder
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: coder-0.4.0
data:
  pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app.kubernetes.io/name: coder-run
        app.kubernetes.io/component: run
    spec:
      priorityClassName: coder-run
      # A run pod holds no credential for the cluster.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: coder
                  app.kubernetes.io/instance: coder
      initContainers:
        - name: tools
          image: "ghcr.io/vymalo/another-adam-rs/coder:sha-abc1234"
          imagePullPolicy: IfNotPresent
          # adam-exec and the native OpenCode, out of the coder's image, into the directory the run container mounts
          # read-only: the layout of a devcontainer's tools directory.
          command: ["sh", "-c", "cp -L /opt/adam/bin/adam-exec /opt/adam/bin/opencode /tools/ && chmod 0755 /tools/adam-exec /tools/opencode"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: run
          image: "ghcr.io/vymalo/another-agentic-images/workspace:1.98.1-e6a528f@sha256:d2aae762ecad2c13bb697332507d236a75d8233d061f38cc97dc9227192b0797"
          imagePullPolicy: IfNotPresent
          workingDir: /work
          # tini reaps what a killed command leaves; the commands are exec'd into the container by adam-kube-exec.
          command: ["tini", "--", "sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            - name: CARGO_BUILD_JOBS
              value: "2"
            - name: HTTPS_PROXY
              value: "http://coder-egress.coder-ns.svc:3128"
            - name: https_proxy
              value: "http://coder-egress.coder-ns.svc:3128"
            - name: HTTP_PROXY
              value: "http://coder-egress.coder-ns.svc:3128"
            - name: http_proxy
              value: "http://coder-egress.coder-ns.svc:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1"
            - name: no_proxy
              value: "localhost,127.0.0.1"
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coder
                  key: MODEL_API_KEY
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: cache
              mountPath: /cache
            - name: tools
              mountPath: /opt/adam/bin
              readOnly: true
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: work-coder-0
        - name: cache
          persistentVolumeClaim:
            claimName: coder-cache
        - name: tools
          emptyDir: {}
