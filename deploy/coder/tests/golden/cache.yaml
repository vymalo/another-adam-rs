# Source: coder/templates/externalsecret.yaml
# Secret values live in AWS Secrets Manager (`prod/meta/test-app`)
# and are copied into a Secret by External Secrets; none is in this chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/instance: coder
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: coder-0.4.0
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: coder
    creationPolicy: Owner
  data:
    - secretKey: MODEL_API_KEY
      remoteRef:
        key: prod/meta/test-app
        property: adam_coder_model_api_key
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: prod/meta/test-app
        property: adam_coder_github_token
    - secretKey: A2A_BEARER_TOKENS
      remoteRef:
        key: prod/meta/test-app
        property: adam_coder_a2a_bearer_tokens
