# Source: coder/templates/run-pods-egress-networkpolicy.yaml
# runPods.enabled: what the egress proxy may reach (ADR 0042). Ingress only from the run pods, on the proxy's port: no
# other pod of the cluster is a client. (The kubelet's probes come from the node, which needs no rule: the Kubernetes
# documentation says "traffic to and from the node where a Pod is running is always allowed", *verified 2026-10-27*.)
# Egress to DNS and to the internet on the proxy's ports only (443 by default), except blockedCIDRs and clusterCIDRs, so
# that even a bug of the proxy cannot open a connection to the cluster. IPv4 only: no rule names an IPv6 range, so
# IPv6 egress is denied. Only as real as the CNI that enforces it (*unverified* for the owner's cluster).
