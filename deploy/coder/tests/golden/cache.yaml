# Source: coder/templates/run-pods-admission.yaml
# runPods.enabled: the guard that lets the coder make pods without being able to read the namespace's other Secrets,
# mount the host, or run anything privileged. It applies to pods CREATED BY the coder's ServiceAccount (the match
# condition) in this namespace (the binding), and refuses any that is not the intended run pod. Without it the RBAC
# alone would let the coder create any pod in its namespace. A run pod may reference exactly one Secret key, the model
# key, by the Secret's name and the key: no Secret volume, no envFrom, no other key of that Secret (ADR 0041).
# Needs Kubernetes 1.30 or later (admissionregistration.k8s.io/v1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: coder-coder-ns-run-pods
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/instance: coder
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: coder-0.4.0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: made-by-the-coder
      expression: "request.userInfo.username == 'system:serviceaccount:coder-ns:coder'"
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "has(object.metadata.labels) && 'adam.vymalo.com/run' in object.metadata.labels && 'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == 'adam-coder'"
      message: "a run pod carries the labels app.kubernetes.io/managed-by=adam-coder and adam.vymalo.com/run"
    - expression: "has(object.spec.priorityClassName) && object.spec.priorityClassName == 'coder-run'"
      message: "a run pod has the priority class coder-run, which the quota is scoped to"
    - expression: "variables.containers.all(c, c.image in ['ghcr.io/vymalo/another-agentic-images/workspace:1.98.1-e6a528f@sha256:d2aae762ecad2c13bb697332507d236a75d8233d061f38cc97dc9227192b0797', 'ghcr.io/vymalo/another-adam-rs/coder:sha-abc1234'])"
      message: "a run pod uses only the images the chart allows"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ['work-coder-0', 'coder-cache']))"
      message: "a run pod mounts only emptyDir volumes and the claims work-coder-0 and coder-cache: no hostPath, no Secret, no other claim"
    - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || (e.valueFrom.secretKeyRef.name == 'coder' && e.valueFrom.secretKeyRef.key == 'MODEL_API_KEY'))) && (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))"
      message: "a run pod references no Secret but the key MODEL_API_KEY of coder (as one variable): no Secret volume, no envFrom, no other key"
    - expression: "variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && (!has(c.securityContext.privileged) || c.securityContext.privileged == false))"
      message: "a run pod is not privileged and sets allowPrivilegeEscalation: false on every container"
    - expression: "variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.runAsUser) ? c.securityContext.runAsUser : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) ? object.spec.securityContext.runAsUser : 0)) != 0 && (has(c.securityContext) && has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) ? object.spec.securityContext.runAsNonRoot : false)))"
      message: "a run pod does not run as root: a runAsUser other than 0 and runAsNonRoot: true on every container"
    - expression: "(!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "a run pod uses its own network, PID and IPC namespaces"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "a run pod sets automountServiceAccountToken: false: it holds no credential for the cluster"
