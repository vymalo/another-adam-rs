# The coder agent. Reachable only inside the cluster: the orchestrator
# (namespace `another-agentic-system`) talks A2A to the Service with a bearer
# token. There is deliberately no Ingress here.

image:
  repository: ghcr.io/vymalo/another-adam-rs/coder
  # Bumped on every green build of main by .github/workflows/coder.yml
  # (`sha-<first 7 of the commit>`). A plain key so the workflow can edit it.
  # sha-0000000 is the placeholder that exists before the first build.
  tag: sha-ed4b2cd
  pullPolicy: IfNotPresent

# The image package may be private; name a pull secret here if so.
imagePullSecrets: []

# How the binary is deployed.
#   combined  one StatefulSet runs the A2A server and the workers (config.role).
#   split     a front Deployment (ROLE=control-plane, no volume) serves A2A, and
#             the StatefulSet below becomes the worker (ROLE=worker). The
#             StatefulSet keeps its name, selector and volume claim, so
#             switching either way reuses the same PVC. config.role must be
#             empty: the chart sets ROLE itself.
topology: combined

# The front Deployment; rendered only with topology=split.
front:
  replicas: 1
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# The workers: the StatefulSet's replicas. Runs move between workers at every step, and a
# worktree lives in one worker's /work, so more than 1 needs a workspace.placement (below);
# the chart refuses replicaCount > 1 while it is empty, or a run that lands on a worker
# without its worktree would fork into a second pull request. With a pinning placement
# (affinity, isolated) never scale the workers in: a run owned by a removed pod is stranded.
replicaCount: 1

# Environment of the binary (see bin/adam-coder/src/config.rs). Secrets are
# not here: they come from the ExternalSecret below.
config:
  # What the process runs: all, control-plane or worker (ROLE). Empty leaves ROLE
  # unset, and the binary runs `all`: the A2A server and the workers in one
  # process. With topology=combined a role other than `all` only changes what
  # that one pod runs; leave it empty with topology=split, which sets ROLE for
  # the front (control-plane) and the worker (worker) itself.
  # `control-plane` renders none of the model, GitHub and workspace settings
  # below (modelBaseUrl through gitAuthorEmail), none of the two secrets
  # they need (properties.modelApiKey, properties.githubToken) and no GitHub App
  # settings or key volume (github.app): it only starts, delivers to, cancels
  # and views runs. `all` and `worker` need all of them.
  role: ""
  # OpenAI-compatible gateway, with its /v1 prefix. Roles that run workers only. The default is a
  # placeholder that is never a real gateway: set it to the URL of yours, or keep the URL out of
  # git with modelBaseUrlFromSecret below.
  modelBaseUrl: "https://gateway.example.invalid/v1"
  # true: MODEL_BASE_URL comes from the ExternalSecret (externalSecrets.properties.modelBaseUrl),
  # like MODEL_API_KEY, and modelBaseUrl above must stay unset (the placeholder, or empty): the chart
  # refuses a real URL there, and refuses the option with externalSecrets.enabled=false or with
  # properties.modelBaseUrl empty. Roles that run workers only; a control plane renders neither. Add
  # the AWS property BEFORE turning this on: a missing property fails the whole ExternalSecret sync.
  # The URL is not a credential and still shows in the pod's environment and the startup log.
  modelBaseUrlFromSecret: false
  # Model alias of the agent, and the one OpenCode uses through the same gateway.
  model: "coder"
  opencodeModel: "coder"
  # URL clients reach the JSON-RPC endpoint at (goes into the agent card).
  # Empty: the in-cluster Service URL.
  publicUrl: ""
  # Runs advanced at the same time.
  workers: 4
  # Failed run_checks after which the agent must stop and report.
  maxCheckCycles: 3
  # Time limit of one run_checks command, in seconds.
  checkTimeoutSecs: 900
  # How often the janitor removes the workspaces of finished runs (done, failed or cancelled; a
  # run that waits for an answer is never swept), in seconds. 0 turns it off.
  workspaceSweepSecs: 300
  # Hosts repositories may live on (a name for any port, or name:port). The
  # GitHub token is only ever sent to these; a repository URL on any other host
  # is refused before git runs. GitHub Enterprise: add its host.
  allowedRepoHosts:
    - github.com
  # GitHub REST API root. GitHub Enterprise: https://<host>/api/v3 (and add the
  # host to allowedRepoHosts).
  githubApiUrl: "https://api.github.com"
  # Open pull requests as drafts.
  prDraft: false
  gitAuthorName: "adam-coder"
  gitAuthorEmail: "adam-coder@users.noreply.github.com"
  # Extra environment variables, as a name -> value map.
  extraEnv: {}

# How the coder authenticates to GitHub (ADR 0009). Roles that run workers only: a control
# plane renders none of it.
github:
  # token  (default) one token, GITHUB_TOKEN, from externalSecrets.properties.githubToken. It is
  #        valid for as long as it is: a classic or fine-grained personal access token, or a
  #        token someone refreshes.
  # app    a GitHub App installation: the coder signs a short-lived JWT with the App's private
  #        key and trades it for an installation access token (valid for 1 hour, renewed
  #        before it runs out), per installation and scoped to what the App was granted. One
  #        installation (app.installationId) or the installation of each owner (app.owners).
  #        GITHUB_TOKEN is then neither rendered nor required, and the ExternalSecret has no
  #        githubToken entry. The key is read at startup: a rotated key needs a restart.
  auth: token
  # The owners (users or organisations) the coder may create repositories for, after the person it
  # works with agrees every time (ADR 0009, decision 9). Empty (default) turns the tool off. A GitHub
  # App creates for organisations only and needs the Administration permission; a token creates
  # for the person it belongs to and for organisations it can, with the `repo` scope.
  createRepoOwners: []
  app:
    # The App's application ID (a number) or its client ID (`Iv1.…`): the JWT's `iss`.
    id: ""
    # Exactly one of installationId and owners.
    #
    # installationId: pin the App to ONE installation, a positive integer (the last part of the URL of
    # the installation's settings page). It serves every repository the coder works on, so it fits a
    # deployment that works on one account. GITHUB_APP_INSTALLATION_ID.
    installationId: ""
    # owners: the accounts (users and organisations) the coder may act for, and no pin. The
    # installation of each repository's owner is found with the App's key, and a token is minted for
    # each, so one deployment works on several accounts. Required without a pin, and there is no
    # default, because a PUBLIC App can be installed by anyone: an account that installed it is no
    # proof that you want it acted for. Names are compared without case; `*` is every account the App
    # is installed on (the coder logs a warning; it is refused beside other names). A list, or a
    # string of names separated by commas or spaces. GITHUB_APP_OWNERS.
    #   owners: [acme, octocat]
    owners: []
    # Name of a Secret in this namespace that you (or another ExternalSecret) manage, with one
    # key, `private-key.pem`: the App's private key as GitHub gives it (PKCS#1) or PKCS#8. The
    # chart mounts it read-only at /var/run/secrets/github-app and sets
    # GITHUB_APP_PRIVATE_KEY_PATH to the file. The chart never carries the key itself.
    privateKeySecret: ""

# The GitHub MCP server the coder reads GitHub through (ADR 0017, D4), as a native sidecar of every pod
# that runs workers (an init container with restartPolicy: Always; Kubernetes 1.29 and later, GA in
# 1.33). It is `github-mcp-server http --read-only --toolsets context,repos,issues,pull_requests` from
# the coder's own image, on loopback, holding no credential: the coder sends the token of each call
# in its Authorization header, so one process serves every account the coder can act for, and no
# key or token is at rest in it. A control plane renders none of it.
githubMcp:
  enabled: true
  # The port it listens on, on 127.0.0.1. The coder's shipped agent files name 8082: another port
  # needs an agent folder (ADAM_AGENT_DIR) whose mcp.json names it. The chart sets GITHUB_MCP_URL to
  # match.
  port: 8082
  # GITHUB_HOST of the server: the GitHub Enterprise host, as config.allowedRepoHosts' first entry
  # (nothing can check that across containers). Empty is github.com.
  host: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Extra MCP servers for the coder, on top of the GitHub one. Both are off by default, and with both off the
# render is exactly what it was without this block. With either on, the chart renders ONE file of servers
# (a ConfigMap, in the shape of mcp.json) and sets ADAM_EXTRA_MCP_FILE on the workers: the binary merges
# it over the agent's own mcp.json at startup (a name clash with the agent's own servers stops it, exit 78).
# The agent's prompt and files stay in the binary, so the chart and the image cannot disagree about them.
# The coder has them in every conversation: the model sees their tools as `websearch__<tool>` and
# `context7__<tool>`. The keys are never values: they come from the ExternalSecret
# (externalSecrets.properties.searchMcpToken, .context7ApiKey) into the environment of the workers, the
# file holds `${SEARCH_MCP_TOKEN}` and `${CONTEXT7_API_KEY}`, and the binary hides every variable a
# mcp.json names from the checks, commands and OpenCode it starts, and redacts its value from tool output.
#
# Put the AWS properties in place BEFORE turning a server on (README "Extra MCP servers": a property that is
# missing in AWS fails the whole ExternalSecret sync, a key missing from the Secret keeps new pods in
# CreateContainerConfigError, and an empty value is refused by the binary).
mcp:
  # Our web search server (Brave behind our own MCP pod, deployed by the another-agentic-system
  # chart). On when `url` is set; empty (default) is off. The Service of that release, in cluster, for
  # example http://<service>.<namespace>.svc.cluster.local:<port>/mcp.
  websearch:
    url: ""
    # The request header that carries the token, and the text before it (the value is
    # `<valuePrefix>${SEARCH_MCP_TOKEN}`): `Authorization: Bearer <token>` by default.
    header: Authorization
    valuePrefix: "Bearer "
    # Optional allow-list of the server's tools (a list). Empty keeps all of them; a name the server lacks
    # skips an optional server (and stops a required one).
    tools: []
    # A third party that is down must not crash-loop the coder: an optional server that cannot be
    # reached or listed, or whose key has no value, is skipped with a warning and the worker starts
    # without it. false makes it required (the worker exits 69 while it is down).
    optional: true
    # A plain http:// URL to a host that is not this machine is refused by the coder unless
    # MCP_ALLOW_INSECURE is set, and the render fails without one of: this value true (the chart then
    # sets MCP_ALLOW_INSECURE on the workers), or config.extraEnv.MCP_ALLOW_INSECURE: "true". The variable
    # is ONE switch: it covers every MCP server of the agent and the thread-tools endpoints that A2A
    # senders announce, and the bearer crosses the network in the clear. Prefer an https URL.
    allowInsecure: false
  # Context7, the hosted documentation server. On with `enabled: true` (a boolean).
  context7:
    enabled: false
    url: https://mcp.context7.com/mcp
    header: Authorization
    valuePrefix: "Bearer "
    tools: []
    optional: true

service:
  port: 8080

# Where a run's files live (ADR 0002). The chart sets WORKSPACE_PLACEMENT from this on the
# roles that run workers, and, for the placements that pin runs, WORKER_ID from the pod name
# (downward API; stable per StatefulSet pod).
workspace:
  # One of:
  #   ""        (default) not set: no WORKSPACE_PLACEMENT, no WORKER_ID, and each pod has a
  #             volume of its own from persistence (below). This is the single-worker render
  #             this chart always had; the binary reads it as `shared`, which is the same
  #             thing for one worker. replicaCount > 1 is refused until you choose one.
  #   shared    one ReadWriteMany volume (sharedVolume below) mounted by every worker; any
  #             worker may step any run. Safe across processes through the mirror lock, which
  #             relies on flock(2) being honoured by the volume (unverified for NFS and
  #             Longhorn RWX: test two workers against one repository first).
  #   affinity  the same one ReadWriteMany volume, but a run is stepped only by the worker
  #             that first claimed it, and each worker keeps its files in /work/<pod name>.
  #   isolated  a volume per worker (persistence below, one PVC per pod), used as it is; a
  #             run is stepped only by the worker that first claimed it. Losing a volume
  #             loses the workspace of its runs.
  # a2a-only is refused: every tool of the coder needs a workspace.
  # Changing between the per-pod volume (empty, isolated) and the shared one (shared,
  # affinity) changes the StatefulSet's volumeClaimTemplates, which Kubernetes does not let
  # you edit: delete the StatefulSet with --cascade=orphan first, then upgrade.
  placement: ""
  # The volume behind shared and affinity (ignored by "" and isolated). Set storageClass to a
  # class that supports ReadWriteMany, or existingClaim to use a claim you manage (then the
  # chart creates none, and size, storageClass and accessModes are unused).
  sharedVolume:
    existingClaim: ""
    storageClass: ""
    size: 50Gi
    accessModes:
      - ReadWriteMany

# Mirrors and worktrees. They persist across restarts: git is the durable
# artifact, and a restarted run finds its worktree again. This is the per-pod volume
# (StatefulSet volumeClaimTemplates) used with workspace.placement "" and isolated; shared and
# affinity use workspace.sharedVolume instead.
persistence:
  size: 20Gi
  storageClass: longhorn
  accessModes:
    - ReadWriteOnce

# The coder's own Postgres, created by CloudNativePG.
database:
  enabled: true
  name: adam
  owner: adam
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  # Backups are out of scope for the MVP: losing this database loses the run
  # ledger (running and finished runs), not the pushed branches or the pull
  # requests. Known risk.

# Secret values come from AWS Secrets Manager through External Secrets.
externalSecrets:
  enabled: true
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  # The AWS secret, and the JSON property of each value inside it.
  key: prod/meta/test-app
  properties:
    # modelApiKey and githubToken are read by the roles that run workers (all,
    # worker); with config.role=control-plane they are neither rendered nor
    # required, and may be set to null. githubToken is also neither rendered nor
    # required with github.auth=app.
    modelApiKey: adam_coder_model_api_key
    # The gateway's base URL, read only with config.modelBaseUrlFromSecret=true, and only by the
    # roles that run workers. With the option off nothing reads it.
    modelBaseUrl: model_base_url
    githubToken: adam_coder_github_token
    # Comma-separated bearer tokens the A2A server accepts.
    a2aBearerTokens: adam_coder_a2a_bearer_tokens
    # The tokens of the extra MCP servers (mcp.* above), read only by the roles that run workers and
    # only when that server is on. Found under the same `key` as the others: a deployment that turns
    # them on sets `key` to the AWS secret that holds all of them.
    searchMcpToken: search_mcp_token
    context7ApiKey: context7_api_key
  # Name of the Kubernetes Secret it creates. Empty: <release>-coder.
  targetSecretName: ""

# Only the orchestrator's namespace may reach the pod. Egress is left open (git
# hosts, the model gateway, package registries, and the extra MCP servers of `mcp`: the web search
# Service and Context7 on 443), so this policy needs no rule for them. Do not add `Egress` to its
# policyTypes without adding them.
networkPolicy:
  enabled: true
  allowedNamespace: another-agentic-system

# uid/gid 10001 is the runtime user of the workspace image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Do not chown the whole volume (mirrors, worktrees) on every mount.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Workers finish the steps they are in on SIGTERM; a step cut short by SIGKILL
# is taken over by the next start once its lease expires.
terminationGracePeriodSeconds: 120

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 6Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
