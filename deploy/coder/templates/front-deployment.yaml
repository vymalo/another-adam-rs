{{- if eq .Values.topology "split" }}
# topology=split: the control plane (ROLE=control-plane) serves A2A and starts,
# delivers to, cancels and views runs. It needs neither the model, GitHub nor a
# workspace, so it has no volume; the worker StatefulSet runs the steps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coder.frontName" . }}
  labels:
    {{- include "coder.frontLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.front.replicas }}
  selector:
    matchLabels:
      {{- include "coder.frontSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coder.frontSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (include "coder.agentFolder" .) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "coder.agentFolder" . }}
        {{- /* A changed prompt or mcp.json is a deploy: the agent folder is read at startup only. */}}
        checksum/agent-files: {{ include (print $.Template.BasePath "/agent-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.front.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: coder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: ROLE
              value: "control-plane"
            - name: PUBLIC_URL
              value: {{ include "coder.publicUrl" . | quote }}
            {{- if include "coder.agentFolder" . }}
            - name: ADAM_AGENT_DIR
              value: {{ include "coder.agentDir" . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.config.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Created by CloudNativePG for the app database and owner.
                  name: {{ include "coder.dbName" . }}-app
                  key: uri
            {{- end }}
            {{- if .Values.externalSecrets.enabled }}
            - name: A2A_BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: A2A_BEARER_TOKENS
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.front.resources | nindent 12 }}
          {{- if include "coder.agentFolder" . }}
          volumeMounts:
            - name: agent-files
              mountPath: {{ include "coder.agentDir" . }}
              readOnly: true
          {{- end }}
      {{- if include "coder.agentFolder" . }}
      volumes:
        - name: agent-files
          configMap:
            name: {{ include "coder.agentConfigMapName" . }}
            defaultMode: 0444
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
