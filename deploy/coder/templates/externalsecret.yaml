{{- if .Values.externalSecrets.enabled }}
# Secret values live in AWS Secrets Manager (`{{ .Values.externalSecrets.key }}`)
# and are copied into a Secret by External Secrets; none is in this chart.
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "coder.secretName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "coder.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: MODEL_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ .Values.externalSecrets.properties.modelApiKey }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ .Values.externalSecrets.properties.githubToken }}
    - secretKey: A2A_BEARER_TOKENS
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ .Values.externalSecrets.properties.a2aBearerTokens }}
{{- end }}
