{{- if .Values.externalSecrets.enabled }}
# Secret values live in AWS Secrets Manager (`{{ .Values.externalSecrets.key }}`)
# and are copied into a Secret by External Secrets; none is in this chart.
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "coder.secretName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "coder.secretName" . }}
    creationPolicy: Owner
  data:
    {{- if include "coder.runsWorkers" . }}
    - secretKey: MODEL_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ required "externalSecrets.properties.modelApiKey is required unless config.role is control-plane" .Values.externalSecrets.properties.modelApiKey }}
    {{- /* config.modelBaseUrlFromSecret: the gateway's URL is read from AWS like the key (never a chart value). */}}
    {{- if include "coder.modelBaseUrlFromSecret" . }}
    - secretKey: MODEL_BASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ required "externalSecrets.properties.modelBaseUrl is required with config.modelBaseUrlFromSecret" .Values.externalSecrets.properties.modelBaseUrl }}
    {{- end }}
    {{- /* github.auth=app: the coder holds an App key, not a token, so there is no GITHUB_TOKEN to copy. */}}
    {{- if not (include "coder.githubApp" .) }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ required "externalSecrets.properties.githubToken is required unless config.role is control-plane or github.auth is app" .Values.externalSecrets.properties.githubToken }}
    {{- end }}
    {{- /* The extra MCP servers' keys (mcp.*): only a worker connects them. */}}
    {{- if include "coder.mcpWebsearch" . }}
    - secretKey: SEARCH_MCP_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ .Values.externalSecrets.properties.searchMcpToken }}
    {{- end }}
    {{- if include "coder.mcpContext7" . }}
    - secretKey: CONTEXT7_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ .Values.externalSecrets.properties.context7ApiKey }}
    {{- end }}
    {{- end }}
    - secretKey: A2A_BEARER_TOKENS
      remoteRef:
        key: {{ .Values.externalSecrets.key }}
        property: {{ .Values.externalSecrets.properties.a2aBearerTokens }}
{{- end }}
