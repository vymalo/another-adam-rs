{{- $split := eq .Values.topology "split" -}}
{{- $githubApp := include "coder.githubApp" . -}}
{{- /* The signing key is for the pod that serves A2A: the combined one, not the split worker. */ -}}
{{- $cardSigning := and (not $split) (include "coder.a2aCardSigning" .) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coder.fullname" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "coder.fullname" . }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "coder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coder.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (include "coder.extraMcp" .) (include "coder.runPods" .) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "coder.extraMcp" . }}
        {{- /* A changed servers file is a deploy: the file is read at startup only. */}}
        checksum/extra-mcp: {{ include (print $.Template.BasePath "/extra-mcp-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "coder.runPods" . }}
        {{- /* The same for the run pod template. */}}
        checksum/run-pod: {{ include (print $.Template.BasePath "/run-pods-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "coder.runPods" . }}
      {{- /*
        Run pods: the ServiceAccount that may make them. The pod does not automount its token: that would put it in every
        container, the git sandbox's included. It is a projected volume (kube-api-access, below) mounted in the coder
        container alone, at the path the in-cluster client reads.
      */}}
      serviceAccountName: {{ include "coder.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or (include "coder.runPods" .) (include "coder.githubMcp" .) }}
      initContainers:
        {{- if include "coder.runPods" . }}
        {{- /*
          The git sandbox (ADR 0041, open decision 6): a native sidecar of the coder's own image in which the coder's
          local git runs, because git runs what a repository's configuration names (a filter, an fsmonitor) and some
          repositories are the run's own. What makes it a sandbox is what it does NOT have: no Secret volume, no
          envFrom, no secret variable, no service-account token (the pod automounts none; the coder container alone has
          the projected volume), none of the coder's other volumes, and a PID namespace of its own (the pod does not
          set shareProcessNamespace), so it cannot read the coder's /proc. It has the work volume at the same path as
          the coder (the commands carry paths), runs as the same user (one writes the files the other reads), a
          read-only root file system and a /tmp of its own. The coder talks to it over the socket in an emptyDir.
          render-check.sh asserts each of these, and the run-pods job shows them on a cluster. It starts before the
          coder (a startup probe asks it for `git --version`) and stops after it, so the steps the coder finishes on
          SIGTERM still find it.
        */}}
        - name: git-sandbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["tini", "--", "adam-git-sandbox"]
          env:
            - name: GIT_SANDBOX_LISTEN
              value: {{ include "coder.gitSandboxSocket" . | quote }}
            - name: GIT_SANDBOX_ROOT
              value: /work
            - name: GIT_SANDBOX_MAX_COMMANDS
              value: {{ int64 .Values.runPods.gitSandbox.maxCommands | quote }}
          {{- /* The server has no health endpoint: the probe is a real command through the relay (adam-git cd'd into the root, which is a directory it accepts), and it is the server that answers. */}}
          startupProbe:
            exec:
              command: ["sh", "-c", {{ printf "cd /work && exec env GIT_SANDBOX_SOCKET=%s adam-git --version" (include "coder.gitSandboxSocket" .) | quote }}]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", {{ printf "cd /work && exec env GIT_SANDBOX_SOCKET=%s adam-git --version" (include "coder.gitSandboxSocket" .) | quote }}]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.runPods.gitSandbox.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: git-sandbox
              mountPath: {{ include "coder.gitSandboxDir" . }}
            - name: git-sandbox-tmp
              mountPath: /tmp
        {{- end }}
        {{- if include "coder.githubMcp" . }}
        {{- /*
          A native sidecar (an init container with restartPolicy Always: it starts before the coder, is probed
          before the coder starts, restarts on its own and stops after it). The official GitHub MCP server in http
          mode reads the token of each request from its Authorization header and holds none: no Secret, no
          key, no GITHUB_TOKEN. Loopback only. --read-only and the four toolsets are what the coder's tools
          allow-list assumes. ADR 0017, D4.
        */}}
        - name: github-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["tini", "--", "github-mcp-server"]
          args:
            - http
            - --read-only
            - --toolsets
            - context,repos,issues,pull_requests
            - --listen-host
            - 127.0.0.1
            - --port
            - {{ int64 .Values.githubMcp.port | quote }}
          {{- with .Values.githubMcp.host }}
          env:
            {{- /* The GitHub host of the server (GitHub Enterprise); empty is github.com. It has to be the first of config.allowedRepoHosts. */}}
            - name: GITHUB_HOST
              value: {{ . | quote }}
          {{- end }}
          {{- /* An exec probe, not tcpSocket: the kubelet's TCP probe connects to the pod IP, and the server listens on loopback only. */}}
          startupProbe:
            exec:
              command: ["bash", "-c", {{ printf "exec 3<>/dev/tcp/127.0.0.1/%d" (int64 .Values.githubMcp.port) | quote }}]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.githubMcp.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: coder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            {{- if include "coder.runsWorkers" . }}
            - name: WORKSPACE_ROOT
              value: /work
            {{- with include "coder.placement" . }}
            - name: WORKSPACE_PLACEMENT
              value: {{ . | quote }}
            {{- end }}
            {{- if or (include "coder.pinsRuns" .) (include "coder.runPods" .) }}
            {{- /* A pinned run stays with the worker of that name: the pod name is stable per StatefulSet ordinal. Run pods are annotated with it, and a worker sweeps only its own. */}}
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- end }}
            {{- /* topology=split: this StatefulSet is the worker; the front is its own Deployment. */}}
            {{- with (ternary "worker" .Values.config.role $split) }}
            - name: ROLE
              value: {{ . | quote }}
            {{- end }}
            {{- if not $split }}
            - name: PUBLIC_URL
              value: {{ include "coder.publicUrl" . | quote }}
            {{- end }}
            {{- with include "coder.maxAccessTier" . }}
            {{- /* accessTiers.max: the highest access tier a person may pick, read by every role. Nothing is rendered for the default (auto). */}}
            - name: MAX_ACCESS_TIER
              value: {{ . | quote }}
            {{- end }}
            {{- if include "coder.runsWorkers" . }}
            - name: MODEL_BASE_URL
              {{- if include "coder.modelBaseUrlFromSecret" . }}
              {{- /* config.modelBaseUrlFromSecret: the gateway's URL is in AWS, never in values or git. */}}
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: MODEL_BASE_URL
              {{- else }}
              value: {{ .Values.config.modelBaseUrl | quote }}
              {{- end }}
            - name: MODEL
              value: {{ .Values.config.model | quote }}
            {{- with include "coder.modelExtraBody" . }}
            {{- /* config.modelExtraBody: a JSON object merged into every model request (not a secret). */}}
            - name: MODEL_EXTRA_BODY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.modelEchoReasoning }}
            - name: MODEL_ECHO_REASONING
              value: {{ . | quote }}
            {{- end }}
            {{- with include "coder.modelContextWindow" . }}
            - name: MODEL_CONTEXT_WINDOW
              value: {{ . | quote }}
            {{- end }}
            - name: OPENCODE_MODEL
              value: {{ .Values.config.opencodeModel | quote }}
            - name: WORKERS
              value: {{ .Values.config.workers | quote }}
            - name: MAX_CHECK_CYCLES
              value: {{ .Values.config.maxCheckCycles | quote }}
            - name: CHECK_TIMEOUT_SECS
              value: {{ .Values.config.checkTimeoutSecs | quote }}
            - name: WORKSPACE_SWEEP_SECS
              value: {{ .Values.config.workspaceSweepSecs | quote }}
            {{- /* Kept for one release: a vendored agent folder written before the GitHub MCP server became a sidecar (ADR 0017, D4) still starts it as a child process. The shipped mcp.json no longer does. The image sets nothing; a control plane connects no MCP server. */}}
            - name: MCP_ALLOW_STDIO
              value: "true"
            {{- if include "coder.extraMcp" . }}
            {{- /* The extra MCP servers (mcp.*): merged over the agent's own mcp.json at startup. */}}
            - name: ADAM_EXTRA_MCP_FILE
              value: {{ include "coder.extraMcpFile" . | quote }}
            {{- end }}
            {{- if include "coder.mcpInsecure" . }}
            {{- /* mcp.websearch.allowInsecure: plain http to another machine, for EVERY server of the agent and for the thread-tools endpoints a sender announces. Never automatic. */}}
            - name: MCP_ALLOW_INSECURE
              value: "true"
            {{- end }}
            {{- if include "coder.githubMcp" . }}
            {{- /* The sidecar below, on loopback: the coder gives each call to it the credentials of that call. The shipped mcp.json names port 8082. */}}
            - name: GITHUB_MCP_URL
              value: {{ printf "http://127.0.0.1:%d" (int64 .Values.githubMcp.port) | quote }}
            {{- end }}
            - name: ALLOWED_REPO_HOSTS
              value: {{ join "," .Values.config.allowedRepoHosts | quote }}
            - name: GITHUB_API_URL
              value: {{ .Values.config.githubApiUrl | quote }}
            {{- with .Values.github.createRepoOwners }}
            {{- /* Off (no variable) unless owners are listed: the coder may create a repository for these, after the person agrees. */}}
            - name: CREATE_REPO_OWNERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $githubApp }}
            {{- /* github.auth=app: no GITHUB_TOKEN; the key is a file from the Secret mounted below. */}}
            - name: GITHUB_APP_ID
              value: {{ include "coder.githubAppId" . | quote }}
            {{- if include "coder.githubAppPinned" . }}
            {{- /* A pin: this installation serves every repository. */}}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ include "coder.githubAppInstallationId" . | quote }}
            {{- else }}
            {{- /* No pin: the installation of each repository's owner is found, for these accounts only. */}}
            - name: GITHUB_APP_OWNERS
              value: {{ include "coder.githubAppOwners" . | quote }}
            {{- end }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /var/run/secrets/github-app/private-key.pem
            {{- end }}
            {{- if include "coder.allowCommandsNextToSecrets" . }}
            {{- /* runPods.allowCommandsNextToSecrets: the deployment accepts that a command can read the App's key file. Only ever rendered true. */}}
            - name: ALLOW_COMMANDS_NEXT_TO_SECRETS
              value: "true"
            {{- end }}
            - name: PR_DRAFT
              value: {{ .Values.config.prDraft | quote }}
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.config.gitAuthorName | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.config.gitAuthorEmail | quote }}
            {{- if include "coder.runPods" . }}
            {{- /* runPods.enabled (ADR 0019): a run's processes run in a pod of their own, made from the template below. */}}
            - name: RUN_ENVIRONMENT
              value: kubernetes
            - name: RUN_POD_TEMPLATE_FILE
              value: {{ include "coder.runPodTemplateFile" . | quote }}
            - name: RUN_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUN_POD_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: RUN_POD_CONTAINER
              value: {{ .Values.runPods.container | quote }}
            - name: RUN_POD_READY_TIMEOUT_SECS
              value: {{ .Values.runPods.readyTimeoutSecs | quote }}
            - name: RUN_POD_IDLE_SECS
              value: {{ .Values.runPods.idleSecs | quote }}
            - name: RUN_POD_WAIT_SECS
              value: {{ .Values.runPods.waitSecs | quote }}
            {{- /* The git sandbox container below: the coder's git commands that carry no credential run there, and are never run here instead. */}}
            - name: GIT_SANDBOX_SOCKET
              value: {{ include "coder.gitSandboxSocket" . | quote }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.config.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "coder.databaseUrlEnv" . | nindent 12 }}
            {{- if .Values.externalSecrets.enabled }}
            {{- if include "coder.runsWorkers" . }}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: MODEL_API_KEY
            {{- if not $githubApp }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: GITHUB_TOKEN
            {{- end }}
            {{- if include "coder.mcpWebsearch" . }}
            - name: SEARCH_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: SEARCH_MCP_TOKEN
            {{- end }}
            {{- if include "coder.mcpContext7" . }}
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: CONTEXT7_API_KEY
            {{- end }}
            {{- end }}
            {{- if not $split }}
            - name: A2A_BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "coder.secretName" . }}
                  key: A2A_BEARER_TOKENS
            {{- end }}
            {{- end }}
            {{- if not $split }}
            {{- /* a2a.*: the optional A2A features, off by default; the split worker serves no A2A. */}}
            {{- with (include "coder.a2aEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- if and (include "coder.runPods" .) .Values.runPods.coderResources }}
            {{- /* No build runs here while run pods are on: see runPods.coderResources. */}}
            {{- toYaml .Values.runPods.coderResources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
            {{- if include "coder.cache" . }}
            {{- /* cache.*: the package cache (ADR 0040); the image's npm, pnpm and cargo caches are under it. */}}
            - name: cache
              mountPath: {{ include "coder.cacheDir" . }}
            {{- end }}
            {{- if $githubApp }}
            - name: github-app
              mountPath: /var/run/secrets/github-app
              readOnly: true
            {{- end }}
            {{- if include "coder.extraMcp" . }}
            - name: extra-mcp
              mountPath: {{ include "coder.extraMcpDir" . }}
              readOnly: true
            {{- end }}
            {{- if include "coder.runPods" . }}
            - name: run-pod
              mountPath: {{ include "coder.runPodTemplateDir" . }}
              readOnly: true
            {{- /* The coder container alone has the service-account token and the socket of the git sandbox. */}}
            - name: kube-api-access
              mountPath: {{ include "coder.serviceAccountDir" . }}
              readOnly: true
            - name: git-sandbox
              mountPath: {{ include "coder.gitSandboxDir" . }}
            {{- end }}
            {{- if $cardSigning }}
            - name: card-signing
              mountPath: {{ include "coder.a2aCardSigningDir" . }}
              readOnly: true
            {{- end }}
      {{- if or (include "coder.sharedWork" .) (include "coder.cache" .) $githubApp (include "coder.extraMcp" .) (include "coder.runPods" .) $cardSigning }}
      volumes:
        {{- if include "coder.sharedWork" . }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ include "coder.workClaim" . }}
        {{- end }}
        {{- if include "coder.cache" . }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "coder.cacheClaim" . }}
        {{- end }}
        {{- if $githubApp }}
        - name: github-app
          secret:
            secretName: {{ .Values.github.app.privateKeySecret }}
            # Group-readable by the runtime user (fsGroup); the key is for the coder alone.
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        {{- end }}
        {{- if include "coder.extraMcp" . }}
        - name: extra-mcp
          configMap:
            name: {{ include "coder.extraMcpConfigMapName" . }}
            # Readable by the runtime user whatever fsGroup does: a mcp.json of ${VAR} references, no secret.
            defaultMode: 0444
        {{- end }}
        {{- if include "coder.runPods" . }}
        - name: run-pod
          configMap:
            name: {{ include "coder.runPodTemplateConfigMapName" . }}
            # The pod template: no secret in it.
            defaultMode: 0444
        {{- /* What the kubelet would automount, as an explicit volume that only the coder container mounts (automountServiceAccountToken is false above). */}}
        - name: kube-api-access
          projected:
            # 420 is 0644, as the kubelet's own volume has it (decimal, so that no YAML reader takes it for another number).
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        # The socket of the git sandbox: the coder container and the git-sandbox container share this and the work volume, and nothing else.
        - name: git-sandbox
          emptyDir: {}
        # The sandbox's /tmp, in memory and sized: a program that fills it gets ENOSPC, where a disk-backed emptyDir would get the whole pod evicted.
        - name: git-sandbox-tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.runPods.gitSandbox.tmpSize | quote }}
        {{- end }}
        {{- if $cardSigning }}
        - name: card-signing
          secret:
            secretName: {{ .Values.a2a.cardSigning.secretName }}
            # Group-readable by the runtime user (fsGroup); the key is for the coder alone.
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if not (include "coder.sharedWork" .) }}
  volumeClaimTemplates:
    - metadata:
        name: work
        labels:
          {{- include "coder.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
