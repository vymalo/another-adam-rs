{{- if include "coder.turnKeyGenerated" . }}
{{- /*
  What the generating Job may do: write Secrets in this namespace, and read or update the one turn-key Secret. Its own
  ServiceAccount, because nothing else in the chart may write a Secret — the coder's Role holds pods only
  (run-pods-rbac.yaml) and the namespace's `default` account is granted nothing.

  `create` cannot be narrowed to a name: Kubernetes RBAC applies `resourceNames` to every verb except `create` and
  `deletecollection` (*verified 2026-11-27*,
  <https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-resources>). So the account can create a
  Secret of any name in this namespace; it exists for one Job, and the release deletes it.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coder.turnKeyServiceAccountName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coder.turnKeyServiceAccountName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "coder.turnKeySecretName" . | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coder.turnKeyServiceAccountName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "coder.turnKeyServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "coder.turnKeyServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
