{{- if and (include "coder.runPods" .) (eq (toString .Values.runPods.admissionPolicy.enabled) "true") }}
{{- $claim := include "coder.runPodWorkClaim" . -}}
{{- /* The work claim, and the claims the deployment admits for its own cache (values cache.allowedClaims, ADR 0040
       as amended 2026-11-26). Nothing else: no shared writable cache is provided by the chart. */ -}}
{{- $claims := list $claim -}}
{{- range .Values.cache.allowedClaims -}}{{- $claims = append $claims (toString .) -}}{{- end -}}
{{- $class := include "coder.runPodsPriorityClass" . -}}
{{- /* The pull secrets the template itself carries (values imagePullSecrets): the only ones a run pod may name. */ -}}
{{- $pull := list -}}
{{- range .Values.imagePullSecrets -}}{{- $pull = append $pull (toString .name) -}}{{- end -}}
# runPods.enabled: the guard that lets the coder make pods without being able to read the namespace's other Secrets,
# mount the host, or run anything privileged. It applies to pods CREATED BY the coder's ServiceAccount (the match
# condition) in this namespace (the binding), and refuses any that is not the intended run pod. Without it the RBAC
# alone would let the coder create any pod in its namespace. A run pod references no Secret a container can read: no
# Secret volume, no secretKeyRef, no envFrom (ADR 0038, ADR 0041); the pull secrets are the chart's own (values imagePullSecrets),
# and no other.
# Needs Kubernetes 1.30 or later (admissionregistration.k8s.io/v1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "coder.runPodsPolicyName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: made-by-the-coder
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace (include "coder.serviceAccountName" .) | quote }}
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "has(object.metadata.labels) && 'adam.vymalo.com/run' in object.metadata.labels && 'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == 'adam-coder'"
      message: "a run pod carries the labels app.kubernetes.io/managed-by=adam-coder and adam.vymalo.com/run"
    - expression: {{ printf "has(object.spec.priorityClassName) && object.spec.priorityClassName == '%s'" $class | quote }}
      message: {{ printf "a run pod has the priority class %s, which the quota is scoped to" $class | quote }}
    {{- $exact := include "coder.runPodAllowedImages" . | trim | splitList "\n" | join "', '" | printf "'%s'" -}}
    {{- $prefixes := include "coder.runPodRepositoryImages" . -}}
    {{- if $prefixes }}
    {{- /* ADR 0052: the run container alone may use an image that starts with an allowed prefix; the init containers keep the exact list. */ -}}
    {{- $starts := list -}}
    {{- range splitList "," $prefixes -}}
    {{- $starts = append $starts (printf "c.image.startsWith('%s')" .) -}}
    {{- end }}
    - expression: {{ printf "variables.containers.all(c, c.image in [%s] || (c.name == '%s' && (%s)))" $exact $.Values.runPods.container (join " || " $starts) | quote }}
      message: {{ printf "a run pod uses only the images the chart allows, or (the run container alone) an image under one of the repository prefixes %s" $prefixes | quote }}
    {{- else }}
    - expression: {{ printf "variables.containers.all(c, c.image in [%s])" $exact | quote }}
      message: "a run pod uses only the images the chart allows"
    {{- end }}
    {{- if gt (len $claims) 1 }}
    - expression: {{ printf "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ['%s']))" (join "', '" $claims) | quote }}
      message: {{ printf "a run pod mounts only emptyDir volumes and the claims %s: no hostPath, no Secret, no other claim" (join " and " $claims) | quote }}
    {{- else }}
    - expression: {{ printf "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == '%s'))" $claim | quote }}
      message: {{ printf "a run pod mounts only emptyDir volumes and the claim %s: no hostPath, no Secret, no other claim" $claim | quote }}
    {{- end }}
    - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) && (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))"
      message: "a run pod references no Secret a container can read: no Secret volume, no secretKeyRef, no envFrom"
    {{- if $pull }}
    - expression: {{ printf "!has(object.spec.imagePullSecrets) || object.spec.imagePullSecrets.all(s, s.name in ['%s'])" (join "', '" $pull) | quote }}
      message: {{ printf "a run pod names no pull secret but the chart's own: %s" (join " and " $pull) | quote }}
    {{- else }}
    - expression: "!has(object.spec.imagePullSecrets) || size(object.spec.imagePullSecrets) == 0"
      message: "a run pod names no pull secret: the chart sets none (values imagePullSecrets is empty)"
    {{- end }}
    - expression: "variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && (!has(c.securityContext.privileged) || c.securityContext.privileged == false))"
      message: "a run pod is not privileged and sets allowPrivilegeEscalation: false on every container"
    - expression: "variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.runAsUser) ? c.securityContext.runAsUser : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) ? object.spec.securityContext.runAsUser : 0)) != 0 && (has(c.securityContext) && has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) ? object.spec.securityContext.runAsNonRoot : false)))"
      message: "a run pod does not run as root: a runAsUser other than 0 and runAsNonRoot: true on every container"
    - expression: "(!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "a run pod uses its own network, PID and IPC namespaces"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "a run pod sets automountServiceAccountToken: false: it holds no credential for the cluster"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "coder.runPodsPolicyName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  policyName: {{ include "coder.runPodsPolicyName" . }}
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
