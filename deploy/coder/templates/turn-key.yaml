{{- if include "coder.turnKeyGenerated" . }}
{{- /*
  The turn key, generated in the cluster (convention `cluster-generated-secrets`): a one-shot Job writes a PKCS#8 PEM
  Ed25519 private key into a Secret the release owns, and a PushSecret copies it to the AWS secret the chart names, so
  AWS is the durable copy. The Job is idempotent: a Secret that already holds the key is left alone.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "coder.turnKeyJobResourceName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "coder.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      # The Job's own account, and the only pod in this chart that mounts a token on purpose: it writes one Secret
      # through the API server (turn-key-rbac.yaml).
      serviceAccountName: {{ include "coder.turnKeyServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: key
          image: {{ .Values.turnSigning.generate.image | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
{{ include "coder.turnKeyScript" . | indent 14 }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "coder.turnKeyJobName" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  updatePolicy: IfNotExists
  deletionPolicy: Retain
  secretStoreRefs:
    - name: {{ .Values.externalSecrets.secretStoreRef.name }}
      kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  selector:
    secret:
      name: {{ include "coder.turnKeySecretName" . }}
  data:
    - match:
        secretKey: private-key.pem
        remoteRef:
          remoteKey: {{ .Values.externalSecrets.key }}
          property: {{ .Values.turnSigning.generate.property }}
{{- end }}
