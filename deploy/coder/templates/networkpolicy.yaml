{{- if .Values.networkPolicy.enabled }}
# Ingress only from the orchestrator's namespace. Egress is not restricted: the
# agent needs git hosts, the model gateway and package registries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coder.fullname" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "coder.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowedNamespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
