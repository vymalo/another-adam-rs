{{- if .Values.networkPolicy.enabled }}
# Ingress only from the orchestrator's namespace. Egress is not restricted: the
# agent needs git hosts, the model gateway and package registries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coder.fullname" . }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- if eq .Values.topology "split" }}
    {{- /* the front and the worker pods differ in `name`; both are covered */}}
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "coder.name" . }}
          - {{ printf "%s-front" (include "coder.name" .) | trunc 63 | trimSuffix "-" }}
    {{- else }}
    matchLabels:
      {{- include "coder.selectorLabels" . | nindent 6 }}
    {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowedNamespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
