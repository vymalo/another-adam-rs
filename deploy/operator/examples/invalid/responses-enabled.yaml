# Refused: interfaces.responses.enabled is true; v0 serves A2A only.
# expect: v0 serves A2A only: this interface cannot be enabled
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-responses
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
    responses:
      enabled: true
  scaling:
    topology: combined
    workers: 1
  store:
    postgres:
      secretRef:
        name: db
        key: uri
