{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets -}}
# The registry's bearer token lives in AWS Secrets Manager (`{{ $es.key }}`, one JSON property per value) and is copied into
# the Secret below by External Secrets. It is not in this chart, its values or its render.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "adam-operator.registrySecretName" . }}
  labels:
    {{- include "adam-operator.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "adam-operator.registrySecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ $es.key }}
        property: {{ $es.properties.registryToken }}
{{- end }}
