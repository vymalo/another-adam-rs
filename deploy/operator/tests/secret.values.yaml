# A render the netcup values do not make: the token from an existing Secret, another namespace than the release's, no
# CloudNativePG, a scraper for /metrics, the API server pinned to addresses, and the settings that have a default.
watchNamespace: agents
storeCnpg: false
registry:
  tokenSecret:
    name: adam-operator-registry-token
    key: bearer
  publicUrl: https://registry.example.com/registry/v1/agents
networkPolicy:
  registry:
    allowFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: another-agentic-system
        podSelector:
          matchLabels:
            app.kubernetes.io/component: orchestrator
  metrics:
    allowFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  apiServer:
    ports: [6443]
    cidrs: [10.0.0.10/32]
logLevel: debug
tuning:
  concurrency: 8
  resyncSecs: 600
  resyncPendingSecs: 10
imagePullSecrets:
  - name: ghcr-pull
