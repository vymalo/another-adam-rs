---
# Source: adam-operator/templates/networkpolicy.yaml
# Ingress is closed except what is listed: the registry to the peers of networkPolicy.registry.allowFrom, /metrics to those of
# networkPolicy.metrics.allowFrom. Probes come from the node, which a NetworkPolicy never blocks. Egress goes to the API server
# and nothing else: the operator reads and writes the API and calls no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adam-operator
  labels:
    app.kubernetes.io/name: adam-operator
    app.kubernetes.io/instance: adam-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: adam-rs
    helm.sh/chart: adam-operator-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adam-operator
      app.kubernetes.io/instance: adam-operator
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# Source: adam-operator/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adam-operator
  labels:
    app.kubernetes.io/name: adam-operator
    app.kubernetes.io/instance: adam-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: adam-rs
    helm.sh/chart: adam-operator-0.1.0
---
# Source: adam-operator/templates/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adam-operator
  namespace: another-agentic-system
  labels:
    app.kubernetes.io/name: adam-operator
    app.kubernetes.io/instance: adam-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: adam-rs
    helm.sh/chart: adam-operator-0.1.0
rules:
  # adam-operator-controller: the two kinds (patch also writes metadata.finalizers), their status, and Events.
  - apiGroups: [agents.vymalo.com]
    resources: [agentservices, agentconfigs]
    verbs: [get, list, watch, patch]
  - apiGroups: [agents.vymalo.com]
    resources: [agentservices/status, agentconfigs/status]
    verbs: [patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # adam-operator-runtime-kubernetes: the objects an agent is made of.
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, patch, create, delete]
  - apiGroups: [""]
    resources: [services, configmaps, persistentvolumeclaims]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  # adam-operator-store-cnpg: the Cluster of a service that asks for one. None on databases, poolers or clusters/status.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, patch, create, delete]
---
