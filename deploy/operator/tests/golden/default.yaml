---
# Source: adam-operator/templates/deployment.yaml
# One replica and no leader election: a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adam-operator
  labels:
    app.kubernetes.io/name: adam-operator
    app.kubernetes.io/instance: adam-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: adam-rs
    helm.sh/chart: adam-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adam-operator
      app.kubernetes.io/instance: adam-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adam-operator
        app.kubernetes.io/instance: adam-operator
    spec:
      serviceAccountName: adam-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-adam-rs/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            - name: WATCH_NAMESPACE
              value: "another-agentic-system"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
