name: bench dry run

# The benchmark harness's dry run (bench/dry-run.sh): both agents on three self-test tasks and a scripted model, on the
# stack of bench/compose.yaml with the arms as host containers of the task images. It needs the host's Docker and pulls
# the coder image (about 9.7 GB), so it is started by hand; the ordinary tests of the harness are bench.yml's. No model,
# no key, no money.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'all, grades, budget or resume'
        default: all
        required: false

permissions:
  contents: read

concurrency:
  group: bench-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The whole history: the agent folder is read from the coder image's revision (bench/pins.json).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests that need no container runtime
        run: node --test "bench/test/*.test.mjs"
      - name: Dry run
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          BENCH_TEST_DOCKER=1 BENCH_TEST_REQUIRE_DOCKER=1 sh bench/dry-run.sh --phase "${PHASE:-all}"
