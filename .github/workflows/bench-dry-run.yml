name: bench dry run

# The benchmark harness's dry run (bench/dry-run.sh): both agents on three self-test tasks and a scripted model, on the
# stack of bench/compose.yaml. It needs a container service and pulls the coder image (about 3 GB), so it is started by
# hand; the ordinary tests of the harness are bench.yml's. No model, no key, no money.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'all, grades, budget or resume'
        default: all
        required: false

permissions:
  contents: read

concurrency:
  group: bench-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The whole history: the agent folder is read from the coder image's revision (bench/pins.json).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow user namespaces for the rootless Podman service
        run: |
          # Ubuntu 24.04 runners restrict them under AppArmor; where the key does not exist there is nothing to set.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Tests that need no container service
        run: node --test "bench/test/*.test.mjs"
      - name: Dry run
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          BENCH_TEST_DOCKER=1 BENCH_TEST_REQUIRE_DOCKER=1 sh bench/dry-run.sh --phase "${PHASE:-all}"
