name: release

# A release, on the tag `vX.Y.Z` that release-please.yml cuts when its pull request merges (ADR 0084):
#
#   ghcr.io/vymalo/another-adam-rs/coder:X.Y.Z and :X.Y     the image, with buildx provenance (mode=max) and
#                                                          an SBOM in its index, signed with cosign, keyless
#   oci://ghcr.io/vymalo/another-adam-rs/charts/coder      the chart deploy/coder at version X.Y.Z, whose
#                                                          image.tag is X.Y.Z, signed the same way
#
# And, from the same tag, the `adam-agent` binary for Homebrew (ADR 0084, amended 2026-11-27, ANR-1203):
#
#   adam-agent_X.Y.Z_<os>_<arch>.tar.gz                  linux and darwin, amd64 and arm64, on the GitHub release
#   SHA256SUMS, SHA256SUMS.sigstore.json                 their checksums, signed with cosign, keyless (same identity)
#   vymalo/homebrew-tap Formula/adam-agent.rb            a pull request the release App opens, monotonic in the version
#
# These are jobs of this workflow, not a workflow of their own on `release: published`: both events follow the
# same App-made release, a second workflow would start beside the gate and not behind it, and the cosign identity
# below would then name another file. They need `gate`, so a tag that the gate refuses ships no binary either.
# `adam-agent-preflight` additionally requires the GitHub release to exist, published, authored by the release
# App's bot, so a tag pushed by hand never reaches the tap.
#
# Never `latest`, and nothing here moves on main: coder.yml keeps pushing `sha-<7>` and bumping
# values.yaml for development. Production pins `X.Y.Z@sha256:<digest>`.
#
# The image is built again here, from the tag's commit, with the build arguments coder.yml uses. It is
# not a retag of coder.yml's `sha-<7>`: that image is loaded into the runner's Docker and pushed with
# `docker push`, which carries no provenance or SBOM, and those exist only when buildx builds and pushes
# the image itself. So the release (1) waits for coder.yml's image job to pass on this very commit (the
# smoke tests and every compose scenario), (2) builds with the cache main wrote and pushes the result by
# digest only, with no tag, (3) runs the container smoke tests on that digest, (4) signs it, and only
# then (5) names it X.Y.Z and X.Y. A tag therefore only ever points at a signed, smoke-tested digest.
# The release digest is not the digest of `sha-<7>`.
#
# `id-token: write` (what Fulcio certifies, and a credential that can be exchanged for cloud roles) is
# granted to the two jobs that sign, `publish` (the image and the chart) and `adam-agent-publish` (SHA256SUMS);
# `packages: write` to the two that write to GHCR. A
# job-level `permissions:` block replaces the workflow-level one, so each restates what it needs.
#
# Verify a release (the identity is this file at the tag; renaming the file breaks every verify):
#   cosign verify ghcr.io/vymalo/another-adam-rs/coder:X.Y.Z \
#     --certificate-identity "https://github.com/vymalo/another-adam-rs/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# and the binaries, with the same identity:
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity "https://github.com/vymalo/another-adam-rs/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com && sha256sum --check --ignore-missing SHA256SUMS

on:
  push:
    tags: ["v*"]

# Two runs for one tag must not race for its names. Not cancel-in-progress: a cancelled run can leave a
# signed digest without its tags, which a re-run finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vymalo/another-adam-rs/coder
  CHART: ghcr.io/vymalo/another-adam-rs/charts/coder
  CHART_REPO: oci://ghcr.io/vymalo/another-adam-rs/charts
  HELM_VERSION: v4.3.2

jobs:
  # The tag is a release of main whose every marked version is the tag's, and coder.yml's image job passed
  # on its commit. Nothing is built before that holds.
  gate:
    name: the tag, its versions and coder.yml on its commit
    runs-on: ubuntu-latest
    # coder.yml's image job can take 90 minutes; it starts when the release pull request merges, at the
    # same moment as release-please, so this job usually waits for it.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is vX.Y.Z on main, and every marked version says X.Y.Z
        id: tag
        run: |
          set -eu
          tag=${GITHUB_REF#refs/tags/}
          sh tools/release/check-versions.sh "$tag"
          version=${tag#v}
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag points at $GITHUB_SHA, which is not on main; a release is cut from main by release-please"
            exit 1
          fi
          if grep -Eq '^ARG WORKSPACE_TAG=.*PENDING' docker/coder/Dockerfile; then
            echo "::error file=docker/coder/Dockerfile::WORKSPACE_TAG is a placeholder; there is no image to release"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - name: Wait for coder.yml's image job to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: build, smoke-test and push the image
        run: |
          set -eu
          deadline=$(( $(date +%s) + 140 * 60 ))
          runs="$RUNNER_TEMP/coder-runs"
          while :; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/coder.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion // "none")"' > "$runs"
            passed=
            pending=
            while read -r id status _; do
              # The image job decides, not the run: a later job (the bump) may be cancelled or fail.
              job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq ".jobs[] | select(.name == \"$JOB\") | .conclusion // \"none\"")
              if [ "$job" = success ]; then
                passed=$id
              elif [ "$status" != completed ]; then
                pending=1
              fi
            done < "$runs"
            if [ -n "$passed" ]; then
              echo "coder.yml run $passed passed its image job on $GITHUB_SHA"
              exit 0
            fi
            if [ -s "$runs" ] && [ -z "$pending" ]; then
              echo "::error::no coder.yml run on $GITHUB_SHA passed its image job. Re-run it, or run coder.yml by hand on this tag (workflow_dispatch), then re-run this workflow."
              exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::coder.yml has not finished on $GITHUB_SHA after 140 minutes"
              exit 1
            fi
            sleep 60
          done

  # Build with provenance and an SBOM, push by digest only, and run the container smoke tests on that digest.
  build:
    name: build and smoke-test the release image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    services:
      # The coder's database for the container smoke test: PostgreSQL 18.7, the store's floor (ADR 0082,
      # decision 11), by tag and digest (the OCI index of docker.io/library/postgres:18.7, *verified
      # 2026-11-27* from the registry), the same image as coder.yml, ci.yml and compose.yaml
      # (tools/release/check-postgres-pin.sh holds them equal). v0.6.0 failed here on `postgres:17`.
      postgres:
        image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build arguments coder.yml passes, so the binaries say the same revision (ADR 0028). The cache is
      # read from main's (coder.yml writes it) and not written: a tag's run adds nothing main lacks.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/coder/Dockerfile
          platforms: linux/amd64
          build-args: |
            ADAM_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Pull the pushed digest for the smoke tests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" coder:release
      - name: The six binaries are static and start in a foreign image
        run: sh docker/coder/test/static-smoke.sh coder:release
      - name: Container smoke test
        env:
          EXPECT_REVISION: ${{ github.sha }}
        run: sh docker/coder/test/container-smoke.sh coder:release
      - name: Container smoke test of adam-agent
        env:
          EXPECT_REVISION: ${{ github.sha }}
        run: sh docker/coder/test/agent-smoke.sh coder:release

  # Sign the image's digest, then name it X.Y.Z and X.Y; package the chart with image.tag X.Y.Z, push it and
  # sign it. The only job with an OIDC token.
  publish:
    name: sign, tag and publish the chart
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      MINOR: ${{ needs.gate.outputs.minor }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      # cosign and imagetools read the docker config; helm push reads its own (logged in below).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless: the certificate binds the digest to this workflow file at this tag, and the Rekor entry makes
      # it public. The index is signed, and with it the provenance and SBOM manifests it carries.
      - name: Sign the image
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest from the build job"; exit 1 ;; esac
          cosign sign --yes "$IMAGE@$DIGEST"

      # A published X.Y.Z is never moved: the same digest is a re-run (nothing to do), another digest stops
      # the release. X.Y follows the newest patch of its minor.
      - name: Name the signed digest X.Y.Z and X.Y
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          rc=0
          current=$(sh tools/release/registry-digest.sh "$IMAGE" "$VERSION") || rc=$?
          if [ "$rc" -eq 0 ] && [ "$current" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$VERSION is already published at $current; this run built $DIGEST. A released tag is never moved."
            exit 1
          elif [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::could not tell whether $IMAGE:$VERSION is published; not tagging past that"
            exit 1
          fi
          # A carbon copy of the index, so each tag names the very digest that was signed.
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" "$IMAGE@$DIGEST"
          for tag in "$VERSION" "$MINOR"; do
            got=$(sh tools/release/registry-digest.sh "$IMAGE" "$tag")
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag is $got, not the signed $DIGEST"
              exit 1
            fi
          done
          echo "$IMAGE:$VERSION@$DIGEST (also :$MINOR)" >> "$GITHUB_STEP_SUMMARY"

      # The chart of the tag's commit, with image.tag set to X.Y.Z in the copy that is packaged. values.yaml on
      # main keeps coder.yml's `sha-<7>`.
      - name: Package the chart with image.tag X.Y.Z
        run: |
          set -eu
          work="$RUNNER_TEMP/chart"
          mkdir -p "$work/src" "$work/out"
          cp -R deploy/coder "$work/src/coder"
          sh deploy/coder/bump-tag.sh "$work/src/coder/values.yaml" "$VERSION"
          helm lint "$work/src/coder"
          images=$(helm template coder "$work/src/coder" --namespace release-check \
            | grep -oE "${IMAGE}:[^\" ]+" | sort -u)
          if [ "$images" != "$IMAGE:$VERSION" ]; then
            echo "::error::the packaged chart renders '$images', want $IMAGE:$VERSION"
            exit 1
          fi
          helm package "$work/src/coder" --destination "$work/out"
          test -f "$work/out/coder-$VERSION.tgz"

      # `helm push` overwrites a published version silently, so ask first. Published and signed: someone already
      # released it, stop. Published and not signed: an earlier run died between push and sign, sign it. Not
      # published: push. Anything else: the registry did not answer, stop.
      - name: Push the chart, unless it is published
        id: chart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          rc=0
          digest=$(sh tools/release/registry-digest.sh "$CHART" "$VERSION") || rc=$?
          if [ "$rc" -eq 0 ]; then
            if cosign download signature "$CHART@$digest" > /dev/null 2>&1; then
              echo "::error::$CHART:$VERSION is already published and signed ($digest)"
              exit 1
            fi
            echo "$CHART:$VERSION is published ($digest) and not signed: signing it, not pushing"
          elif [ "$rc" -eq 3 ]; then
            printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
            helm push "$RUNNER_TEMP/chart/out/coder-$VERSION.tgz" "$CHART_REPO"
            digest=$(sh tools/release/registry-digest.sh "$CHART" "$VERSION")
          else
            echo "::error::could not tell whether $CHART:$VERSION is published; not pushing past that"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -eu
          case "$CHART_DIGEST" in sha256:*) ;; *) echo "::error::no chart digest"; exit 1 ;; esac
          cosign sign --yes "$CHART@$CHART_DIGEST"
          {
            echo "$CHART:$VERSION@$CHART_DIGEST"
            echo
            echo "helm install coder $CHART_REPO/coder --version $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------
  # adam-agent through Homebrew (ANR-1203). Nothing below touches the image or the chart: it needs `gate` and
  # nothing from `build` or `publish`, so a failed Homebrew job never unpublishes an image, and a failed image
  # build never keeps a binary from a release (re-run the failed jobs).
  # ---------------------------------------------------------------------------------------------------------

  # The tag has a published GitHub release that the release App made, and says which of its assets exist.
  # release-please creates the tag and the release in one call, but the push event can arrive first, so wait.
  # The App is identified by its own slug (`app-slug` of the token action), not by a variable: with nothing to
  # compare against, nothing is accepted.
  adam-agent-preflight:
    name: adam-agent, the release is the App's and published
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      # none: nothing of adam-agent is on the release, build and attach it. complete: the four archives and the
      # signed checksums are there already (a re-run): build nothing, attach nothing, test what is published.
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Mint the release App token (read only), for its slug
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: another-adam-rs
          permission-contents: read
      - name: Wait for the published release, check who made it and what it holds
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eu
          test -n "$APP_SLUG"
          tag=${GITHUB_REF#refs/tags/}
          version=${tag#v}
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$tag is not vX.Y.Z"; exit 1 ;;
          esac
          deadline=$(( $(date +%s) + 30 * 60 ))
          until info=$(gh release view "$tag" --json author,isDraft,isPrerelease --jq '"\(.author.login) \(.isDraft) \(.isPrerelease)"' 2>/dev/null); do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::no GitHub release for $tag after 30 minutes. A tag pushed by hand is not released through Homebrew."
              exit 1
            fi
            sleep 30
          done
          read -r author draft prerelease <<EOF_INFO
          $info
          EOF_INFO
          if [ "$draft" != false ] || [ "$prerelease" != false ]; then
            echo "::error::release $tag is a draft or a prerelease"
            exit 1
          fi
          if [ "$author" != "${APP_SLUG}[bot]" ]; then
            echo "::error::release $tag was made by $author, not by ${APP_SLUG}[bot]"
            exit 1
          fi
          # A published asset is never replaced (the formula in the tap names its checksum): all of it or none.
          have=0
          for name in "adam-agent_${version}_linux_amd64.tar.gz" "adam-agent_${version}_linux_arm64.tar.gz" \
                      "adam-agent_${version}_darwin_amd64.tar.gz" "adam-agent_${version}_darwin_arm64.tar.gz" \
                      SHA256SUMS SHA256SUMS.sigstore.json; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              have=$((have + 1))
            fi
          done
          case "$have" in
            0) assets=none ;;
            6) assets=complete ;;
            *) echo "::error::release $tag holds $have of the 6 adam-agent assets. A person must look: nothing published is overwritten."; exit 1 ;;
          esac
          echo "release $tag by $author, adam-agent assets: $assets"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"

  # One native build per target; nothing is cross-compiled. The Linux targets are musl, so the binary is static
  # and runs on any distribution (ADR 0053 decision 11, the coder image's six binaries are the same). The macOS
  # targets are built on GitHub-hosted macOS runners because there is no way to link for Apple targets from
  # Linux without Apple's SDK; the Intel one runs natively on `macos-26-intel`, so its binary is started, not
  # just built. The arm64 Linux target is a native build on `ubuntu-24.04-arm`.
  adam-agent-build:
    name: adam-agent ${{ matrix.os }} ${{ matrix.arch }}
    needs: [gate, adam-agent-preflight]
    if: needs.adam-agent-preflight.outputs.assets == 'none'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: darwin, arch: arm64, runner: macos-26, target: aarch64-apple-darwin }
          - { os: darwin, arch: amd64, runner: macos-26-intel, target: x86_64-apple-darwin }
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl C compiler (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file musl-tools
      - name: The Rust toolchain of the workspace
        run: |
          rustup toolchain install 1.98 --profile minimal --target "$TARGET"
          rustup default 1.98
          cargo --version
      # `musl-gcc` builds the C sources of aws-lc-sys, bundled SQLite and mimalloc, as in docker/coder/Dockerfile.
      # ADAM_BUILD_REVISION is what the binary's card and `--version` say after the `+`.
      - name: Build
        env:
          ADAM_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -eu
          if [ "${{ matrix.os }}" = linux ]; then
            export "CC_$(echo "$TARGET" | tr - _)=musl-gcc"
          fi
          cargo build --release --locked --target "$TARGET" -p adam-agent --bin adam-agent
      - name: The binary is static, and it starts and says its version
        run: |
          set -eu
          bin="target/$TARGET/release/adam-agent"
          if [ "${{ matrix.os }}" = linux ]; then
            file "$bin"
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          else
            otool -L "$bin"
            # Only the system's own libraries.
            if otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
              echo "::error::the binary links a library that is not part of macOS"
              exit 1
            fi
          fi
          "$bin" --version | tee version.txt
          grep -Fxq "adam-agent $VERSION" version.txt
          # No configuration is a configuration error (exit 78), not a crash.
          code=0
          env -i PATH="$PATH" "$bin" > /dev/null 2>&1 || code=$?
          test "$code" -eq 78
      - name: Archive adam-agent_${{ needs.gate.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
        env:
          # macOS tar would add AppleDouble `._` entries for extended attributes.
          COPYFILE_DISABLE: "1"
        run: |
          set -eu
          name="adam-agent_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          mkdir out stage
          cp "target/$TARGET/release/adam-agent" LICENSE-MIT LICENSE-APACHE stage/
          tar -czf "out/$name" -C stage adam-agent LICENSE-MIT LICENSE-APACHE
          tar -tzf "out/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adam-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error

  # Checksum the four archives, sign the checksums, and attach everything to the release release-please made.
  # The only other job with an OIDC token (the signing identity is this workflow at this tag, as for the image).
  adam-agent-publish:
    name: adam-agent, sign and attach to the release
    needs: [gate, adam-agent-preflight, adam-agent-build]
    if: needs.adam-agent-preflight.outputs.assets == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: adam-agent-*
          merge-multiple: true
          path: release-assets
      - name: Checksums, signature, upload
        run: |
          set -eu
          tag="v$VERSION"
          cd release-assets
          test "$(find . -type f | wc -l)" -eq 4
          for os_arch in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -f "adam-agent_${VERSION}_${os_arch}.tar.gz"
          done
          sha256sum adam-agent_*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # Read it back with the identity the page for people gives.
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${tag}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh release view "$tag" > /dev/null
          # No --clobber: an asset that appeared since the preflight makes this fail, and nothing is replaced.
          gh release upload "$tag" adam-agent_*.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
          {
            echo "### adam-agent $VERSION"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Install through Homebrew on the four platforms before the tap hears of the release. The formula is the
  # one the tap gets, built from the release's own SHA256SUMS and put in a local tap, so what is tested is what
  # is proposed. Homebrew is preinstalled on these runners (the system's homebrew-smoke.yml runs on all four, and the tap's
  # another-agentic 0.6.0, vymalo/homebrew-tap#5, passed it).
  adam-agent-smoke:
    name: Homebrew install, ${{ matrix.name }}
    needs: [gate, adam-agent-preflight, adam-agent-publish]
    # After `publish`, or, when the assets were all there already, without it.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.adam-agent-preflight.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.adam-agent-publish.result) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux amd64, runner: ubuntu-24.04 }
          - { name: Linux arm64, runner: ubuntu-24.04-arm }
          - { name: macOS arm64, runner: macos-26 }
          - { name: macOS amd64, runner: macos-26-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install adam-agent with Homebrew and run it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          gh release download "v$VERSION" --pattern 'SHA256SUMS*' --dir "$RUNNER_TEMP/sums"
          # What is published, whether this run attached it or an earlier one did, is signed by this workflow.
          cosign verify-blob "$RUNNER_TEMP/sums/SHA256SUMS" --bundle "$RUNNER_TEMP/sums/SHA256SUMS.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sh tools/release/homebrew-smoke.sh "$VERSION" "$RUNNER_TEMP/sums/SHA256SUMS" Cargo.toml

  # The tap's pull request: one open branch, `bot/adam-agent`, rebuilt from the tap's default branch, never
  # older than what the tap has. The release App's token is scoped to this repository and the tap.
  adam-agent-tap:
    name: adam-agent, propose the Homebrew tap update
    needs: [gate, adam-agent-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # One at a time, and none dropped: `queue: max` keeps up to 100 pending runs (the default, `single`, replaces
      # a pending run with the one that arrives later, whatever its version). `cancel-in-progress: false` keeps a
      # running update from being cut off. Arrival order is not version order, so the script refuses a version
      # older than the tap's or the open branch's: an older run that comes last is a no-op.
      # actionlint (no release parses `queue` yet) is told to ignore this one message: .github/actionlint.yaml.
      group: homebrew-tap-adam-agent
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: Mint the release App token for this repository and the tap
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: vymalo
          repositories: another-adam-rs,homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Discover the tap's default branch
        id: tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "base=$(gh api repos/vymalo/homebrew-tap --jq .default_branch)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vymalo/homebrew-tap
          ref: ${{ steps.tap.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: The checksums are the signed ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          gh release download "v$VERSION" --pattern 'SHA256SUMS*' --dir sums
          cosign verify-blob sums/SHA256SUMS --bundle sums/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Create or update the monotonic tap pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.tap.outputs.base }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          node source/tools/release/update-homebrew-tap.mjs "$PWD/homebrew-tap" "$BASE" "$VERSION" \
            "$PWD/sums/SHA256SUMS" "$PWD/source/Cargo.toml"
