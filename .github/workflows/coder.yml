name: coder

# The coder agent (bin/adam-coder + crates/adam-a2a-runtime): checks on pull
# requests, an image on main, and a tag bump in the deploy chart. The Rust
# checks (fmt, clippy, tests, MSRV, coverage) run for every pull request in
# ci.yml; this workflow covers what only the image and the chart can show.
#
# The image is built on pull requests too and smoke-tested as a container (a
# Postgres service, a stub model, a real start under tini), then run through
# the compose stack (scripted models, a git remote, a mock GitHub) with a task
# that must end in a branch and one pull request (dev/coder-e2e.sh; also a task that names no
# repository, which ends in a pull request on a repository named later; and all of them again with
# the coder as a GitHub App installation, dev/compose.github-app.yaml; also a task that needs another
# repository, which the coder may add only if the person says yes, and a no leaves it out; and a task
# for which the coder creates a repository, again only after a yes (SCENARIO=create-repo); a work environment
# for the run's commands, checks and OpenCode (slice 7b, ADR 0010): the repository's own devcontainer on a
# rootless Podman service (dev/compose.devcontainer.yaml) in SCENARIO=devcontainer, the default image for a
# repository without one (default-env), a devcontainer.json that cannot be used, which the person decides
# (broken-env), and a stopped service (no-runtime); the default one also reads a
# repository's branches through the GitHub MCP server, here its mock `mock-github-mcp`; the image build
# itself runs the real server's tool list over stdio), and with
# "Hi", which must get a greeting that says the agent's name, and with a changed
# agent folder mounted in place of the default one (dev/greeting-e2e.sh). The same
# image carries the general agent binary too (adam-agent, which serves any agent
# folder): it is smoke-tested as a container by running the image with the
# entrypoint `tini -- adam-agent` (docker/coder/test/agent-smoke.sh) and in the
# compose stack as the service `agent`, where "hi" must be answered in role by the
# folder it serves and a changed folder must change the answer after a restart
# (dev/agent-e2e.sh), the coder asks three questions as one form and goes on with the
# answers (dev/coder-choices-e2e.sh), and the same service on the researcher folder answers with
# source cards and a graph on a screen that draws them (dev/agent-cards-e2e.sh). There is no second
# image. On main the very image that passed is the one pushed.
#
# The bump follows the pattern of vymalo/another-agentic-system#11 (deploy-bump):
# set the image tag in the chart's values.yaml to `sha-<first 7 of the commit>`
# and push `chore(deploy): bump coder to sha-xxxxxxx` to main as github-actions.
# It is a no-op when the tag is already current and it cannot loop: the push is
# made with GITHUB_TOKEN (which does not trigger workflows), and pushes that only
# touch values.yaml are ignored by the `paths-ignore` below anyway. Pull requests
# get a dry run that shows the edit the bump would make.

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/coder/values.yaml
  pull_request:
    paths:
      - crates/**
      - bin/**
      - Cargo.toml
      - Cargo.lock
      - deploy/coder/**
      - docker/coder/**
      # The compose e2e below: the scripted models, the git remote, the script.
      - compose.yaml
      - dev/**
      - .github/workflows/coder.yml

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/vymalo/another-adam-rs/coder
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  # Kubernetes version the rendered manifests are validated against.
  KUBERNETES_VERSION: 1.31.0

concurrency:
  group: coder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  helm:
    name: helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint deploy/coder
      - run: helm template coder deploy/coder --namespace another-agentic-system > /dev/null
      - name: Rendered chart keeps its guarantees
        run: sh deploy/coder/tests/render-check.sh
      # Schema-check the render: core kinds against the Kubernetes schemas, the
      # CNPG Cluster and the ExternalSecret against the CRD schemas vendored in
      # deploy/coder/tests/schemas (a pinned copy of the datreeio catalog: a live
      # catalog 500 once skipped the image job). A kind without a schema fails
      # (no -ignore-missing-schemas), so a new CRD in the chart needs its schema
      # there. The core schemas are still downloaded; a download failure (not a
      # validation failure) is retried.
      - name: kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -eu
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          # The default render (role all), the control plane's, which drops the model, GitHub
          # and workspace settings and the two secrets they need, and topology=split (a front
          # Deployment, a PodDisruptionBudget and the worker StatefulSet), and the three
          # workspace placements at three workers (isolated: a claim per pod; affinity and
          # shared: one ReadWriteMany PersistentVolumeClaim).
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            > "$RUNNER_TEMP/rendered.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set config.role=control-plane > "$RUNNER_TEMP/rendered-control-plane.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set topology=split --set front.replicas=2 > "$RUNNER_TEMP/rendered-split.yaml"
          # runPods (ADR 0019): the pod template, the priority class and quota, the RBAC, the admission
          # policy and the network policy, on the per-pod volume and on a shared one.
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set runPods.enabled=true > "$RUNNER_TEMP/rendered-run-pods.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set runPods.enabled=true --set topology=split --set workspace.placement=shared \
            --set workspace.sharedVolume.storageClass=rwx --set replicaCount=2 \
            > "$RUNNER_TEMP/rendered-run-pods-shared.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set workspace.placement=isolated --set replicaCount=3 > "$RUNNER_TEMP/rendered-isolated.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set workspace.placement=affinity --set workspace.sharedVolume.storageClass=longhorn \
            --set replicaCount=3 > "$RUNNER_TEMP/rendered-affinity.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set workspace.placement=shared --set workspace.sharedVolume.storageClass=longhorn \
            --set topology=split --set replicaCount=3 > "$RUNNER_TEMP/rendered-shared-split.yaml"
          # github.auth=app: the key Secret is a second volume of the pod, beside the per-pod claim
          # template, and beside the shared claim.
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set github.auth=app --set github.app.id=1234567 --set github.app.installationId=98765432 \
            --set github.app.privateKeySecret=coder-github-app > "$RUNNER_TEMP/rendered-app.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set github.auth=app --set github.app.id=1234567 --set github.app.installationId=98765432 \
            --set github.app.privateKeySecret=coder-github-app --set workspace.placement=shared \
            --set workspace.sharedVolume.storageClass=longhorn --set replicaCount=3 \
            > "$RUNNER_TEMP/rendered-app-shared.yaml"
          # The same App with no pin: owners instead of an installation ID (GITHUB_APP_OWNERS).
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set github.auth=app --set github.app.id=1234567 --set 'github.app.owners={acme,octocat}' \
            --set github.app.privateKeySecret=coder-github-app > "$RUNNER_TEMP/rendered-app-owners.yaml"
          # The extra MCP servers on (mcp.websearch.url and mcp.context7.enabled): the servers ConfigMap and
          # its volume, in the combined pod, and in the split worker (the front gets none).
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set mcp.websearch.url=http://search-mcp.another-agentic-system.svc.cluster.local:8080/mcp \
            --set mcp.websearch.allowInsecure=true --set mcp.context7.enabled=true > "$RUNNER_TEMP/rendered-mcp.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set mcp.websearch.url=https://search.example.com/mcp --set mcp.context7.enabled=true \
            --set topology=split --set front.replicas=2 > "$RUNNER_TEMP/rendered-mcp-split.yaml"
          # The gateway's URL from the ExternalSecret (config.modelBaseUrlFromSecret): a secretKeyRef and one more
          # key in the ExternalSecret, in the combined pod and in the split worker.
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set config.modelBaseUrlFromSecret=true > "$RUNNER_TEMP/rendered-model-url.yaml"
          helm template coder deploy/coder --namespace another-agentic-system --set image.tag=sha-abc1234 \
            --set config.modelBaseUrlFromSecret=true --set topology=split --set front.replicas=2 \
            > "$RUNNER_TEMP/rendered-model-url-split.yaml"
          for attempt in 1 2 3; do
            status=0
            "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location 'deploy/coder/tests/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "$RUNNER_TEMP/rendered.yaml" "$RUNNER_TEMP/rendered-control-plane.yaml" \
                "$RUNNER_TEMP/rendered-split.yaml" "$RUNNER_TEMP/rendered-isolated.yaml" \
                "$RUNNER_TEMP/rendered-affinity.yaml" "$RUNNER_TEMP/rendered-shared-split.yaml" \
                "$RUNNER_TEMP/rendered-app.yaml" "$RUNNER_TEMP/rendered-app-shared.yaml" \
                "$RUNNER_TEMP/rendered-app-owners.yaml" \
                "$RUNNER_TEMP/rendered-mcp.yaml" "$RUNNER_TEMP/rendered-mcp-split.yaml" \
                "$RUNNER_TEMP/rendered-model-url.yaml" "$RUNNER_TEMP/rendered-model-url-split.yaml" \
                "$RUNNER_TEMP/rendered-run-pods.yaml" "$RUNNER_TEMP/rendered-run-pods-shared.yaml" \
                > "$RUNNER_TEMP/kubeconform.out" 2>&1 || status=$?
            cat "$RUNNER_TEMP/kubeconform.out"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -q 'failed downloading schema' "$RUNNER_TEMP/kubeconform.out"; then exit "$status"; fi
            echo "schema download failed (attempt $attempt of 3); retrying in 20 s"
            sleep 20
          done
          exit 1

  dockerfile:
    name: lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/coder/Dockerfile

  scripts:
    name: shell scripts and stub model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/coder/bump-tag.sh deploy/coder/tests/*.sh docker/coder/test/*.sh dev/*.sh
      - name: bump-tag.sh is idempotent and edits only image.tag
        run: sh deploy/coder/tests/bump-tag-test.sh
      - name: the stub model compiles
        run: python3 -m py_compile docker/coder/test/fake-model.py

  bump-dry-run:
    name: show the tag bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: What the bump would change on main
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          sh deploy/coder/bump-tag.sh deploy/coder/values.yaml "$tag"
          {
            echo "### Tag bump dry run"
            echo
            echo "On main this pull request would set \`image.tag\` to \`$tag\`:"
            echo
            echo '```diff'
            git diff --unified=1 -- deploy/coder/values.yaml
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: build, smoke-test and push the image
    needs: [helm, dockerfile, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      pushed: ${{ steps.guard.outputs.push }}
    services:
      # The coder's database for the container smoke test.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # docker/coder/Dockerfile pins the workspace base image by tag. If it is
      # ever set back to a placeholder (…-PENDING) that does not exist, say so
      # instead of failing every build. `push` is true only on main.
      - name: Is the base image tag real?
        id: guard
        run: |
          if grep -Eq '^ARG WORKSPACE_TAG=.*PENDING' docker/coder/Dockerfile; then
            echo "::warning file=docker/coder/Dockerfile::WORKSPACE_TAG is a placeholder (…-PENDING); not building the image. Set it to a published <toolchain>-<sha7> tag of the workspace image."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.ready == 'true'
      # Build only (no push) and load into the local daemon for the smoke test.
      # The Dockerfile's own last RUN is a smoke test of the tools. Fork pull
      # requests cannot write the cache: ignore-error keeps them green.
      - uses: docker/build-push-action@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          context: .
          file: docker/coder/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: coder:smoke
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # The commit, baked into both binaries: the card's version is `<crate>+<first 7>` and `build/v1`
          # says it whole (ADR 0028). The smoke tests below check it.
          build-args: |
            ADAM_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Container smoke test
        if: steps.guard.outputs.ready == 'true'
        env:
          EXPECT_REVISION: ${{ github.sha }}
        run: sh docker/coder/test/container-smoke.sh coder:smoke
      # The same image, the other binary: no agent folder, no agent (exit 78); with the example
      # folder mounted it serves that card, completes a task and stops on SIGTERM.
      - name: Container smoke test of adam-agent
        if: steps.guard.outputs.ready == 'true'
        env:
          EXPECT_REVISION: ${{ github.sha }}
        run: sh docker/coder/test/agent-smoke.sh coder:smoke
      # The image that just passed, in the compose stack: the coder gets a task
      # over A2A, its scripted model drives prepare -> OpenCode (also scripted)
      # -> checks -> commit and push -> pull request, and dev/coder-e2e.sh
      # checks the artifacts, mock-github's journal and git-server. Run four times (and the second repository
      # twice, with the person's yes and no):
      # without OpenCode (the check command makes the change), with it, with the coder
      # writing the file itself (SCENARIO=files), and with no repository named at all
      # (SCENARIO=scratch: a project is built in a scratch slot, the coder asks where to put
      # it, and the answer names an empty repository that git-server makes on first use). Then
      # the same four again with the coder as a GitHub App installation.
      # The job's own Postgres service holds 5432, so the stack's Postgres
      # moves to POSTGRES_PORT.
      - name: Compose e2e
        if: steps.guard.outputs.ready == 'true'
        env:
          POSTGRES_PORT: "15432"
        run: |
          set -eu
          docker tag coder:smoke adam-rs/coder:dev
          docker compose --profile app build git-server
          docker compose --profile app up -d --no-build --wait \
            postgres mock-openai mock-github mock-github-mcp git-server coder agent
          NO_OPENCODE=1 sh dev/coder-e2e.sh
          sh dev/coder-e2e.sh
          # The coder edits the files itself (read_file, write_file), and OpenCode is not started.
          SCENARIO=files sh dev/coder-e2e.sh
          # No repository is named: the project is built in a scratch slot, the task waits for the
          # person to name one, and what was checked is what is pushed to it.
          SCENARIO=scratch sh dev/coder-e2e.sh
          # The task needs a second repository: the coder asks the person (request_repository), and
          # only a yes adds it. With the yes the pull request has the library's greeting; with a no
          # git-server is never asked for the library and no pull request is opened.
          SCENARIO=second-repo ANSWER=yes sh dev/coder-e2e.sh
          SCENARIO=second-repo ANSWER=no sh dev/coder-e2e.sh
          # A repository is created for the scratch project, only after the person's yes: with it
          # mock-github sees exactly one creation (private, empty) and the pull request follows; with
          # a no it sees none.
          SCENARIO=create-repo ANSWER=yes sh dev/coder-e2e.sh
          SCENARIO=create-repo ANSWER=no sh dev/coder-e2e.sh
          # The work environments: the stack again with a rootless Podman service beside the coder
          # (dev/compose.devcontainer.yaml), and the coder pointed at it. Ubuntu 24.04 stops unprivileged user
          # namespaces under AppArmor, which a rootless Podman needs; where the key does not exist there is
          # nothing to set. Without it the coder falls back to its own container, and these scenarios say so.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          export COMPOSE_CMD="docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile app"
          $COMPOSE_CMD build podman
          $COMPOSE_CMD up -d --no-build --wait podman coder
          # local/devbox ships devbox-tool, which only its devcontainer has: run_command, run_checks and OpenCode's
          # own bash command all run there, the pull request is for what they made, and the run's container
          # and its image are gone after the sweep.
          SCENARIO=devcontainer sh dev/coder-e2e.sh
          # local/sandbox has no devcontainer: the default environment (not the coder's own image).
          SCENARIO=default-env sh dev/coder-e2e.sh
          # local/devbox-broken asks for privileged and tries an initializeCommand: refused, the person decides.
          SCENARIO=broken-env sh dev/coder-e2e.sh
          # The service stopped: the run goes on in the coder's own container, with a step that says so.
          SCENARIO=no-runtime sh dev/coder-e2e.sh
          # The plain stack again (the scripts below restart the coder without the override).
          docker compose --profile app up -d --no-build --wait coder
          # The greeting, and the mounted agent folder (it restarts the coder on an edited copy).
          sh dev/greeting-e2e.sh
          # The general agent: "hi" answered in role by its folder, and an edited folder changes the
          # answer after a restart (it restarts `agent` on an edited copy).
          sh dev/agent-e2e.sh
          # The coder asks three questions as one form (the screen's catalog in the message's
          # metadata), the answers come back as one A2UI action, and it goes on; on a screen it
          # cannot read, the options are text.
          sh dev/coder-choices-e2e.sh
          # The researcher folder on the same service (it restarts `agent` on a copy of it and the model
          # mock-researcher, and puts the default back): sources as cards and a graph on a screen with
          # catalog version 3, words only on one without Cards or without a catalog.
          sh dev/agent-cards-e2e.sh
          # The same coder scenarios again, the coder now a GitHub App installation instead of a token
          # (dev/compose.github-app.yaml: an init service makes a throwaway key, GITHUB_TOKEN is off).
          # Last, because the scripts above restart the coder without the override. Each asserts that
          # the coder traded a JWT for an installation token at mock-github and that every call to the
          # repositories' API carried that token.
          export GITHUB_AUTH=app
          docker compose -f compose.yaml -f dev/compose.github-app.yaml --profile app up -d --no-build --wait coder
          # The App has no pinned installation (GITHUB_APP_OWNERS): the first run after the coder started
          # also asserts the installation lookup, which the coder then keeps.
          EXPECT_INSTALLATION_LOOKUP=1 NO_OPENCODE=1 sh dev/coder-e2e.sh
          sh dev/coder-e2e.sh
          SCENARIO=files sh dev/coder-e2e.sh
          SCENARIO=scratch sh dev/coder-e2e.sh
          SCENARIO=second-repo ANSWER=yes sh dev/coder-e2e.sh
          SCENARIO=second-repo ANSWER=no sh dev/coder-e2e.sh
          SCENARIO=create-repo ANSWER=yes sh dev/coder-e2e.sh
          SCENARIO=create-repo ANSWER=no sh dev/coder-e2e.sh
      - name: Compose e2e logs
        if: failure() && steps.guard.outputs.ready == 'true'
        run: docker compose -f compose.yaml -f dev/compose.github-app.yaml -f dev/compose.devcontainer.yaml --profile app logs --no-color
      - name: Compose e2e teardown
        if: always() && steps.guard.outputs.ready == 'true'
        run: docker compose -f compose.yaml -f dev/compose.github-app.yaml -f dev/compose.devcontainer.yaml --profile app down -v
      - uses: docker/login-action@v3
        if: steps.guard.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the image that just passed, not a rebuild of it.
      - name: Push
        if: steps.guard.outputs.push == 'true'
        run: |
          tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          docker tag coder:smoke "$IMAGE:$tag"
          docker push "$IMAGE:$tag"

  bump:
    name: bump the tag in the chart
    needs: image
    if: needs.image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: coder-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set image.tag and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A newer commit on main builds and bumps for itself; do not put
            # its tag back to this older one (image jobs can finish out of order).
            newer="$(git log --format=%s "$SHA..origin/main" | grep -v '^chore(deploy): bump coder to ' || true)"
            if [ -n "$newer" ]; then
              echo "main has moved on since $SHA; the newer build will bump"
              exit 0
            fi
            result="$(sh deploy/coder/bump-tag.sh deploy/coder/values.yaml "$tag")"
            echo "$result"
            case "$result" in
              unchanged*) exit 0 ;;
            esac
            git add deploy/coder/values.yaml
            git commit -m "chore(deploy): bump coder to $tag"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit (attempt $attempt); retrying"
            sleep $((attempt * 3))
          done
          echo "could not push the bump" >&2
          exit 1
