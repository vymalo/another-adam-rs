name: ci

# Push to main and every pull request: not both on every branch push. A newer
# push to a pull request cancels the run it supersedes; runs on main finish.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line coverage gate of the coverage job. Measured 89.2% on 2026-09-29 with
  # cargo-llvm-cov 0.6.21 (workspace, Postgres, no MongoDB: adam-store-mongodb's
  # 273 lines counted as uncovered, so CI with MongoDB reads higher), gated at
  # measured minus 2. Raise it whenever coverage rises, never lower it to get a
  # change through. The job runs on main only (see its `if`): a pull request
  # still runs the whole suite twice in conformance, just not instrumented.
  COVERAGE_MIN_LINES: "87"
  # Not coverage: fake agent binary, the MCP test server and the test code itself.
  COVERAGE_IGNORE: '(adam-acp-fake-agent|adam-mcp-testkit|/tests/)'

jobs:
  # Formatting and the repository rules that do not need a compiler. The six compiles are their own jobs below, and
  # `lint` is the required check that aggregates them.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Every crate documents itself: update its README in the same change as
      # any change to its public API, environment variables or tests.
      - name: Every crate has a README
        run: |
          missing=0
          for manifest in crates/*/Cargo.toml bin/*/Cargo.toml; do
            dir=$(dirname "$manifest")
            if [ ! -f "$dir/README.md" ]; then
              echo "::error file=$manifest::$dir has no README.md"
              missing=1
            fi
          done
          exit "$missing"
      # ADR 0052: the dev stack and CI carry no container engine, and the four e2e scenarios that ran on
      # one are gone. The scan is what keeps them from coming back by habit; the script says what it reads.
      - name: The dev stack and CI carry no container engine
        run: sh tools/check-dev-stack.sh
      - run: cargo fmt --all --check

  # The two clippy arms: the default features, and the optional ones (or their code never runs in CI).
  clippy-default:
    name: clippy (default)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # ADR 0053 decision 1: sqlx must not come back. It locks sqlx-sqlite, whose libsqlite3-sys
      # ceiling keeps rusqlite (and so adam-store-sqlite) out of the workspace. An absent package
      # makes `cargo tree -i` exit 101, so only a present one runs the `then` branch.
      - name: sqlx stays out of the workspace
        run: |
          if cargo tree --workspace --locked -i sqlx; then
            echo "::error::sqlx is back in the dependency graph (ADR 0053 decision 1)"
            exit 1
          fi

  clippy-features:
    name: clippy (optional features)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp -- -D warnings

  # nextest does not run doctests; the database suites are not needed here.
  doctest-default:
    name: doctest (default)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc --locked

  doctest-features:
    name: doctest (optional features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc --locked --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp

  # Broken or redundant intra-doc links, with every feature on (the documented build; some
  # docs link to items that exist only behind a feature).
  rustdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The embedded feature set (ADR 0047): each split crate with its defaults off and with each feature alone, and
  # adam-engine's tree free of an HTTP server or client, a database driver, the Kubernetes client, a TLS stack and
  # the MCP client. The self-test proves the check fails on a planted crate and on a gate turned back on.
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: tools/embedded-deps/check.sh
      - run: tools/embedded-deps/check.sh self-test

  # The engine runs on phones: type-check it for Android and iOS (checked, not linked: no NDK, no Xcode, no device).
  # Both targets check on a Linux runner. Uses the toolchain the other jobs use (`stable`; no rust-toolchain.toml).
  phone-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check -p adam-engine --locked --target ${{ matrix.target }}

  # A host that installs its own TLS provider builds adam-model-openai and adam-model-oauth without their
  # defaults and must not link aws-lc-rs. The self-test plants it back and expects the check to fail.
  tls-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/tls-provider/check.sh
      - run: tools/tls-provider/check.sh self-test

  # ADR 0053 decision 2: an application that keeps its own state on cratestack links one sqlite3.
  # The probe resolves `adam-store-sqlite` together with `cratestack-sqlite` and asserts one
  # `rusqlite` and one `libsqlite3-sys`; its own workspace keeps cratestack (Rust 1.98) out of the
  # main lockfile, and its test builds neither side.
  sqlite-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/sqlite-probe
      - run: cargo test --manifest-path tools/sqlite-probe/Cargo.toml --locked

  # The required check. It compiles nothing: it fails unless every job above passed, so a clippy, doctest or
  # rustdoc or embedded-set error cannot merge on a green `lint`. The jobs above are extra checks, not required ones.
  lint:
    name: lint
    needs: [fmt, clippy-default, clippy-features, doctest-default, doctest-features, rustdoc, embedded, sqlite-probe, phone-targets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate above passed
        run: |
          failed=0
          for pair in \
            "fmt=${{ needs.fmt.result }}" \
            "clippy-default=${{ needs['clippy-default'].result }}" \
            "clippy-features=${{ needs['clippy-features'].result }}" \
            "doctest-default=${{ needs['doctest-default'].result }}" \
            "doctest-features=${{ needs['doctest-features'].result }}" \
            "rustdoc=${{ needs.rustdoc.result }}" \
            "embedded=${{ needs.embedded.result }}" \
            "sqlite-probe=${{ needs['sqlite-probe'].result }}" \
            "phone-targets=${{ needs['phone-targets'].result }}"
          do
            name=${pair%%=*}
            result=${pair#*=}
            echo "$name: $result"
            [ "$result" = success ] || failed=1
          done
          exit "$failed"

  # The oldest toolchain the workspace promises to build with (`rust-version`
  # in Cargo.toml; keep the two in step).
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --locked --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp

  # The compile tests of `#[tool]` (crates/adam/tests/ui), on the toolchain their
  # rustc-produced snapshots were written with. The errors the macro produces
  # itself run everywhere (nextest, stable); the ones rustc words itself change
  # between toolchains, so they run here only (ADAM_TRYBUILD=1). Keep this in
  # step with `rust-version`: after a bump, regenerate the snapshots with
  # `ADAM_TRYBUILD=1 TRYBUILD=overwrite cargo test -p adam --test ui`.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p adam --test ui --locked
        env:
          ADAM_TRYBUILD: "1"

  # Licenses, advisories, banned and unknown sources: see deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Every workflow file parses and is type-correct; shell in `run:` is shellchecked.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # Every Mermaid diagram parses (pinned Mermaid), every relative Markdown link
  # and #heading resolves, every crate has a README. See tools/docs-check.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned checker dependencies
        run: npm --prefix tools/docs-check ci --no-fund --no-audit
      - name: Check diagrams and links
        run: node tools/docs-check/check-docs.mjs
      - name: Check the vendored UI catalogs against the published files
        run: sh tools/check-vendored-catalogs.sh

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported servers.
        include:
          - { postgres: "12", mongodb: "5.0" }
          - { postgres: "17", mongodb: "8.0" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports: ["27017:27017"]
    env:
      ADAM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/adam_test
      ADAM_TEST_MONGODB_URI: mongodb://localhost:27017
      # A database suite that would skip (variable unset) fails instead: see
      # adam_core::testing. Without this, a typo here turns the suites green.
      ADAM_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The coder's test against the real GitHub MCP server (bin/adam-coder/tests/binary.rs) needs the
      # binary the coder image carries: the same image, by the same tag and digest as
      # docker/coder/Dockerfile (keep the two in step). Without it that test skips itself.
      - name: The GitHub MCP server of the coder image
        run: |
          set -eu
          id=$(docker create ghcr.io/github/github-mcp-server:v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6)
          docker cp "$id:/server/github-mcp-server" "$RUNNER_TEMP/github-mcp-server"
          docker rm "$id" > /dev/null
          "$RUNNER_TEMP/github-mcp-server" --version
          echo "ADAM_TEST_GITHUB_MCP_SERVER=$RUNNER_TEMP/github-mcp-server" >> "$GITHUB_ENV"
      - name: Tests (memory, Postgres, MongoDB, coder end to end)
        run: cargo nextest run --workspace --locked --profile ci --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp
      # Run the database suites a second time: this pass exercises migrate() on
      # an existing schema. The offline suites (coder end to end) do not repeat.
      - name: Database suites again, on the migrated schema
        run: >-
          cargo nextest run --locked --profile ci
          -p adam-store-postgres -p adam-store-mongodb -p adam-runtime -p adam-a2a-runtime
          -p adam-notify-postgres

  # Line coverage of the whole workspace against the newest servers. The lcov
  # file is an artifact; the summary is on the run page; the gate ratchets.
  # Main only: on a pull request this was a third full workspace run (after the
  # two conformance arms) on the critical path, for a measurement that is about
  # the tree as a whole. The trade-off is that a pull request can lower coverage
  # and main's run says so after the merge; the gate itself is unchanged (87)
  # and still fails main, so the ratchet cannot silently drift.
  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The gate is main-only, so a red main needs a follow-up: the last step opens an issue.
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      ADAM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/adam_test
      ADAM_TEST_MONGODB_URI: mongodb://localhost:27017
      ADAM_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      - name: Run the tests instrumented
        run: >-
          cargo llvm-cov nextest --workspace --locked --profile ci --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp
          --ignore-filename-regex "$COVERAGE_IGNORE" --no-report
      - name: lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COVERAGE_IGNORE"
      - name: Summary and gate
        id: gate
        run: |
          cargo llvm-cov report --summary-only --ignore-filename-regex "$COVERAGE_IGNORE" | tee summary.txt
          {
            echo "### Coverage"
            echo
            echo '```'
            cat summary.txt
            echo '```'
            echo
            echo "Gate: line coverage >= ${COVERAGE_MIN_LINES}%."
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" \
            --fail-under-lines "$COVERAGE_MIN_LINES" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: |
            lcov.info
            summary.txt
          if-no-files-found: ignore
      # Nothing else follows up a red main: one open issue (deduplicated by its title) with the run's link.
      - name: Open an issue when main's coverage falls below the gate
        if: failure() && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: coverage on main fell below the gate
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          body="The line-coverage gate (>= ${COVERAGE_MIN_LINES}%) failed on main: ${RUN_URL}"
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
      # A recovered main must not leave the issue open.
      - name: Close the coverage issue when main is green again
        if: success() && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: coverage on main fell below the gate
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The gate passed again on main: ${RUN_URL}"
          fi

  # compose.yaml must keep working: the WireMock mappings are exercised by the
  # real clients (OpenAiCompatible, GitHub), so they cannot rot.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Two checkouts get two project names
        run: sh tools/check-compose-project.sh
      - name: Compose files are valid
        run: |
          docker compose config -q
          docker compose --profile app config -q
      - name: Start postgres and the mocks
        run: docker compose up -d --build --wait postgres mock-openai mock-github mock-github-mcp mock-image-mcp git-server
      - name: Smoke-test each service
        run: |
          set -eu
          # mock-openai: text answer, streamed answer ending in [DONE], 429.
          curl -fsS http://127.0.0.1:8081/v1/models | grep -q mock-model
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' | grep -q '"finish_reason": "stop"'
          curl -fsSN http://127.0.0.1:8081/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"m","stream":true,"messages":[{"role":"user","content":"hi"}]}' | grep -q '^data: \[DONE\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/v1/chat/completions \
            -H 'X-Mock-Scenario: rate-limit' -d '{"messages":[]}')" = 429
          # mock-openai, model mock-coder: the scripted coder starts by preparing the workspace.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"user","content":"add hello.txt"}]}' \
            | jq -e '.choices[0].message.tool_calls[0].function.name == "prepare_workspace"' > /dev/null
          # mock-openai, model mock-coder: a greeting is answered with the name and the one-sentence
          # summary that the two persona lines of the system prompt give (what the coder's
          # `agent/instructions.md` opens with), not with the workspace script ...
          want="I'm Adam. I answer questions. What can I help with?"
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"Your name is Adam.\nIn one sentence: I answer questions.\n"},{"role":"user","content":"Hi"}]}' \
            | jq -e --arg want "$want" '.choices[0].finish_reason == "stop" and (.choices[0].message.content | contains($want))' > /dev/null
          # ... a persona that is edited gives another answer, with no rebuild ...
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"Your name is Cody.\nIn one sentence: I only fix typos.\n"},{"role":"user","content":"hello there"}]}' \
            | jq -e '.choices[0].message.content | contains("Cody. I only fix typos.")' > /dev/null
          # ... and once the person has answered (the stop is the `ask_user` call stop00001 in the
          # history), the script goes on with the workspace.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"Hi"},{"role":"assistant","content":"Hi!","tool_calls":[{"id":"stop00001","type":"function","function":{"name":"ask_user","arguments":"{}"}}]},{"role":"tool","tool_call_id":"stop00001","content":"http://git-server:8080/local/sandbox.git, add hello.txt"}]}' \
            | jq -e '.choices[0].message.tool_calls[0] | .id == "coder-call-1" and .function.name == "prepare_workspace"' > /dev/null
          # mock-openai, model mock-assistant (the general agent, adam-agent): any request is answered in
          # role from the two persona lines of the system prompt, and a request that holds a tool result
          # gets the fixed text.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-assistant","messages":[{"role":"system","content":"Your name is Chat.\nIn one sentence: I talk things through.\n"},{"role":"user","content":"Hi"}]}' \
            | jq -e '.choices[0].finish_reason == "stop" and (.choices[0].message.content | contains("Hi! I'"'"'m Chat. I talk things through."))' > /dev/null
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-assistant","messages":[{"role":"system","content":"x"},{"role":"user","content":"Hi"},{"role":"assistant","content":null,"tool_calls":[{"id":"c1","type":"function","function":{"name":"search__web_search","arguments":"{}"}}]},{"role":"tool","tool_call_id":"c1","content":"1. A"}]}' \
            | jq -e '.choices[0].message.content | contains("That is all the mock assistant has to say")' > /dev/null
          # mock-openai, model mock-coder, a task that carries [mock:choices]: the coder asks three
          # questions at once, one `ask_user` call whose `choices` are the three questions ...
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:choices] set up the project"}]}' \
            | jq -e '.choices[0].message.tool_calls[0] | .id == "choices-call-1" and .function.name == "ask_user" and ((.function.arguments | fromjson | .choices | map(.id)) == ["db","auth","deploy"])' > /dev/null
          # ... and once the person has answered through the form (the answers are the tool result, as
          # `- db: pg` lines), it goes on: any other answer gets the general thanks.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:choices] set up the project"},{"role":"assistant","content":null,"tool_calls":[{"id":"choices-call-1","type":"function","function":{"name":"ask_user","arguments":"{}"}}]},{"role":"tool","tool_call_id":"choices-call-1","content":"The person answered through the interface:\n- db: pg\n- auth: keycloak\n- deploy: compose"}]}' \
            | jq -e '.choices[0].finish_reason == "stop" and (.choices[0].message.content == "Going with Postgres, Keycloak and Compose.")' > /dev/null
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:choices] set up the project"},{"role":"assistant","content":null,"tool_calls":[{"id":"choices-call-1","type":"function","function":{"name":"ask_user","arguments":"{}"}}]},{"role":"tool","tool_call_id":"choices-call-1","content":"The person answered through the interface:\n- db: sqlite"}]}' \
            | jq -e '.choices[0].message.content == "Thanks, I have your answers."' > /dev/null
          # mock-openai, model mock-researcher, a question that carries [mock:cards]: the researcher
          # shows what it found, one `show` call with a Text, a Cards of three sources and a Mermaid graph ...
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-researcher","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:cards] what is async rust?"}]}' \
            | jq -e '.choices[0].message.tool_calls[0] | .id == "cards-call-1" and .function.name == "show" and ((.function.arguments | fromjson | .blocks | map(.component)) == ["Text","Cards","Mermaid"]) and ((.function.arguments | fromjson | .blocks[1].cards | length) == 3)' > /dev/null
          # ... and once the screen has answered the call (the id is in the history, whatever the result
          # was), it answers in words with the three links.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-researcher","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:cards] what is async rust?"},{"role":"assistant","content":null,"tool_calls":[{"id":"cards-call-1","type":"function","function":{"name":"show","arguments":"{}"}}]},{"role":"tool","tool_call_id":"cards-call-1","content":"Shown to the person."}]}' \
            | jq -e '.choices[0].finish_reason == "stop" and (.choices[0].message.content | contains("https://example.org/mock-search/1") and contains("https://example.org/mock-search/3"))' > /dev/null
          # mock-github: no open pull requests; creating one answers 201.
          test "$(curl -fsS 'http://127.0.0.1:8082/repos/local/sandbox/pulls?head=local:agent/x&state=open')" = '[]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/repos/local/sandbox/pulls \
            -d '{"title":"t","head":"agent/x","base":"main"}')" = 201
          # mock-github-mcp (the GitHub MCP server's endpoint): turned away without a bearer, and
          # `tools/list` lists the twelve read tools of the coder's allow-list.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/mcp \
            -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')" = 401
          curl -fsS http://127.0.0.1:8085/mcp -H 'Authorization: Bearer x' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | jq -e '.result.tools | length == 12' > /dev/null
          # mock-image-mcp (the painter's image server): `initialize` carries instructions, and `tools/call`
          # of `draw` answers with one image content block.
          curl -fsS http://127.0.0.1:8086/mcp -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | jq -e '.result.instructions | contains("draw")' > /dev/null
          curl -fsS http://127.0.0.1:8086/mcp -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"draw","arguments":{"prompt":"x"}}}' \
            | jq -e '.result.content[0] | .type == "image" and .mimeType == "image/png"' > /dev/null
          # git-server: clone, push a branch, see it on the remote.
          git clone -q http://127.0.0.1:8083/local/sandbox.git "$RUNNER_TEMP/sandbox"
          cd "$RUNNER_TEMP/sandbox"
          sh check.sh
          git checkout -q -b agent/ci
          echo hello > hello.txt
          git add hello.txt
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "add hello.txt"
          git push -q origin agent/ci
          git ls-remote --heads http://127.0.0.1:8083/local/sandbox.git | grep -q refs/heads/agent/ci
      - name: Real clients against the mocks
        env:
          ADAM_TEST_MOCK_OPENAI_URL: http://127.0.0.1:8081
          ADAM_TEST_MOCK_GITHUB_URL: http://127.0.0.1:8082
          ADAM_TEST_MOCK_GITHUB_MCP_URL: http://127.0.0.1:8085/mcp
          ADAM_TEST_MOCK_IMAGE_MCP_URL: http://127.0.0.1:8086/mcp
        run: cargo test -p adam-model-openai -p adam-workspace -p adam-mcp --test wiremock_compose
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The run pods (crates/adam-env-kubernetes, the chart's `runPods`, ADR 0019) against a real cluster:
  # deploy/coder/tests/kind-run-pods.sh applies the chart's run-pod objects (the template, the priority
  # class and quota, the RBAC, the admission policy, the network policies and the egress proxy) to a kind
  # cluster and runs the cluster test of adam-env-kubernetes as the coder's ServiceAccount. What it proves:
  # the objects apply, the policy refuses what it should and the quota refuses a fifth pod, and a pod made
  # from the chart's own template runs commands (both streams, exit codes, stdin), is killed, swept when idle
  # and released through adam-kube-exec. It also proves, on a volume the script seeds with two runs of one
  # mirror, that a run pod sees only its own run and cannot write the mirror, and that the slot of a run is a
  # mount it cannot rename, remove or replace (ADR 0041; *verified 2026-10-27* in run 40456829784, job
  # 122032008830). And it proves the NETWORK POLICY of run pods (ADR 0042): the run pods reach the internet
  # only through the chart's egress proxy (`adam-egress`, built in the job and loaded into kind). A direct
  # connection from a run pod to a public address, to the API server and to another pod is refused, DNS still
  # works, and the proxy's own pod reaches the public address (the control); curl and `npm view` in the run
  # pod reach registry.npmjs.org through the proxy; example.com is answered 403 and the proxy logs the refusal
  # and nothing of the request. It FAILS when a policy is not enforced (ADAM_TEST_CNI_MAY_IGNORE_POLICIES=1,
  # which this job does not set, is for a cluster known not to enforce them). And it proves the GIT SANDBOX
  # (ADR 0041, open decision 6; issue #118): a pod made from the chart's own StatefulSet (the coder container
  # sleeps; its environment, mounts and projected token are the chart's, with canaries for the App's key, the
  # model key, a bearer token and the database URL) has a `git-sandbox` container with no token, no Secret, no
  # secret variable and no view of the coder's processes; a git command through its socket works; and a
  # scratch project whose own .git/config names a clean filter and an fsmonitor that write what they can read to
  # a marker runs them in the sandbox, with a marker that holds no canary, where the same program run by plain
  # git in the coder container (the control) reads them all. `adam-git-sandbox` and `adam-git` are built in
  # the job, like `adam-egress`. What it does not prove: the coder over a model through it, the images (a small
  # local one plays the run image, the coder's, the proxy's and the sandbox's), IPv6 (kind is IPv4 only: only
  # that no rule names an IPv6 range is checked) and a CNI other than kindnet.
  # ADAM_TEST_REQUIRE_KUBERNETES makes the test fail instead of skipping, so a typo in the variables cannot
  # turn the job green. The runner's preinstalled `kind` is used with the node image pinned here
  # (Kubernetes v1.35.8, whose network plugin, kindnet, enforces NetworkPolicies: the platform's run-pods-e2e
  # requires the refusal there and passed, *verified 2026-10-27*, run 40435825771); the script stops on a
  # cluster older than Kubernetes 1.30.
  run-pods:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The digest of the index of the tag, as the platform pins it.
      KIND_NODE_IMAGE: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    steps:
      - uses: actions/checkout@v4
      # ADR 0041: what git does in a run pod whose mirror is mounted read-only and whose worktree's own
      # directory in it is read-write, with real git and real bind mounts in a private mount namespace.
      - name: Git in a run pod's mounts
        run: sudo env ADAM_TEST_REQUIRE_MOUNTS=1 sh deploy/coder/tests/git-in-run-pod.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: A kind cluster
        run: |
          set -eu
          kind version
          kind create cluster --image "$KIND_NODE_IMAGE" --wait 180s
          kubectl version
      - name: The chart's run pod objects, the cluster test as the coder's ServiceAccount, and the network policies
        run: sh deploy/coder/tests/kind-run-pods.sh
