name: ci

# Push to main and every pull request: not both on every branch push. A newer
# push to a pull request cancels the run it supersedes; runs on main finish.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line coverage gate of the coverage job. Measured 89.2% on 2026-09-29 with
  # cargo-llvm-cov 0.6.21 (workspace, Postgres, no MongoDB: adam-store-mongodb's
  # 273 lines counted as uncovered, so CI with MongoDB reads higher), gated at
  # measured minus 2. Raise it whenever coverage rises, never lower it to get a
  # change through.
  COVERAGE_MIN_LINES: "87"
  # Not coverage: fake agent binary, the MCP test server and the test code itself.
  COVERAGE_IGNORE: '(adam-acp-fake-agent|adam-mcp-testkit|/tests/)'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Every crate documents itself: update its README in the same change as
      # any change to its public API, environment variables or tests.
      - name: Every crate has a README
        run: |
          missing=0
          for manifest in crates/*/Cargo.toml bin/*/Cargo.toml; do
            dir=$(dirname "$manifest")
            if [ ! -f "$dir/README.md" ]; then
              echo "::error file=$manifest::$dir has no README.md"
              missing=1
            fi
          done
          exit "$missing"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Optional features are linted and doc-tested too, or their code never runs in CI.
      - run: cargo clippy --workspace --all-targets --locked --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp -- -D warnings
      # nextest does not run doctests; the database suites are not needed here.
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --doc --locked --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp
      # Broken or redundant intra-doc links, with every feature on (the documented build; some
      # docs link to items that exist only behind a feature).
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest toolchain the workspace promises to build with (`rust-version`
  # in Cargo.toml; keep the two in step).
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --locked --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp

  # The compile tests of `#[tool]` (crates/adam/tests/ui), on the toolchain their
  # rustc-produced snapshots were written with. The errors the macro produces
  # itself run everywhere (nextest, stable); the ones rustc words itself change
  # between toolchains, so they run here only (ADAM_TRYBUILD=1). Keep this in
  # step with `rust-version`: after a bump, regenerate the snapshots with
  # `ADAM_TRYBUILD=1 TRYBUILD=overwrite cargo test -p adam --test ui`.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p adam --test ui --locked
        env:
          ADAM_TRYBUILD: "1"

  # Licenses, advisories, banned and unknown sources: see deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Every workflow file parses and is type-correct; shell in `run:` is shellchecked.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # Every Mermaid diagram parses (pinned Mermaid), every relative Markdown link
  # and #heading resolves, every crate has a README. See tools/docs-check.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned checker dependencies
        run: npm --prefix tools/docs-check ci --no-fund --no-audit
      - name: Check diagrams and links
        run: node tools/docs-check/check-docs.mjs

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported servers.
        include:
          - { postgres: "12", mongodb: "5.0" }
          - { postgres: "17", mongodb: "8.0" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports: ["27017:27017"]
    env:
      ADAM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/adam_test
      ADAM_TEST_MONGODB_URI: mongodb://localhost:27017
      # A database suite that would skip (variable unset) fails instead: see
      # adam_core::testing. Without this, a typo here turns the suites green.
      ADAM_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The coder's test against the real GitHub MCP server (bin/adam-coder/tests/binary.rs) needs the
      # binary the coder image carries: the same image, by the same tag and digest as
      # docker/coder/Dockerfile (keep the two in step). Without it that test skips itself.
      - name: The GitHub MCP server of the coder image
        run: |
          set -eu
          id=$(docker create ghcr.io/github/github-mcp-server:v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6)
          docker cp "$id:/server/github-mcp-server" "$RUNNER_TEMP/github-mcp-server"
          docker rm "$id" > /dev/null
          "$RUNNER_TEMP/github-mcp-server" --version
          echo "ADAM_TEST_GITHUB_MCP_SERVER=$RUNNER_TEMP/github-mcp-server" >> "$GITHUB_ENV"
      - name: Tests (memory, Postgres, MongoDB, coder end to end)
        run: cargo nextest run --workspace --locked --profile ci --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp
      # Run the database suites a second time: this pass exercises migrate() on
      # an existing schema. The offline suites (coder end to end) do not repeat.
      - name: Database suites again, on the migrated schema
        run: >-
          cargo nextest run --locked --profile ci
          -p adam-store-postgres -p adam-store-mongodb -p adam-runtime -p adam-a2a-runtime
          -p adam-notify-postgres

  # Line coverage of the whole workspace against the newest servers. The lcov
  # file is an artifact; the summary is on the run page; the gate ratchets.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      ADAM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/adam_test
      ADAM_TEST_MONGODB_URI: mongodb://localhost:27017
      ADAM_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      - name: Run the tests instrumented
        run: >-
          cargo llvm-cov nextest --workspace --locked --profile ci --features adam-llm-agent/schema,adam-assembly/dev,adam/dev,adam-assembly/mcp,adam/mcp
          --ignore-filename-regex "$COVERAGE_IGNORE" --no-report
      - name: lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COVERAGE_IGNORE"
      - name: Summary and gate
        run: |
          cargo llvm-cov report --summary-only --ignore-filename-regex "$COVERAGE_IGNORE" | tee summary.txt
          {
            echo "### Coverage"
            echo
            echo '```'
            cat summary.txt
            echo '```'
            echo
            echo "Gate: line coverage >= ${COVERAGE_MIN_LINES}%."
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" \
            --fail-under-lines "$COVERAGE_MIN_LINES" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: |
            lcov.info
            summary.txt
          if-no-files-found: ignore

  # compose.yaml must keep working: the WireMock mappings are exercised by the
  # real clients (OpenAiCompatible, GitHub), so they cannot rot.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compose files are valid
        run: |
          docker compose config -q
          docker compose --profile app config -q
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile app config -q
      - name: Start postgres and the mocks
        run: docker compose up -d --build --wait postgres mock-openai mock-github mock-github-mcp git-server
      - name: Smoke-test each service
        run: |
          set -eu
          # mock-openai: text answer, streamed answer ending in [DONE], 429.
          curl -fsS http://127.0.0.1:8081/v1/models | grep -q mock-model
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' | grep -q '"finish_reason": "stop"'
          curl -fsSN http://127.0.0.1:8081/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"m","stream":true,"messages":[{"role":"user","content":"hi"}]}' | grep -q '^data: \[DONE\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/v1/chat/completions \
            -H 'X-Mock-Scenario: rate-limit' -d '{"messages":[]}')" = 429
          # mock-openai, model mock-coder: the scripted coder starts by preparing the workspace.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"user","content":"add hello.txt"}]}' \
            | jq -e '.choices[0].message.tool_calls[0].function.name == "prepare_workspace"' > /dev/null
          # mock-openai, model mock-coder: a greeting is answered with the name and the one-sentence
          # summary that the two persona lines of the system prompt give (what the coder's
          # `agent/instructions.md` opens with), not with the workspace script ...
          want="I'm Coder. I take a repository you name. Which repository should I work on"
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"Your name is Coder.\nIn one sentence: I take a repository you name.\n"},{"role":"user","content":"Hi"}]}' \
            | jq -e --arg want "$want" '.choices[0].finish_reason == "stop" and (.choices[0].message.content | contains($want))' > /dev/null
          # ... a persona that is edited gives another answer, with no rebuild ...
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"Your name is Cody.\nIn one sentence: I only fix typos.\n"},{"role":"user","content":"hello there"}]}' \
            | jq -e '.choices[0].message.content | contains("Cody. I only fix typos.")' > /dev/null
          # ... and once the person has answered (the stop is the `ask_user` call stop00001 in the
          # history), the script goes on with the workspace.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"Hi"},{"role":"assistant","content":"Hi!","tool_calls":[{"id":"stop00001","type":"function","function":{"name":"ask_user","arguments":"{}"}}]},{"role":"tool","tool_call_id":"stop00001","content":"http://git-server:8080/local/sandbox.git, add hello.txt"}]}' \
            | jq -e '.choices[0].message.tool_calls[0] | .id == "coder-call-1" and .function.name == "prepare_workspace"' > /dev/null
          # mock-openai, model mock-assistant (the general agent, adam-agent): any request is answered in
          # role from the two persona lines of the system prompt, and a request that holds a tool result
          # gets the fixed text.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-assistant","messages":[{"role":"system","content":"Your name is Chat.\nIn one sentence: I talk things through.\n"},{"role":"user","content":"Hi"}]}' \
            | jq -e '.choices[0].finish_reason == "stop" and (.choices[0].message.content | contains("Hi! I'"'"'m Chat. I talk things through."))' > /dev/null
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-assistant","messages":[{"role":"system","content":"x"},{"role":"user","content":"Hi"},{"role":"assistant","content":null,"tool_calls":[{"id":"c1","type":"function","function":{"name":"search__web_search","arguments":"{}"}}]},{"role":"tool","tool_call_id":"c1","content":"1. A"}]}' \
            | jq -e '.choices[0].message.content | contains("That is all the mock assistant has to say")' > /dev/null
          # mock-openai, model mock-coder, a task that carries [mock:choices]: the coder asks three
          # questions at once, one `ask_user` call whose `choices` are the three questions ...
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:choices] set up the project"}]}' \
            | jq -e '.choices[0].message.tool_calls[0] | .id == "choices-call-1" and .function.name == "ask_user" and ((.function.arguments | fromjson | .choices | map(.id)) == ["db","auth","deploy"])' > /dev/null
          # ... and once the person has answered through the form (the answers are the tool result, as
          # `- db: pg` lines), it goes on: any other answer gets the general thanks.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:choices] set up the project"},{"role":"assistant","content":null,"tool_calls":[{"id":"choices-call-1","type":"function","function":{"name":"ask_user","arguments":"{}"}}]},{"role":"tool","tool_call_id":"choices-call-1","content":"The person answered through the interface:\n- db: pg\n- auth: keycloak\n- deploy: compose"}]}' \
            | jq -e '.choices[0].finish_reason == "stop" and (.choices[0].message.content == "Going with Postgres, Keycloak and Compose.")' > /dev/null
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-coder","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:choices] set up the project"},{"role":"assistant","content":null,"tool_calls":[{"id":"choices-call-1","type":"function","function":{"name":"ask_user","arguments":"{}"}}]},{"role":"tool","tool_call_id":"choices-call-1","content":"The person answered through the interface:\n- db: sqlite"}]}' \
            | jq -e '.choices[0].message.content == "Thanks, I have your answers."' > /dev/null
          # mock-openai, model mock-researcher, a question that carries [mock:cards]: the researcher
          # shows what it found, one `show` call with a Text, a Cards of three sources and a Mermaid graph ...
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-researcher","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:cards] what is async rust?"}]}' \
            | jq -e '.choices[0].message.tool_calls[0] | .id == "cards-call-1" and .function.name == "show" and ((.function.arguments | fromjson | .blocks | map(.component)) == ["Text","Cards","Mermaid"]) and ((.function.arguments | fromjson | .blocks[1].cards | length) == 3)' > /dev/null
          # ... and once the screen has answered the call (the id is in the history, whatever the result
          # was), it answers in words with the three links.
          curl -fsS http://127.0.0.1:8081/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-researcher","messages":[{"role":"system","content":"x"},{"role":"user","content":"[mock:cards] what is async rust?"},{"role":"assistant","content":null,"tool_calls":[{"id":"cards-call-1","type":"function","function":{"name":"show","arguments":"{}"}}]},{"role":"tool","tool_call_id":"cards-call-1","content":"Shown to the person."}]}' \
            | jq -e '.choices[0].finish_reason == "stop" and (.choices[0].message.content | contains("https://example.org/mock-search/1") and contains("https://example.org/mock-search/3"))' > /dev/null
          # mock-github: no open pull requests; creating one answers 201.
          test "$(curl -fsS 'http://127.0.0.1:8082/repos/local/sandbox/pulls?head=local:agent/x&state=open')" = '[]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/repos/local/sandbox/pulls \
            -d '{"title":"t","head":"agent/x","base":"main"}')" = 201
          # mock-github-mcp (the GitHub MCP server's endpoint): turned away without a bearer, and
          # `tools/list` lists the twelve read tools of the coder's allow-list.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/mcp \
            -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')" = 401
          curl -fsS http://127.0.0.1:8085/mcp -H 'Authorization: Bearer x' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | jq -e '.result.tools | length == 12' > /dev/null
          # git-server: clone, push a branch, see it on the remote.
          git clone -q http://127.0.0.1:8083/local/sandbox.git "$RUNNER_TEMP/sandbox"
          cd "$RUNNER_TEMP/sandbox"
          sh check.sh
          git checkout -q -b agent/ci
          echo hello > hello.txt
          git add hello.txt
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "add hello.txt"
          git push -q origin agent/ci
          git ls-remote --heads http://127.0.0.1:8083/local/sandbox.git | grep -q refs/heads/agent/ci
      - name: Real clients against the mocks
        env:
          ADAM_TEST_MOCK_OPENAI_URL: http://127.0.0.1:8081
          ADAM_TEST_MOCK_GITHUB_URL: http://127.0.0.1:8082
          ADAM_TEST_MOCK_GITHUB_MCP_URL: http://127.0.0.1:8085/mcp
        run: cargo test -p adam-model-openai -p adam-workspace -p adam-mcp --test wiremock_compose
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The devcontainer environment (crates/adam-devcontainer, ADR 0010) against a real rootless Podman
  # service and the real devcontainer CLI: dev/podman/README.md says what the service is given and why,
  # and what in this job was not verified before it ran here for the first time (the sysctl, podman-remote
  # from the distribution against a Podman 5.8.7 server, Compose resolving the relative seccomp path).
  # The test (crates/adam-devcontainer/tests/podman.rs) is gated; ADAM_TEST_REQUIRE_DEVCONTAINER makes
  # it fail instead of skipping, so a typo in the variables cannot turn the job green.
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEVCONTAINERS_CLI_VERSION: "0.89.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Ubuntu 24.04 stops unprivileged user namespaces under AppArmor, which a rootless Podman needs.
      - name: Let unprivileged user namespaces through AppArmor
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: The devcontainer CLI and Podman's remote client
        run: |
          set -eu
          npm install -g --no-fund --no-audit "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"
          devcontainer --version
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman-remote
          podman-remote --version
      - name: A rootless Podman service beside a directory it shares with the test
        run: |
          set -eu
          # Outside the runner's home (/home/runner is mode 0750): uid 10001 must reach both, and the
          # test binary that runs as uid 10001 is copied into the first.
          work=/tmp/adam-devcontainer
          sock=/tmp/adam-podman
          # uid 10001 is `agent` in the coder's image; the runner has no such user, and the devcontainer
          # CLI asks for the name of the user it runs as (`id -u -n`) before it reads a configuration.
          getent passwd 10001 >/dev/null || sudo useradd --uid 10001 --user-group --no-create-home \
            --home-dir "$work" --shell /bin/sh agent
          sudo install -d -o 10001 -g 10001 -m 0755 "$work" "$sock"
          {
            echo "PODMAN_SOCKET_DIR=$sock"
            echo "PODMAN_WORK=$work"
            echo "PODMAN_WORK_TARGET=$work"
          } >> "$GITHUB_ENV"
          PODMAN_SOCKET_DIR="$sock" PODMAN_WORK="$work" PODMAN_WORK_TARGET="$work" \
            docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile app up -d --build --wait podman
      - name: The devbox fixture in its devcontainer
        run: |
          set -eu
          bin=$(cargo test --locked -p adam-devcontainer --test podman --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "podman") | .executable' | tail -n 1)
          test -x "$bin"
          # The service runs as uid 10001, so does the test: what a container makes in the shared
          # directory is then the test's own outside. It runs from that directory (the runner's home
          # is not open to another user), and with this job's PATH (sudo's own has no node, which
          # the devcontainer CLI is a script of).
          sudo install -o 10001 -g 10001 -m 0755 "$bin" "$PODMAN_WORK/podman-test"
          sudo -E setpriv --reuid 10001 --regid 10001 --clear-groups env \
            PATH="$PATH" \
            ADAM_TEST_DEVCONTAINER=1 ADAM_TEST_REQUIRE_DEVCONTAINER=1 \
            CONTAINER_HOST="unix://$PODMAN_SOCKET_DIR/podman.sock" \
            ADAM_TEST_DEVCONTAINER_ROOT="$PODMAN_WORK" \
            ADAM_TEST_DEVCONTAINER_DNS_NAME=podman \
            ADAM_TEST_DEVCONTAINER_UP_SECS=600 \
            HOME="$PODMAN_WORK" "$PODMAN_WORK/podman-test" --nocapture
      - name: Logs
        if: failure()
        run: |
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile app logs --no-color podman
          # What the service holds and what was still running when the test gave up.
          podman-remote --url "unix://$PODMAN_SOCKET_DIR/podman.sock" ps -a || true
          podman-remote --url "unix://$PODMAN_SOCKET_DIR/podman.sock" images || true
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile app exec -T podman ps -ef || true
          pgrep -a -f 'devcontainer|podman|node' || true
          sudo find "$PODMAN_WORK" -name build.log -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile app down -v
